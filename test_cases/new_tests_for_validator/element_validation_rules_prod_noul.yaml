# Критерии валидации 9 элементов невроза для модели Laya (тип noul, нейтральные подписи A/B).
#
# Файл настраивается прогоном `python tools\laya_probe.py --onnx --labels both`
# по 12 кейсам `test_cases/new_tests_for_validator/cases.yaml`.
# Правка без прогона = правка вслепую (docs/LAYA_MODEL.md §8 п.7).
#
# Правила формулировки (docs/LAYA_MODEL.md §4.5, §4.11, §4.12, §11):
#   1. Критерий — через наблюдаемый речевой акт пациента, а не через определение.
#   2. `false_criteria` НЕ перечисляет токены из `true_criteria` («нет X», «без X»,
#      «отсутствие X»): у зеркальной пары 90% токенов совпадают, модель валится
#      в угадывание (§4.11, замерено: 78.7% -> 66.7%).
#   3. `false_criteria` — другой вид того же страдания, а НЕ «норма» и НЕ
#      «нейтральные обстоятельства»: пациент в психотерапии не пишет о здоровье,
#      и модель отбрасывает нормативный полюс, переходя на `true` (§4.12).
#   4. Слово «соматика» и прочие телесные маркеры в критериях ЗАПРЕЩЕНЫ: соматика
#      вырезается из входа на препроцессинге (дополнение к §11.4), и в критериях
#      ей нечего описывать.
#   5. Слова `false_criteria` не должны ловиться текстом пациента: ложное
#      срабатывание полюса = ложный элемент у клиента. Проверенная история:
#      полюс «общий фоновый дискомфорт» цеплялся к слову «фоном» в жалобах и
#      давал e6=false там, где триггер назван.
#   6. Каждый элемент настраивается по СВОИМ промахам: вопросы Laya независимы
#      (отдельная строка батча на элемент), поэтому правка одного элемента не
#      влияет на остальные — проверяется сравнением попрльно по элементам.

elements:
  1:
    name: "Сопротивление"
    question_type: noul
    question: "Говорит ли человек прямо, что у него мысль или действие стоят и не сдвигаются: блок, тупик, застревание, кручение по кругу?"
    true_criteria: "прямо сказано, что мысль или действие стоят: блок, тупик, застревание, невозможность сдвинуться, хождение по кругу"
    false_criteria: "жалоба на самочувствие и настроение: слабость, усталость, грусть, тревога, пустота"

  2:
    name: "Поведение"
    question_type: noul
    question: "Описана ли собственная модель поведения человека, попытки справиться или избегание?"
    true_criteria: "собственная модель поведения человека, его попытки что-то сделать или изменить"
    false_criteria: "желания, действия и намерения посторонних людей"

  3:
    name: "Катастрофа"
    question_type: noul
    question: "Названо ли непереносимое крушение при распаде защит или только текущая реакция на нерешенную проблему?"
    true_criteria: "непереносимое крушение жизни при распаде защит"
    false_criteria: "текущая эмоциональная реакция на затруднение или проблему"

  4:
    name: "Самооценка"
    question_type: noul
    question: "Дает ли человек прямую качественную оценку своей личности в виде негативной Я-концепции?"
    true_criteria: "прямая качественная оценка дефектности или неполноценности своего Я"
    false_criteria: "описание обстоятельств, физиологических симптомов или событий без самооценки"

  5:
    name: "Правила"
    question_type: noul
    question: "Есть ли четкое категорическое правило, жесткий запрет или императивное долженствование («должен», «обязан»)?"
    true_criteria: "четкое категорическое правило, жесткий запрет или долженствование"
    false_criteria: "мягкое пожелание, совет, обычные причинно-следственные связи или предпочтение"

  6:
    name: "Триггер"
    question_type: noul
    question: "Назван ли конкретный пусковой фактор в конкретной ситуации, запустивший реакцию, не являющийся соматикой?"
    true_criteria: "конкретный пусковой фактор в конкретной ситуации"
    false_criteria: "общий фоновый дискомфорт без пускового фактора или соматика"

  7:
    name: "Эмоции"
    question_type: noul
    question: "Описана ли конкретная повторяющаяся эмоция (страх, вина, стыд, гнев, тревога), питающая проблему?"
    true_criteria: "названа конкретная повторяющаяся эмоция или аффект"
    false_criteria: "физические ощущения тела или факты без названной эмоции"

  8:
    name: "Иллюзии"
    question_type: noul
    question: "Есть ли искажение мировоззрения: чужой замысел приписывается, скрытое выдаётся за очевидное, выводы о людях и мире неверны?"
    true_criteria: "искажение мировоззрения: чужой замысел приписывается, скрытое выдаётся за очевидное, выводы о людях и мире неверны"
    false_criteria: "факты и события без искажения, прямая констатация того, что произошло"

  9:
    name: "Идол"
    question_type: noul
    question: "Видно ли идеальное состояние или фальшивое желание, в которое человек хочет сбежать, чтобы заглушить проблему?"
    true_criteria: "суррогатная потребность или идеальное состояние для побега"
    false_criteria: "естественная потребность или отсутствие идеализированного побега"
