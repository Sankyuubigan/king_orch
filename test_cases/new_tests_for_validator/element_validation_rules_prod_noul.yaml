# Критерии валидации 9 элементов невроза для модели Laya (тип noul, нейтральные подписи A/B).
#
# Файл настраивается прогоном `python tools\laya_probe.py --onnx --labels both`
# по 12 кейсам `test_cases/new_tests_for_validator/cases.yaml`.
# Правка без прогона = правка вслепую (docs/LAYA_MODEL.md §8 п.7).
#
# Правила формулировки (docs/LAYA_MODEL.md §4.5, §4.11, §4.12, §11):
#   1. Критерий — ФУНКЦИОНАЛЬНОЕ ОПИСАНИЕ РЕЧЕВОГО АКТА: что именно человек делает
#      в речи. НЕ перечисление слов в кавычках/скобках (хардкод токенов сужает класс,
#      ловит случайные совпадения и не обобщается) и НЕ клинический жаргон
#      («Я-концепция», «дефектность Я», «суррогатная потребность»): таких слов
#      в жалобах клиентов нет, эмбеддинги не сходятся.
#   2. `false_criteria` НЕ перечисляет токены из `true_criteria` («нет X», «без X»,
#      «отсутствие X»): у зеркальной пары 90% токенов совпадают, модель валится
#      в угадывание (§4.11, замерено: 78.7% -> 66.7%).
#   3. `false_criteria` — другой вид того же страдания, а НЕ «норма» и НЕ
#      «нейтральные обстоятельства»: пациент в психотерапии не пишет о здоровье,
#      и модель отбрасывает нормативный полюс, переходя на `true` (§4.12).
#   4. Слово «соматика» и прочие телесные маркеры в критериях ЗАПРЕЩЕНЫ: соматика
#      вырезается из входа на препроцессинге (дополнение к §11.4), и в критериях
#      ей нечего описывать.
#   5. Слова `false_criteria` не должны ловиться текстом пациента: ложное
#      срабатывание полюса = ложный элемент у клиента. Проверенная история:
#      полюс «общий фоновый дискомфорт» цеплялся к слову «фоном» в жалобах и
#      давал e6=false там, где триггер назван.
#   6. Каждый элемент настраивается по СВОИМ промахам: вопросы Laya независимы
#      (отдельная строка батча на элемент), поэтому правка одного элемента не
#      влияет на остальные — проверяется сравнением попрольно по элементам.
#   7. ВЫЧИСТКА ХАРДКОДА ПО ОДНОМУ ЭЛЕМЕНТУ, С ЗАМЕРОМ ПОСЛЕ КАЖДОГО. Пакетная
#      правка всех девяти дала регресс 80 -> 76 из 108: элементы тянут в разные
#      стороны, и общий заход перетирает выигрыш (проверено, см. tasks/).

elements:
  1:
    name: "Сопротивление"
    question_type: noul
    question: "Говорит ли человек прямо, что у него мысль или действие стоят и не сдвигаются: блок, тупик, застревание, кручение по кругу?"
    true_criteria: "прямо сказано, что мысль или действие стоят: блок, тупик, застревание, невозможность сдвинуться, хождение по кругу"
    false_criteria: "жалоба на самочувствие и настроение: слабость, усталость, грусть, тревога"

  2:
    name: "Поведение"
    question_type: noul
    question: "Описана ли собственная модель поведения человека, попытки справиться или избегание?"
    true_criteria: "собственная модель поведения, попытки решения или реакция избегания"
    false_criteria: "желания, действия посторонних людей или физиологические проявления"

  3:
    name: "Катастрофа"
    question_type: noul
    question: "Названо ли непереносимое крушение при распаде защит или только текущая реакция на нерешенную проблему?"
    true_criteria: "непереносимое крушение жизни при распаде защит, включая гибель, исчезновение или полное истощение самого себя"
    false_criteria: "текущая эмоциональная реакция на затруднение: неспособность справиться, отвращение или чужое давление"

  4:
    name: "Самооценка"
    question_type: noul
    question: "Дает ли человек прямую оценку своей личности как ущербной, неполноценной или ничтожной?"
    true_criteria: "прямое приписывание своей личности статуса ущербности, неполноценности, дефектности или слабости"
    false_criteria: "переживание из-за внешних препятствий, сложности задач, несовершенства мира или нехватки сил"

  5:
    name: "Правила"
    question_type: noul
    question: "Навязывает ли человек себе или миру требование, которому нельзя не подчиниться?"
    true_criteria: "категорический запрет или безусловное требование подчиниться, без исключений"
    false_criteria: "причинно-следственная связь, пожелание или описание того, что и так происходит"

  6:
    name: "Триггер"
    question_type: noul
    question: "Описан ли конкретный пусковой фактор: взаимодействие, условие, момент, действие или мысль, с которой связана реакция?"
    true_criteria: "назван пусковой стимул: взаимодействие, условие, момент, действие или мысль, запускающая реакцию"
    false_criteria: "жалоба на общее самочувствие или непрерывное состояние, ощущаемое изо дня в день"
    threshold: 0.36

  7:
    name: "Эмоции"
    question_type: noul
    question: "Названа ли человеком переживаемая эмоция, которая повторяется и подпитывает проблему?"
    true_criteria: "названа переживаемая эмоция, повторяющаяся как топливо проблемы"
    false_criteria: "переживания без названной эмоции, факты и ощущения тела"

  8:
    name: "Иллюзии"
    question_type: noul
    question: "Есть ли искажение мировоззрения: чужой замысел приписывается, скрытое выдаётся за очевидное, выводы о людях и мире неверны?"
    true_criteria: "искажение мировоззрения: чужой замысел приписывается, скрытое выдаётся за очевидное, выводы о людях и мире неверны"
    false_criteria: "факты и события без искажения, прямая констатация того, что произошло"

  9:
    name: "Идол"
    question_type: noul
    question: "Наделяет ли человек фантазию, ритуал или особое состояние спасительной силой, чтобы укрыться от проблемы?"
    true_criteria: "спасение ищется в идеальном состоянии, ритуале или зависимости, к которым человек сам прибегает, вместо решения проблемы"
    false_criteria: "прямое стремление разобраться с проблемой в реальности, без спасительного фасада"
