      - "Руки трясутся мелкой дрожью, в горле пересохло, голос срывается."
    mental_fragments:
      - "Мне безумно стыдно выступать, кажется, что все заметят мою неуверенность и будут смеяться надо мной."
    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: true
      e7: true
      e8: true
      e9: false
    prompt: |-
      Руки трясутся мелкой дрожью, в горле пересохло, голос срывается. Мне безумно стыдно выступать, кажется, что все заметят мою неуверенность и будут смеяться надо мной.

