    note: "Дрожь в руках и сухость во рту (соматика) + стыд и страх опозориться. Ожидаются e6, e7, e8. Правка по независимой проверке ses_ef2006b52ffeJ5zsOW0mRD3wO8: e4 -> false (стыд и страх оценки, а не приписывание себе дефектности, Р4), e8 -> true (чтение мыслей «все заметят и будут смеяться»)."
