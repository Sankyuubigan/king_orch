  - id: somatic_stomach_short
    note: "Ультракороткий симптом ЖКТ (25 симв.)."
    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: false
      e8: false
      e9: false
    prompt: |-
      Болит живот справа внизу.

  - id: somatic_repo_headache
    note: "Реальный соматический текст из test_cases_for_soma_translator.yaml (391 симв.)."
    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: false
      e8: false
      e9: false
    prompt: |-
      У меня сильно болит голова, боль острая. Болит слева висок левый и отдаёт боль в левый глаз. Также под затылком слева болит в том месте где начинается шея. Шея спазмирована в этом месте. Я проснулся от этой боли, и мне пришлось встать даже несмотря на то что я не до конца выспался. Мне пришлось лечить эту боль и я не мог её игнорировать. Я мужчина, биологический левша. Эта боль мешает мне делать дела.
