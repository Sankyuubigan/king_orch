      Я постоянно сонливый весь день. При этом бессонница у меня. Не могу почему-то уснуть и заснуть поспать, поэтому сонливый хожу всегда. Сегодня за ночь удалось поспать лишь 3 часа. Сегодня надо будет пойти по делам, я договаривался. Это мне мешает.

