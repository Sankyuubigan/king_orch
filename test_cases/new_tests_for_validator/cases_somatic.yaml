    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: false
      e8: false
      e9: false
    prompt: |-
      Болит поясница третий день.

  - id: somatic_short_back
    note: "Короткий запрос: спина, движение, сон (91 симв.)."
    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: false
      e8: false
      e9: false
    prompt: |-
      Третий день болит поясница. Поднимаюсь по лестнице — больно. Ночью ворочаюсь, трудно лечь.

  - id: somatic_medium_back
    note: "Средний запрос: спина, врач, таблетки, длительность (211 симв.)."
    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: false
      e8: false
      e9: false
    prompt: |-
      Три недели болит поясница, отдаёт в правую ягодицу. Врач сказал, что это зажим мышц, прописал курс таблеток и предложил плавать. Ночью боль не даёт заснуть, сплю по 3-4 часа.

  - id: somatic_long_back
    note: "Длинный развёрнутый запрос: спина, МРТ, уколы, анальгетики, быт (489 симв.). Чистая соматика."
    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: false
      e8: false
      e9: false
    prompt: |-
      Уже второй месяц беспокоит поясничный отдел позвоночника. Сделал МРТ: протрузии L4-L5 и L5-S1, остеохондроз второй степени. Невролог назначил курс миорелаксантов и витамины группы B, проколол десять дней. Острая боль ушла, но осталась тупая ноющая тяжесть в крестце, усиливается после долгого сидения за рулём или работы за столом. По утрам тяжело наклоняться, чтобы надеть носки или обувь, требуется минут пятнадцать расходиться. Мази с диклофенаком дают временное облегчение часа на два-три.

  - id: somatic_throat_fever
    note: "Короткий запрос: простуда, температура, горло (142 симв.)."
    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: false
      e8: false
      e9: false
    prompt: |-
      Болит горло, температура 38.2 и держится вторые сутки. Глотать тяжело, есть почти не могу, поэтому сегодня пил только воду. Голова немного гудит.

  - id: somatic_sinus_pure
    note: "Парный кейс 1: чистый гайморит без эмоций и страхов (156 симв.)."
    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: false
      e8: false
      e9: false
    prompt: |-
      Хронический гайморит два года. Болит область над правой бровью и переносица, закладывает нос, особенно ночью. Температуры нет, но голова тупая, как в вате.

  - id: somatic_sinus_with_fear
    note: "Парный кейс 2: тот же гайморит + назван страх операции (e7=true) (246 симв.)."
    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: true
      e8: false
      e9: false
    prompt: |-
      Хронический гайморит два года. Болит область над правой бровью и переносица, закладывает нос, особенно ночью. Температуры нет, но голова тупая, как в вате. Врач предлагает прокол или операцию, но меня накрывает сильный страх перед больницей и наркозом.

  - id: somatic_migraine_pure
    note: "Развёрнутая мигрень: тошнота, темнота, цикл, анальгетики (377 симв.). Без психологических интерпретаций."
    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: false
      e8: false
      e9: false
    prompt: |-
      Приступы головной боли два раза в неделю. Боль острая, пульсирующая в правом виске, отдаёт в глазницу и затылок. Во время приступа тошнит, темнеет в глазах, раздражает любой дневной свет и громкие звуки. Приходится зашторивать окна и лежать с закрытыми глазами. Приступы чётко учащаются в первые дни менструального цикла. Обычные обезболивающие помогают слабо.

  - id: somatic_hangover
    note: "Ультракороткий бытовой физиологический сбой (63 симв.)."
    expected:
      e1: false
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: false
      e8: false
      e9: false
