version: 1

cases:
  - id: task1
    note: "Эталонный кейс 1. Эталон взят из validation1.json, текст — из task1.md папки psychotherapist_validator_e1_e9."
    expected:
      e1: true
      e2: true
      e3: false
      e4: false
      e5: true
      e6: true
      e7: true
      e8: true
      e9: true
    prompt: |-
      Я мужчина. Мой запрос связан с глубоким внутренним блоком: я не могу войти в состояние сексуального возбуждения и почувствовать влечение.
      Внутри присутствует постоянное фоновое напряжение и неудовлетворенность, но полностью отсутствует первичный стартовый импульс. Проблема носит тотальный характер — она проявляется не только в прямом контакте с женщинами, но и автономно: отклик заблокирован даже при попытках самостоятельного возбуждения через стимулы или контент. Либидо подавлено, нет точки входа в процесс.
      В динамике отношений я занимаю пассивную позицию. Для меня критически важно, чтобы женщина проявляла явную, доминирующую инициативу, открыто демонстрировала сильное сексуальное желание и сама делала первые шаги. Любую сдержанность или нейтральность со стороны партнерши я воспринимаю как холодность и закрытость. Из-за отсутствия собственного внутреннего зажигания я бессознательно жду, чтобы этот "огонь" пришел полностью извне и запустил мой отклик.
      Из-за постоянного тупика и невозможности разрядить это напряжение внутри поднимается сильнейший аффект — глухая, яростная агрессия на этот блок и невозможность им управлять.

  - id: task2
    note: "Эталонный кейс 2. Эталон взят из validation2.json, текст — из task2.md папки psychotherapist_validator_e1_e9."
    expected:
      e1: true
      e2: false
      e3: false
      e4: false
      e5: false
      e6: false
      e7: false
      e8: false
      e9: false
    prompt: |-
      Я мужчина. Мой запрос связан с глубоким внутренним блоком: я не могу войти в состояние сексуального возбуждения и почувствовать влечение.
      Внутри присутствует постоянное фоновое напряжение и неудовлетворенность, но полностью отсутствует первичный стартовый импульс.
      в отношениях я люблю "горячих" девушек - активных с явной инициативой, которые открыто и интенсивно демонстрируют сильное сексуальное желание и сами делают первые шаги.

  - id: task3
    note: "Кейс 1 из task13etc (вырезана анатомия таза/ног). четвертый тип"
    expected:
      e1: true
      e2: false
      e3: true
      e4: false
      e5: false
      e6: true
      e7: true
      e8: true
      e9: false
    prompt: |-
      У меня совсем нет сил, с ног валюсь. Постоянно хочется прилечь отдохнуть.
      Любые активные действия заблокированы: даже на просмотр или запуск фильма стоит блок, так как внутри сидит страх любой инициативы и действий. Держится страх смерти уникальности и исчезновения меня как Личности, сильное неприятие рутины и вязкости бытовой материи.

  - id: task4
    note: "Кейс 2 из task13etc (вырезаны зубы, залысины, левшество). третий тип"
    expected:
      e1: false
      e2: false
      e3: true
      e4: true
      e5: false
      e6: true
      e7: true
      e8: true
      e9: false
    prompt: |-
      Я мужчина. У меня есть постоянный страх, что мой социальный ранг понизится в ноль, и что люди будут смотреть на меня как на убогого. Сильнее всего это проявляется с девушками (мнение мужчин для меня не важно). Если девушки будут считать меня убогим и социально мертвым, то они будут меня избегать.

  - id: task5
    note: "Кейс 3 из task13etc (соматики не было изначально). восьмой тип"
    expected:
      e1: false
      e2: false
      e3: true
      e4: false
      e5: false
      e6: true
      e7: true
      e8: true
      e9: false
    prompt: |-
      Мне часто снятся тревожные сны о том, что границы моего безопасного пространства пробиваются внешней угрозой, и никакие барьеры не способны меня защитить. Во сне я ощущаю себя беззащитным свидетелем, который не в силах противостоять смертоносной силе.
      В реальности за этим кошмаром стоит глубокий страх перед мягким, заботливым типом женщин. Внутри есть убеждение, что за чужой нежностью и опекой кроется скрытая угроза: страх, что заботливая женщина постепенно подчинит меня себе, полностью сожрёт мою волю и я потеряю автономию и независимость. Любое проявление заботы я воспринимаю как попытку захвата моих границ.

  - id: task6
    note: "Кейс 4 из task13etc (вырезана мигрень и анатомия головы). четвертый тип"
    expected:
      e1: false
      e2: true
      e3: false
      e4: false
      e5: false
      e6: false
      e7: true
      e8: true
      e9: false
    prompt: |-
      Совсем нет сил. Спал достаточно, но после пробуждения состояние полного отсутствия сил. Постоянно хочется прилечь на кровать, но уснуть не могу, так как спать не хочу, хотя в голове тупая сонливость. Фоном идет тоскливая грусть.
      Внутри сидит страх капитуляции перед серой, бессмысленной реальностью и повседневной рутиной.

  - id: task7
    note: "Кейс 5 из task13etc (вырезан первый абзац с мигренью и синуситом). четвертый тип"
    expected:
      e1: false
      e2: true
      e3: true
      e4: true
      e5: true
      e6: true
      e7: true
      e8: true
      e9: true
    prompt: |-
      Снился сон, что я заперт в тесном контейнере, не могу пошевелиться, нас незаконно куда-то везут. Другие люди в контейнере понимали происходящее и были согласны терпеть пытку ради цели, а я был в ужасе и понимал, что не выдержу.
      В реальности мой страх в том, что я оказался слабее других. То, что для людей в моем окружении является приемлемой платой и нормой, которую надо перетерпеть, для меня оказалось смертельной ловушкой. Я пошел против правил Системы и остался в изоляции без ресурсов. Боюсь, что в одиночку не вывезу этот путь, и я разрушусь раньше, чем выстрою свою систему.

  - id: task8
    note: "Кейс 6 из task13etc (вырезаны щитовидка и телесный дискомфорт). шестой тип"
    expected:
      e1: false
      e2: true
      e3: true
      e4: false
      e5: false
      e6: true
      e7: true
      e8: true
      e9: true
    prompt: |-
      Если я не выпиваю больше 4 дней БАД келп (ламинарию), то появляются выраженные симптомы: фоновая тревога, бессонница. Я зависим от приема этой добавки: без нее не могу спать больше 3–4 часов подряд, сон критически рушится.
      В основе лежит ужас тотальной слепой беспомощности — страх оказаться без брони перед лицом проникающей, невидимой внешней угрозы, которую я не способен ни предсказать, ни отразить.

  - id: task9
    note: "Кейс 7 из task13etc (вырезаны тестостерон и физиологические детали). первый тип"
    expected:
      e1: true
      e2: true
      e3: false
      e4: false
      e5: true
      e6: true
      e7: true
      e8: true
      e9: true
    prompt: |-
      Я мужчина, живу один, детей нет. Либидо на нуле, в фоне легкая постоянная грусть, в жизни не хватает красок. При взаимодействии с девушками отклика нет, из-за чего возникает сильный дискомфорт.
      Редко, спонтанно раз в несколько месяцев, у меня случается состояние, когда я заряжен мощной энергией: девушки воспринимаются ярко, исчезают сомнительные фетиши, улучшается поведение. Я хочу находиться в этом состоянии всегда как в норме — оно кажется правильным, чистым и гармоничным.
      В глубине есть сильный страх сырого, животного и агрессивного сексуального влечения, так как внутри оно заблокировано как грязный акт осквернения.

  - id: task10
    note: "Кейс 8 из task13etc (вырезана головная боль и левшество). пятый тип"
    expected:
      e1: true
      e2: true
      e3: true
      e4: true
      e5: true
      e6: true
      e7: true
      e8: true
      e9: true
    prompt: |-
      Мужчина, живу один.
      Я болезненно зависим от видимого прогресса за день. Кажется, что стою на месте, хотя объективно продвигаюсь. По утрам нет сил встать, ночью мучает бессонница, а днем вырубает в спонтанные отключки, падаю без сил. Целыми днями занимаюсь психотерапией самого себя, очень устал бесконечно прорабатываться. Фоном давит печаль и грусть, тянет заесть ее едой.
      В основе лежит страх, что любые усилия напрасны: страх тотального бессилия, некомпетентности и распыления. Ужас вложить энергию и оказаться севшей «батарейкой», которую мир использовал и выбросил без отдачи. Из-за этого я бессознательно пытаюсь законсервировать ресурсы через полное бездействие.

  - id: task11
    note: "Кейс 9 из task13etc (вырезан диагноз щитовидки). седьмой тип"
    expected:
      e1: true
      e2: true
      e3: true
      e4: true
      e5: true
      e6: true
      e7: true
      e8: true
      e9: true
    prompt: |-
      У меня бессонница, сопротивление сну и зависимость от келпа. По вечерам накрывает неудовлетворенность: чтобы уснуть, мне обязательно требуется искусственно создать хорошее настроение и насытиться чем-то приятным.
      В основе лежат два страха:
      1. Страх растворения и стирания границ: без плотных ощущений (вкусная еда, яркая эмоция) я теряю ощущение себя, а провалиться в сон — значит раствориться в темноте и исчезнуть.
      2. Страх пустоты: оставаясь в тишине наедине с внутренним напряжением и белым шумом, я боюсь, что эта пустота меня сожрет, поэтому мне жизненно необходимо заглушить ее чем-то вкусным.

  - id: task12
    note: "Кейс 10 из task13etc (соматики не было изначально). пятый тип"
    expected:
      e1: true
      e2: true
      e3: true
      e4: true
      e5: false
      e6: true
      e7: true
      e8: true
      e9: true
    prompt: |-
      Провалы в памяти: мысли моментально теряются, забываю, что хотел сказать минуту назад, сразу после сна забываю сновидения. При этом потеря памяти парадоксально приносит облегчение — ощущение, что можно ничего не делать, не напрягаться и не суетиться. Любая попытка сосредоточиться вызывает сопротивление.
      При этом есть мечта: нырять в чертоги разума легко, как рыба в воду, доставать любые знания без малейшего напряжения и обладать абсолютной памятью.
      В глубине кроется ужас умственной инвалидности: страх деградировать в овоща с разрушенным мозгом, стать заторможенным идиотом и дурачком, на которого окружающие смотрят с жалостью. Провалы памяти происходят как защитное бегство из-за нежелания присутствовать в этой реальности.
