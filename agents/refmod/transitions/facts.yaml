# Факты и промпт для экстрактора RefMod-графа
# Загружается из refmod-flow.yaml через config.facts_file

output_fields:
  - id: rewritten_query
    field_type: string
    required: true

extractor_prompt: |
  Ты — системный анализатор запросов. Прочитай сообщение пользователя и историю сессии.
  Выполни ДВЕ задачи:

  ЗАДАЧА 1 — определи факты (boolean) по критериям ниже:
  {{ facts }}

  ЗАДАЧА 2 — перепиши запрос (rewritten_query):
  Перепиши ПОСЛЕДНИЙ запрос пользователя в самодостаточную форму — что именно
  нужно с карточкой персонажа, понятно БЕЗ истории диалога: создать персонажа
  из фото (какие кадры есть) или изменить существующую карточку (что изменить,
  какой персонаж). Поле rewritten_query ОБЯЗАТЕЛЬНО: возвращай его ВСЕГДА.
  Если запрос уже самодостаточен — передай его максимально близко к оригиналу,
  не выбрасывай детали и не переписывай стиль.

  Сообщение пользователя:
  {{ user_message }}

  Изображения в чате (прикреплённые сейчас или появившиеся в истории
  переписки):
  {{ refmod_image_candidates }}

  ПРИОРИТЕТ ОПРЕДЕЛЕНИЯ (взаимоисключающие):
  1. Пользователь просит СОЗДАТЬ персонажа/карточку из прикреплённых фото →
     needs_refmod_create = TRUE, needs_refmod_edit = FALSE.
  2. Пользователь просит ИЗМЕНИТЬ/СКОМБИНИРОВАТЬ уже существующую карточку →
     needs_refmod_edit = TRUE, needs_refmod_create = FALSE.
  3. Оба маркера не распознаны (вопрос о возможностях, расплывчатое описание,
     просьба не про карточки) → оба FALSE.

  Ответь ТОЛЬКО JSON без пояснений и без markdown-фенсов:
  {"needs_refmod_create": true/false, "needs_refmod_edit": true/false, "rewritten_query": "переписанный запрос"}

facts:
  - id: needs_refmod_create
    criteria: |
      TRUE если пользователь просит СОЗДАТЬ карточку/персонажа/рефмод из фото:
      - «собери персонажа из этих фото», «сделай рефмод/карточку», «создай
        постоянного персонажа» (фото прикреплены сейчас или уже есть в чате)
      - описание персонажа с явной просьбой сохранить его для видео/картинок
      FALSE если просят изменить уже существующую карточку, ответить вопросом
      о возможностях или речь вообще не про карточки персонажей. При
      сомнении — FALSE.

  - id: needs_refmod_edit
    criteria: |
      TRUE если пользователь просит ИЗМЕНИТЬ СУЩЕСТВУЮЩУЮ карточку персонажа:
      - изменить телосложение (стройнее/шире), оттенок (волосы, кожа,
        одежда) у названного или очевидного персонажа из каталога
      - скомбинировать карточки (склейка двух персонажей вертикально)
      - сделать вариант карточки (вторая версия, вариация внешности)
      FALSE если создают нового персонажа из фото, просто спрашивают о
      возможностях или речь не про карточки. При сомнении — FALSE.
