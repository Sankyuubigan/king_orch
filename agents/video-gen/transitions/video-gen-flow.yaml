name: Видео по описанию
description: Генерация короткого видео со звуком по текстовому описанию или по вложению в роли первого кадра / референса (MiniMax H3).

config:
  facts_file: facts.yaml
  default_llm_params: creative

# Точка входа графа — текст, отправленный пользователем в чат.
entry: user_message

nodes:
  # ── Источник данных: текст пользователя (без LLM) ──
  - id: user_message
    type: user_message
    ui_pos:
      x: -320
      y: 40

  # ── Классификация: видео-запрос? + РОЛЬ вложения (первый кадр / референс /
  #    неоднозначно). Грамматика фактов строится по facts.yaml автоматически:
  #    role_* добавились в контракт вместе с фактами. ──
  - id: extract_facts
    type: llm_fact_extractor
    input: "{{ nodes.user_message.output.text }}"
    llm_params: strict
    ui_pos:
      x: -80
      y: 40

  - id: route
    type: switch
    input_object: "{{ nodes.extract_facts.output }}"
    cases_priority:
      # Развилка роли (только когда есть вложения и просит видео):
      # сомнение = состояние «информации нет» → вопрос, а не угадывание (§00.2).
      - key: role_unknown
        to: clarify_video_role
      - key: role_first_frame
        to: enhance_prompt_first_frame
      - key: role_reference
        to: enhance_prompt_reference
      # Без вложений (или экстрактор не увидел картинок) — прежний путь:
      - key: needs_video_generate
        to: enhance_prompt_video
    default: no_video_task
    ui_pos:
      x: 140
      y: 40

  # ── Промпт-энхансеры (зеркало image-gen): backend-ноды ДО терминальных
  #    исполнителей; результат потребляется через
  #    {{ nodes.enhance_prompt_*.output.result }}. Не потокят в чат. ──

  - id: enhance_prompt_video
    type: llm_worker
    agent: video_prompt_enhancer
    task: |
      Режим: ГЕНЕРАЦИЯ видео с нуля (без вложений).

      Исходная идея пользователя: {{ nodes.user_message.output.text }}
    ui_pos:
      x: 250
      y: -40

  - id: enhance_prompt_first_frame
    type: llm_worker
    agent: video_prompt_enhancer
    task: |
      Режим: ПЕРВЫЙ КАДР. Пользователь просит оживить само изображение из чата:
      вложение — первый кадр ролика, его композиция сохраняется. Опиши краткое
      движение/развитие сцены от этого кадра и звук; в английском промпте укажи,
      что первый кадр предоставлен отдельно (движок подтянет вложение сам).

      Идея пользователя: {{ nodes.user_message.output.text }}
    ui_pos:
      x: 250
      y: -120

  - id: enhance_prompt_reference
    type: llm_worker
    agent: video_prompt_enhancer
    task: |
      Режим: РЕФЕРЕНС. Вложение — источник внешности/персонажа/предмета/стиля,
      а сцена описана словами и создаётся заново. В английском промпте опиши
      ТОЛЬКО новую сцену и действие; не описывай референс как содержимое кадра —
      движок подтянет внешность из вложения сам.

      Идея пользователя: {{ nodes.user_message.output.text }}
    ui_pos:
      x: 250
      y: 100

  # ── Ветка генерации (терминальная) ──
  - id: make_video
    type: llm_worker
    agent: video_maker
    task: |
      Сгенерируй видео по описанию пользователя.

      Описание задачи: {{ nodes.extract_facts.output.rewritten_query }}
      Исходный текст пользователя: {{ nodes.user_message.output.text }}

      Улучшенный промпт (заготовка от Улучшителя — используй как основу для
      своего английского промпта): {{ nodes.enhance_prompt_video.output.result }}

      Доступные LoRA пользователя (стемы для аргумента `lora`; выбор — по
      правилам твоего агента, обычному запросу LoRA не нужны):
      {{ video_loras }}

      Доступные RefMod-карточки (slug для аргумента `refmod`; персонаж из
      карточки вместо прикреплённых картинок — по правилам твоего агента):
      {{ video_refmods }}

      Доступные изображения (id для `source_image_ids`; роль картинок —
      first_frame (один id, первый кадр) или reference (1–3 id, референсы
      движка) — по правилам твоего агента):
      {{ video_image_candidates }}
    output_type: message
    ui_pos:
      x: 360
      y: 40

  # ── Ветка ОЖИВЛЕНИЯ вложения (терминальная, роль ПРИНУЖДЕНА графом) ──
  - id: make_video_first_frame
    type: llm_worker
    agent: video_maker
    task: |
      РОЛЬ ВЛОЖЕНИЯ: first_frame — ПРИНУЖДЕНА графом, НЕ пере-решай.
      Вызови generate_video с image_usage: "first_frame" и РОВНО ОДНИМ id из
      списка кандидатов ниже. Вложение — первый кадр будущего ролика, его
      композиция сохраняется.

      Описание задачи: {{ nodes.extract_facts.output.rewritten_query }}
      Исходный текст пользователя: {{ nodes.user_message.output.text }}

      Улучшенный промпт (основа для английского промпта):
      {{ nodes.enhance_prompt_first_frame.output.result }}

      Доступные LoRA (обычному запросу не нужны):
      {{ video_loras }}

      Кандидаты изображений (id для `source_image_ids`):
      {{ video_image_candidates }}
    output_type: message
    ui_pos:
      x: 360
      y: -120

  # ── Ветка РЕФЕРЕНСА (терминальная, роль ПРИНУЖДЕНА графом) ──
  - id: make_video_reference
    type: llm_worker
    agent: video_maker
    task: |
      РОЛЬ ВЛОЖЕНИЯ: reference — ПРИНУЖДЕНА графом, НЕ пере-решай.
      Вызови generate_video с image_usage: "reference" и 1–3 id из списка
      ниже. Вложение задаёт внешность/персонажа/предмет/стиль, а сцена
      описана словами и создаётся заново. Речь и реплики персонажей-
      референсов передавай репликами в промпте (правила твоего агента).

      Описание задачи: {{ nodes.extract_facts.output.rewritten_query }}
      Улучшенный промпт (основа для английского промпта):
      {{ nodes.enhance_prompt_reference.output.result }}

      Доступные LoRA (обычному запросу не нужны):
      {{ video_loras }}

      Кандидаты изображений (id для `source_image_ids`):
      {{ video_image_candidates }}
    output_type: message
    ui_pos:
      x: 360
      y: 100

  # ── Роль вложения неоднозначна: РОВНО ОДИН бинарный вопрос пользователю ──
  - id: clarify_video_role
    type: llm_worker
    agent: video_helper
    output_type: message
    task: |
      Ветка УТОЧНЕНИЯ РОЛИ ВЛОЖЕНИЯ. В чате есть изображения и пользователь
      просит видео, но по формулировке нельзя однозначно понять роль картинки:
      ПЕРВЫЙ КАДР (оживить само изображение) или РЕФЕРЕНС (внешность/персонаж/
      предмет/стиль с фото, а сцена — новая, описана словами).

      Задай РОВНО ОДИН короткий бинарный вопрос с двумя вариантами:
      1) «Оживить само фото — оно станет первым кадром видео?»
      2) «Или сделать новое видео, где персонаж/внешность взяты с этого фото?»
      НЕ вызывай инструменты и НЕ запускай генерацию — только вопрос и короткое
      пояснение, чем варианты отличаются. После ответа пользователя пайплайн
      перезапустится и маршрут определится по его формулировке.

      Сообщение пользователя: {{ nodes.user_message.output.text }}

      Доступные изображения:
      {{ video_image_candidates }}
    ui_pos:
      x: 140
      y: 200

  # ── Не видео-запрос: помощник (объясняет возможности, уточняет задачу) ──
  - id: no_video_task
    type: llm_worker
    agent: video_helper
    task: |
      Классификатор НЕ распознал запрос на генерацию видео: пользователь либо
      спрашивает о возможностях, либо просит что-то, что видео-модель не делает
      (например, редактирование существующего ролика). Коротко объясни, что
      команда умеет: создать короткий клип со звуком по описанию; уточни, что
      именно снять, если пользователь описал задачу неточно. НЕ вызывай
      инструменты.

      Сообщение пользователя: {{ nodes.user_message.output.text }}
    output_type: message
    ui_pos:
      x: 360
      y: 200

edges:
  - from: user_message
    to: extract_facts

  - from: extract_facts
    to: route

  - from: enhance_prompt_video
    to: make_video

  - from: enhance_prompt_first_frame
    to: make_video_first_frame

  - from: enhance_prompt_reference
    to: make_video_reference
