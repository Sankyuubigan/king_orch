# Факты и промпт для экстрактора
# Загружается из mesh-gen-flow.yaml через config.facts_file

output_fields:
  - id: rewritten_query
    field_type: string
    required: true

extractor_prompt: |
  Ты — системный анализатор запросов. Прочитай сообщение пользователя и историю сессии.
  Выполни ДВЕ задачи:

  ЗАДАЧА 1 — определи факты (boolean) по критериям ниже:
  {{ facts }}

  ЗАДАЧА 2 — перепиши запрос (rewritten_query):
  Перепиши ПОСЛЕДНИЙ запрос пользователя в самодостаточную форму — что именно
  сгенерировать или изменить, понятно БЕЗ истории диалога. Примеры:
  - «а теперь сделай её в бронё» (после генерации модели) → «Тот же объект в бронёвом доспехе, тот же ракурс»
  - «вот эта картинка, сделай из неё фигурку» (после прикрепления фото) → «Сгенерировать GLB-модель из прикреплённого изображения»
  Поле rewritten_query ОБЯЗАТЕЛЬНО: возвращай его ВСЕГДА. Если запрос уже самодостаточен —
  передай его максимально близко к оригиналу, не выбрасывая детали.

  Сообщение пользователя:
  {{ user_message }}

  Доступные изображения в чате:
  {{ image_candidates }}

  Если пользователь просит изменить прошлый 3D-результат по контексту переписки,
  используй наличие изображений выше как подтверждение, что нужна правка или генерация.

  Ответь ТОЛЬКО JSON без пояснений и без markdown-фенсов:
  {"needs_rigging": true/false, "needs_3d_edit": true/false, "needs_3d_generate": true/false, "needs_3d_from_text": true/false, "rewritten_query": "переписанный запрос"}

  ПРИОРИТЕТ ФАКТОВ (взаимоисключающие, брать высший по списку):
  1. needs_rigging — побеждает всё: поставить на СУЩЕСТВУЮЩУЮ модель
     скелет/веса/риг («заригги модель», «подготовь к анимации»).
     Риггинг ≠ правка внешности и ≠ создание новой модели.
  2. needs_3d_edit — изменить СУЩЕСТВУЮЩУЮ 3D-модель/результат
     (прошлые GLB в истории, «сделай модель в другой позе/цвете»).
  3. needs_3d_generate — создать НОВУЮ 3D-модель из изображения (прикреплённая
     картинка или картинка из переписки как источник формы). Если просят
     СОЗДАТЬ модель с последующим ригом — это generate (риг делается
     отдельным ходом по готовой модели).
  4. needs_3d_from_text — создать модель ПО ТЕКСТОВОМУ описанию, когда
     изображения-источника нет (описание словами, «нарисуй и сделай 3D»),
     либо перерисовать/изменить концепт-картинку до создания модели.
  5. Если ни один не подошёл — все FALSE (это не 3D-запрос, граф завершится
     без генерации).

facts:
  - id: needs_rigging
    criteria: |
      TRUE если нужно поставить на СУЩЕСТВУЮЩУЮ 3D-модель скелет и веса
      скиннинга (авто-риггинг): «заригги», «поставь скелет», «подготовь
      модель к анимации», «нужно риггирование готовой GLB».
      Модель должна существовать (GLB в чате/истории или прошлый
      результат генерации). FALSE если просят ИЗМЕНИТЬ внешность/форму
      (это edit), СОЗДАТЬ новую модель (это generate) или запрос не про
      3D. При сомнении — FALSE.

  - id: needs_3d_edit
    criteria: |
      TRUE если нужно ИЗМЕНИТЬ существующую 3D-модель или прошлый результат
      генерации: «поменяй модель», «сделай её в другом наряде/позе/цвете»,
      правка объекта, который уже был сгенерирован как 3D.
      FALSE если просят поставить риг на модель (это rigging), создать
      новую модель из картинки (это generate) или запрос вообще не про 3D.
      При сомнении — FALSE.

  - id: needs_3d_generate
    criteria: |
      TRUE если нужно СОЗДАТЬ новую 3D-модель (GLB) из изображения:
      - «сделай 3D-модель/фигурку/глиф из этой картинки», «сгенерируй GLB»
      - к сообщению прикреплено изображение-источник формы объекта
      - просят создать модель и потом её риггить (риг — отдельный ход
        по готовой модели)
      FALSE если просят поставить риг на существующую модель (это
      rigging), изменить уже существующую 3D-модель (это edit) или запрос
      не про 3D вообще. При сомнении — FALSE.

  - id: needs_3d_from_text
    criteria: |
      TRUE если нужно создать 3D-модель по ТЕКСТОВОМУ описанию, когда
      изображения-источника НЕТ: «сделай модель меча/дерева/персонажа»,
      описание объекта словами, «нарисуй концепт и сделай 3D». Также TRUE,
      если пользователь просит ИЗМЕНИТЬ/перерисовать предыдущий
      концепт-картинку, пока 3D-модель (GLB) ещё не создавалась («сделай
      щит синим» сразу после концепта).
      FALSE если приложена картинка-источник (это generate), модель уже
      создана и её правят (это edit), просят риг на модель (это rigging)
      или запрос не про 3D вообще. При сомнении — FALSE.
