name: Видеомонтаж
description: Монтаж прикреплённых видео через ffmpeg — обрезка и вырезание фрагментов, склейка, аудио, скорость, повороты, формат, сжатие, текст и фильтры.

config:
  facts_file: facts.yaml
  default_llm_params: strict

# Точка входа графа — текст, отправленный пользователем в чат.
entry: user_message

nodes:
  # ── Источник данных: текст пользователя (без LLM) ──
  - id: user_message
    type: user_message
    ui_pos:
      x: -320
      y: 40

  # ── Классификация: нужна ли операция монтажа над видео ──
  - id: extract_facts
    type: llm_fact_extractor
    input: "{{ nodes.user_message.output.text }}"
    llm_params: strict
    ui_pos:
      x: -80
      y: 40

  - id: route
    type: switch
    input_object: "{{ nodes.extract_facts.output }}"
    cases_priority:
      - key: needs_video_edit
        to: video_edit
    default: no_video_task
    ui_pos:
      x: 140
      y: 40

  # ── Ветка монтажа (терминальная) ──
  - id: video_edit
    type: llm_worker
    agent: video_editor
    task: |
      Режим: монтаж видео.

      Запрос пользователя (самодостаточная форма): {{ nodes.extract_facts.output.rewritten_query }}
      Исходный текст пользователя: {{ nodes.user_message.output.text }}

      Видео в запросе (path для аргумента `path` ffmpeg-тулов):
      {{ video_files }}
    output_type: frontend
    ui_pos:
      x: 360
      y: 40

  # ── Не задача монтажа: помощник (ответ в чат, уточнение задачи) ──
  - id: no_video_task
    type: llm_worker
    agent: video_helper
    task: |
      Классификатор НЕ распознал запрос как задачу монтажа: пользователь либо
      задал вопрос про монтаж видео (ответ — в чат), либо описал задачу неточно,
      либо просит не про обработку видео. Ответь по правилам твоего агента:
      вопрос — компактным ответом, расплывчатая задача — одним уточняющим
      вопросом. НЕ вызывай инструменты (у тебя их нет).

      Сообщение пользователя: {{ nodes.user_message.output.text }}
    output_type: frontend
    ui_pos:
      x: 360
      y: 160

edges:
  - from: user_message
    to: extract_facts

  - from: extract_facts
    to: route
