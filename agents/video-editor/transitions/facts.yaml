# Факты и промпт для экстрактора графа видеомонтажа
# Загружается из video-edit-flow.yaml через config.facts_file

output_fields:
  - id: rewritten_query
    field_type: string
    required: true

extractor_prompt: |
  Ты — системный анализатор запросов. Прочитай сообщение пользователя и историю сессии.
  Выполни ДВЕ задачи:

  ЗАДАЧА 1 — определи факты (boolean) по критериям ниже:
  {{ facts }}

  ЗАДАЧА 2 — перепиши запрос (rewritten_query):
  Перепиши ПОСЛЕДНИЙ запрос пользователя в самодостаточную форму — какая именно
  операция монтажа нужна, понятно БЕЗ истории диалога: что сделать с прикреплённым
  видео (какие секунды, какая операция, какой формат результата).
  Поле rewritten_query ОБЯЗАТЕЛЬНО: возвращай его ВСЕГДА. Если запрос уже
  самодостаточен — передай его максимально близко к оригиналу, не выбрасывай
  детали и не переписывай стиль.

  Сообщение пользователя:
  {{ user_message }}

  Ответь ТОЛЬКО JSON без пояснений и без markdown-фенсов:
  {"needs_video_edit": true/false, "rewritten_query": "переписанный запрос"}

facts:
  - id: needs_video_edit
    criteria: |
      TRUE если пользователь просит операцию, результат которой — НОВЫЙ
      медиафайл из прикреплённого видео:
      - вырезать/удалить фрагмент, обрезать начало/конец, задать отрезок времени
      - склеить/соединить несколько видео в одно
      - извлечь звуковую дорожку в отдельный файл
      - удалить звук, заменить звуковую дорожку
      - изменить скорость (ускорить/замедлить)
      - повернуть/отзеркалить видео
      - изменить разрешение, соотношение сторон, частоту кадров
      - наложить текст/титры/водяной знак, применить визуальный фильтр
      - конвертировать в другой формат/контейнер, сжать/уменьшить размер файла
      - извлечь кадры или скриншоты из видео
      FALSE если пользователю достаточно ответа в чате: вопрос «как сделать»
      (приём, команда, настройка), консультация, или просьба вообще не про
      обработку прикреплённого видео — например создать новое видео из текста
      или картинок (это генерация, другой инструмент) или скачать видео с
      сайта (это загрузчик, другой инструмент). При сомнении — FALSE.
