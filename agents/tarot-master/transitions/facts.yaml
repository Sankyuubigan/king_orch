# Факты и промпт для экстрактора команды «Таролог»
# Загружается из tarot_master.yaml через config.facts_file

extractor_prompt: |
  Ты — системный анализатор запросов для колоды Таро. Прочитай сообщение
  пользователя и определи факты по критериям ниже:
  {{ facts }}

  Сообщение пользователя:
  {{ user_message }}

  Ответь ТОЛЬКО JSON без пояснений и без markdown-фенсов, ВСЕМИ ключами:
  {"is_greeting": true/false, "question_quality": "proper"/"reformulatable"/"unsuitable", "card_count": "1"/"3"}

  ПРИОРИТЕТ (взаимоисключающие правила, брать высший по списку):
  1. Если is_greeting = TRUE — question_quality = "unsuitable", card_count = "1"
     (хелпер объяснит возможности и правила колоды).
  2. Иначе question_quality определяется по критериям факта.
  3. Если непонятно, к какой категории отнести вопрос, — "reformulatable"
     (хелпер поможет переформулировать).

facts:
  - id: is_greeting
    criteria: |
      TRUE если сообщение — приветствие, знакомство или вопрос о возможностях
      колоды (как это работает, что умеешь, кто ты), и запроса на расклад карт
      в нём нет.
      FALSE если пользователь просит расклад, задаёт вопрос для карт или
      описывает ситуацию, о которой хочет спросить колоду.
      При сомнении — FALSE.

  - id: question_quality
    values:
      - proper
      - reformulatable
      - unsuitable
    criteria: |
      Качество вопроса для колоды Таро. Три значения:

      **proper:** вопрос открытый — о «как», «что», «почему», «зачем» — задан
      про самого говорящего и его ситуацию и допускает глубокий развёрнутый
      ответ. Признаки: вопрос о своих причинах, состояниях, отношениях с
      участием говорящего, о направлениях действия и выборах.

      **reformulatable:** вопрос можно исправить до открытого одной
      формулировкой. Признаки: закрытый вопрос, допускающий ответ «да/нет»;
      вопрос о времени или количестве («когда», «сколько»); вопрос о чужих
      мыслях и чувствах без участия говорящего; вопрос-прогноз одного события
      без упоминания своих действий.

      **unsuitable:** вопрос вне языка колоды, переформулировка в открытый
      вопрос не имеет смысла. Признаки: запрос медицинской диагностики или
      диагноза; запрос юридического исхода или вины; запрос фактических
      данных (имена, цифры, номера, адреса, результаты событий); вопросы о
      жизни и смерти конкретных людей.

      Алгоритм:
      1. Если в вопросе запрашивается факт, диагноз, приговор или дата — unsuitable.
      2. Если вопрос открытый и про говорящего — proper.
      3. Если вопрос закрытый, про время/количество или про третьих лиц —
         reformulatable.
      4. Если непонятно — reformulatable.

  - id: card_count
    values:
      - "1"
      - "3"
    criteria: |
      Количество карт для расклада.

      **"3":** пользователь явно просит расклад из трёх карт, ИЛИ описывает
      ситуацию, которая разворачивается во времени или по этапам — истоки,
      текущее состояние, развитие (расклад «прошлое / настоящее /
      перспектива»).

      **"1":** одиночный вопрос-совет: одна ситуация без этапов, просьба о
      совете, уточнении или разъяснении.

      При сомнении — "1".
      Если is_greeting = TRUE — всегда "1".
