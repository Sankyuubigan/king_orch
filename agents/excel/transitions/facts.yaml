# Факты и промпт для экстрактора Excel-графа
# Загружается из excel-flow.yaml через config.facts_file

output_fields:
  - id: rewritten_query
    field_type: string
    required: true

extractor_prompt: |
  Ты — системный анализатор запросов. Прочитай сообщение пользователя и историю сессии.
  Выполни ДВЕ задачи:

  ЗАДАЧА 1 — определи факты (boolean) по критериям ниже:
  {{ facts }}

  ЗАДАЧА 2 — перепиши запрос (rewritten_query):
  Перепиши ПОСЛЕДНИЙ запрос пользователя в самодостаточную форму — какая именно
  работа с таблицей нужна, понятно БЕЗ истории диалога: что за таблица, какие
  столбцы и расчёты, что сделать с прикреплённым файлом.
  Поле rewritten_query ОБЯЗАТЕЛЬНО: возвращай его ВСЕГДА. Если запрос уже
  самодостаточен — передай его максимально близко к оригиналу, не выбрасывай
  детали и не переписывай стиль.

  Сообщение пользователя:
  {{ user_message }}

  Ответь ТОЛЬКО JSON без пояснений и без markdown-фенсов:
  {"needs_table_file": true/false, "rewritten_query": "переписанный запрос"}

facts:
  - id: needs_table_file
    criteria: |
      TRUE если пользователь просит работу, результат которой — ФАЙЛ таблицы:
      - создать новую таблицу/книгу Excel по описанию или из данных
        (столбцы, расчёты, формулы, итоги, график, оформление)
      - изменить/дополнить/переоформить прикреплённую таблицу (.xlsx, .csv)
      - найти и исправить ошибки в прикреплённой таблице (формулы, расчёты,
        битые ссылки, ошибки значений)
      - свести/проанализировать данные таблицы в новый файл (итоги, сводка)
      - конвертировать таблицу между форматами (csv/tsv/xlsx)
      FALSE если пользователю достаточно ответа в чате: вопрос «как сделать»
      (формула, функция, приём), консультация, или просьба вообще не про
      таблицы. При сомнении — FALSE.
