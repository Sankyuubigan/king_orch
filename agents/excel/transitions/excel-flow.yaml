name: Excel-таблицы
description: Создание и редактирование .xlsx с живыми формулами и графиками, поиск и исправление ошибок формул, конвертация csv/tsv.

config:
  facts_file: facts.yaml
  default_llm_params: strict

# Точка входа графа — текст, отправленный пользователем в чат.
entry: user_message

nodes:
  # ── Источник данных: текст пользователя (без LLM) ──
  - id: user_message
    type: user_message
    ui_pos:
      x: -320
      y: 40

  # ── Классификация: результатом должна быть таблица-файл? ──
  - id: extract_facts
    type: llm_fact_extractor
    input: "{{ nodes.user_message.output.text }}"
    llm_params: strict
    ui_pos:
      x: -80
      y: 40

  - id: route
    type: switch
    input_object: "{{ nodes.extract_facts.output }}"
    cases_priority:
      - key: needs_table_file
        to: make_excel
    default: no_excel_task
    ui_pos:
      x: 140
      y: 40

  # ── Ветка работы с таблицей (терминальная) ──
  - id: make_excel
    type: llm_worker
    agent: excel_operator
    task: |
      Режим: работа с таблицей.

      Запрос пользователя (самодостаточная форма): {{ nodes.extract_facts.output.rewritten_query }}
      Исходный текст пользователя: {{ nodes.user_message.output.text }}

      Таблицы в запросе (path для аргумента `path` excel-тулов; создаваемая
      книга — без path):
      {{ spreadsheet_files }}
    output_type: message
    ui_pos:
      x: 360
      y: 40

  # ── Не задача про файл: помощник (ответ в чат, уточнение задачи) ──
  - id: no_excel_task
    type: llm_worker
    agent: excel_helper
    task: |
      Классификатор НЕ распознал запрос как работу с файлом таблицы: пользователь
      либо задал вопрос про Excel (ответ — в чат), либо описал задачу неточно,
      либо просит не про таблицы. Ответь по правилам твоего агента: вопрос —
      компактным ответом, расплывчатая задача — одним уточняющим вопросом.
      НЕ вызывай инструменты (у тебя их нет).

      Сообщение пользователя: {{ nodes.user_message.output.text }}
    output_type: message
    ui_pos:
      x: 360
      y: 160

edges:
  - from: user_message
    to: extract_facts

  - from: extract_facts
    to: route
