# Факты и промпт для экстрактора
# Загружается из media-flow.yaml через config.facts_file

output_fields:
  - id: rewritten_query
    field_type: string
    required: true

extractor_prompt: |
  Ты — системный анализатор запросов. Прочитай сообщение пользователя и историю сессии.
  Выполни ДВЕ задачи:

  ЗАДАЧА 1 — определи факты (boolean) по критериям ниже:
  {{ facts }}

  ЗАДАЧА 2 — перепиши запрос (rewritten_query):
  Перепиши ПОСЛЕДНИЙ запрос пользователя в самодостаточную форму — что именно
  нарисовать или изменить, понятно БЕЗ истории диалога. Примеры:
  - «а сделай её красной» (после генерации машины) → «Красная машина, тот же ракурс»
  - «убери фон» (после прикрепления фото) → «Убрать фон с прикреплённого фото»
  Поле rewritten_query ОБЯЗАТЕЛЬНО: возвращай его ВСЕГДА, даже если запрос уже
  самодостаточен (тогда просто повтори его слово в слово).

  Сообщение пользователя:
  {{ user_message }}

  Доступные изображения в чате:
  {{ image_candidates }}

  Если пользователь просит изменить прошлый результат по контексту переписки,
  используй наличие изображений выше как подтверждение, что нужен edit.
  Конкретный источник выберет агент Редактор изображений.

  Ответь ТОЛЬКО JSON без пояснений и без markdown-фенсов:
  {"needs_image_edit": true/false, "needs_image_generate": true/false, "rewritten_query": "переписанный запрос"}

  ПРИОРИТЕТ ФАКТОВ:
  1. needs_image_edit — побеждает всё (есть прикреплённые картинки или правка прошлого результата).
  2. needs_image_generate — только генерация с нуля, без референсов.
  3. Если ни один не подошёл — все FALSE (это не image-запрос, граф завершится без генерации).

facts:
  - id: needs_image_edit
    criteria: |
      TRUE если нужно ИЗМЕНИТЬ существующее изображение:
      - к сообщению прикреплены картинки (референсы для правки)
      - просят изменить прошлый сгенерированный результат («сделай её красной», «убери фон», «поменяй текст»)
      - просят сохранить объект/лицо/стиль и изменить деталь, фон, текст
      FALSE если картинок нет и просят создать с нуля.
      При сомнении — FALSE.

  - id: needs_image_generate
    criteria: |
      TRUE если нужно СОЗДАТЬ изображение с нуля по описанию:
      - «нарисуй», «сгенерируй», «создай картинку/логотип/обои»
      - описание сцены, персонажа, предмета без референсов
      FALSE если есть прикреплённые картинки или речь про правку существующего.
      При сомнении — FALSE.
