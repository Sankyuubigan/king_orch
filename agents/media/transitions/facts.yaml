# Факты и промпт для экстрактора
# Загружается из media-flow.yaml через config.facts_file

output_fields:
  - id: rewritten_query
    field_type: string
    required: true

extractor_prompt: |
  Ты — системный анализатор запросов. Прочитай сообщение пользователя и историю сессии.
  Выполни ДВЕ задачи:

  ЗАДАЧА 1 — определи факты (boolean) по критериям ниже:
  {{ facts }}

  ЗАДАЧА 2 — перепиши запрос (rewritten_query):
  Перепиши ПОСЛЕДНИЙ запрос пользователя в самодостаточную форму — что именно
  нарисовать, изменить или увеличить, понятно БЕЗ истории диалога. Примеры:
  - «а сделай её красной» (после генерации машины) → «Красная машина, тот же ракурс»
  - «убери фон» (после прикрепления фото) → «Убрать фон с прикреплённого фото»
  - «увеличь её в 2 раза» (после генерации города) → «Увеличить разрешение картинки с городом, сохранив композицию»
  Поле rewritten_query ОБЯЗАТЕЛЬНО: возвращай его ВСЕГДА. Если запрос уже самодостаточен
  (пользователь дал готовый развернутый промпт) — передай его максимально близко к оригиналу,
  не выбрасывай детали и не переписывай стиль.

  Сообщение пользователя:
  {{ user_message }}

  Доступные изображения в чате:
  {{ image_candidates }}

  Если пользователь просит изменить прошлый результат по контексту переписки,
  используй наличие изображений выше как подтверждение, что нужен edit или upscale.
  Конкретный источник выберет агент (Редактор или Апскейлер).

  Ответь ТОЛЬКО JSON без пояснений и без markdown-фенсов:
  {"needs_image_edit": true/false, "needs_image_upscale": true/false, "needs_image_generate": true/false, "rewritten_query": "переписанный запрос"}

  ПРИОРИТЕТ ФАКТОВ (взаимоисключающие, брать высший по списку):
  1. needs_image_edit — побеждает всё (есть прикреплённые картинки или правка прошлого результата по СОДЕРЖИМОМУ: стиль, цвет, объект, фон).
  2. needs_image_upscale — правка по ФОРМАТУ: увеличить разрешение/размер/детализацию
     существующей картинки без изменения содержимого («увеличь», «в 2 раза», «более чётко/качество»).
  3. needs_image_generate — только генерация с нуля, без референсов.
  4. Если ни один не подошёл — все FALSE (это не image-запрос, граф завершится без генерации).

facts:
  - id: needs_image_edit
    criteria: |
      TRUE если нужно ИЗМЕНИТЬ содержимое существующего изображения:
      - к сообщению прикреплены картинки (референсы для правки)
      - просят изменить прошлый сгенерированный результат («сделай её красной», «убери фон», «поменяй текст»)
      - просят сохранить объект/лицо/стиль и изменить деталь, фон, текст
      FALSE если просят только увеличить разрешение/размер (это upscale) или создать с нуля.
      При сомнении — FALSE.

  - id: needs_image_upscale
    criteria: |
      TRUE если нужна работа над ФОРМАТОМ существующего изображения:
      - «увеличить разрешение/размер», «в 2 раза», «более чётко»,
        «повысить качество/детализацию» — без изменения содержимого картинки
      - запрос относится к конкретной картинке из переписки или прикреплённой
      FALSE если одновременно меняют содержимое (цвет, объект, стиль — это edit)
      или просят создать новую картинку. При сомнении — FALSE.

  - id: needs_image_generate
    criteria: |
      TRUE если нужно СОЗДАТЬ изображение с нуля по описанию:
      - «нарисуй», «сгенерируй», «создай картинку/логотип/обои»
      - описание сцены, персонажа, предмета без референсов
      FALSE если есть прикреплённые картинки, речь про правку существующего
      или про увеличение его разрешения. При сомнении — FALSE.
