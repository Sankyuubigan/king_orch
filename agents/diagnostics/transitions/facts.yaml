# Факты и промпт для экстрактора графа диагностики ПК
# Загружается из diagnostics-flow.yaml через config.facts_file

output_fields:
  - id: rewritten_query
    field_type: string
    required: true

extractor_prompt: |
  Ты — системный анализатор запросов. Прочитай сообщение пользователя и историю сессии.
  Выполни ДВЕ задачи:

  ЗАДАЧА 1 — определи факты (boolean) по критериям ниже:
  {{ facts }}

  ЗАДАЧА 2 — перепиши запрос (rewritten_query):
  Перепиши ПОСЛЕДНИЙ запрос пользователя в самодостаточную форму — какая именно
  проблема с компьютером описана и что просят, понятно БЕЗ истории диалога:
  что за поведение (например: тормозит, зависает, выключается, не запускается),
  при каких обстоятельствах оно проявляется, что просят сделать.
  Поле rewritten_query ОБЯЗАТЕЛЬНО: возвращай его ВСЕГДА. Если запрос уже
  самодостаточен — передай его максимально близко к оригиналу, не выбрасывай
  детали и не переписывай стиль.

  Сообщение пользователя:
  {{ user_message }}

  Ответь ТОЛЬКО JSON без пояснений и без markdown-фенсов:
  {"pc_diagnostics_request": true/false, "rewritten_query": "переписанный запрос"}

facts:
  - id: pc_diagnostics_request
    criteria: |
      TRUE если пользователь описывает ПРОБЛЕМУ с работой компьютера и просит
      разобраться, что происходит, — запрос на диагностику состояния системы:
      - производительность: внезапные или регулярные тормоза, зависания,
        подвисания, медленный отклик системы или программ
      - стабильность: внезапные перезагрузки или выключения, экран «уходит
        в чёрный», машина замерзает и не отвечает до принудительного
        перезапуска
      - сбой при запуске или работе конкретного приложения/игры/библиотеки:
        не запускается, закрывается само, зависает, вылетает, сообщает об
        ошибке, античит/защита не пускает
      - признаки системного или аппаратного сбоя: перегрев, необычный шум,
        поведение изменилось после обновления/установки/сбоя питания,
        повторяющиеся ошибки системы
      TRUE также, если пользователь просит выполнить диагностическое действие
      этой команды — даже без описания проблемы: провести осмотр или проверку
      системы; включить/запустить, остановить или выключить запись для
      фиксации сбоев (в том числе включить и затем остановить её, чтобы
      проверить, как она работает). Местоимения («её», «её запись») разрешай
      по истории сессии, если речь о записи, осмотре или диагностике.
      FALSE если это не про состояние компьютера и не про действия этой
      команды: обычный диалог, таблицы, код, тексты, покупка техники,
      включение/настройка функций и программ, не относящихся к диагностике
      (оформление, звук, установка софта без признаков сбоя).
      Вопрос «как это работает / как этим пользоваться» — FALSE: это просьба
      объяснить, а не выполнить действие.
      При сомнении — FALSE.
