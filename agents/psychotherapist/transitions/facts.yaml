# Факты для экстрактора
# Загружается из main_conversation_flow.yaml через config.facts_file

# Кастомный промпт (опционально — если не задан, используется базовый)
# extractor_prompt: ...

# Факты
facts:
  - id: has_problem
    criteria: |
      TRUE если в текущем сообщении ИЛИ в переписке сессии уже есть конкретное описание проблемы или запрос на помощь психотерапевту (жалоба на боль/симптом, блок, цель, жизненная ситуация и т.п.).
      FALSE если юзер ещё ни разу не написал никакой проблемы — только приветствия, болтовня, вопросы без конкретного запроса.
      Приоритет: TRUE если в Session history (переписке) уже есть хоть один запрос на помощь, даже если текущее сообщение — ответ на вопрос или короткая реплика.

  - id: has_somatic
    criteria: |
      TRUE если: пользователь жалуется на конкретную физическую боль или телесный симптом — "спина болит", "голова раскалывается", "мышцы зажаты", "колено стреляет", "живот крутит", "врач поставил диагноз", "температура", "кашель", "сыпь на коже".
      FALSE если: пользователь описывает только эмоциональные/психологические состояния — "тоскливо", "тревога", "апатия", "меланхолия", "потеря смысла", "плохое настроение", "ощущаю себя мертвым", "нет энергии", "депрессия", даже если использует телесные метафоры ("кошки скребут", "ноет на душе", "тяжесть на сердце"). Это эмоциональные симптомы, а не соматика.

  - id: grounding_dont_exist
    criteria: |
      Проверяет, дал ли юзер УЖЕ конкретный МЕНТАЛЬНЫЙ сценарий из своей жизни. Гроундер нужен, чтобы найти такой сценарий, если его нет.

      FALSE если (ПРИОРИТЕТ — проверяй ПЕРВЫМ):
      1. В Session history уже есть сообщение от автора "grounder" — это значит, что поиск сценариев уже был выполнен ранее в этой сессии. Проблема уже заземлена, гроундер НЕ нужен.
      2. Юзер САМ описал конкретную жизненную ситуацию (кто/где/когда) ВМЕСТЕ со своей внутренней ментальной реакцией или затыком в ней (например: "вчера начальник при всех унизил меня, я промолчал и всю ночь прокручивал это", "не могу подойти к девушке, замираю от страха отказа", "сценарий 2 лучше подходит").

      TRUE (сценария нет, гроундер НУЖЕН) — если:
      - В Session history НЕТ сообщений от автора "grounder" (гроундер ещё не вызывался в этой сессии),
      - И юзер НЕ описал конкретную жизненную ситуацию со своей внутренней реакцией,
      - А именно если запрос состоит ТОЛЬКО из одного или нескольких пунктов ниже:
        1. Только физические/телесные симптомы ("спазмы бедер", "болят зубы", "боль в пояснице", "слабая эмаль"). Физика — это вход для соматолога, а НЕ ментальный сценарий.
        2. Только абстракции, диагнозы, философские рассуждения или жалобы на жизнь в целом ("я неудачник", "у меня прокрастинация", "все люди злые", "нет смысла").
        3. Только эмоции/состояния без привязки к конкретной жизненной ситуации ("тревога", "тоскливо", "апатия", "чувствую себя мертвым").

  - id: user_doesnt_agree
    criteria: "Пользователь не согласен с ответами команды психотерапии. Юзер не доволен ответами"
