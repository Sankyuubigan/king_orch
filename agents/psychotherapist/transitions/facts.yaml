# Факты для экстрактора
# Загружается из main_conversation_flow.yaml через config.facts_file

# Кастомный промпт (опционально — если не задан, используется базовый)
# extractor_prompt: ...

# Факты
facts:
  - id: has_problem
    criteria: |
      TRUE если в текущем сообщении ИЛИ в переписке сессии уже есть конкретное описание проблемы или запрос на помощь психотерапевту (жалоба на боль/симптом, блок, цель, жизненная ситуация и т.п.).
      FALSE если юзер ещё ни разу не написал никакой проблемы — только приветствия, болтовня, вопросы без конкретного запроса.
      Приоритет: TRUE если в Session history (переписке) уже есть хоть один запрос на помощь, даже если текущее сообщение — ответ на вопрос или короткая реплика.

  - id: somatic_presence
    values:
      - new
      - history
      - none
    criteria: |
      Принцип: психосоматика = жалоба на ФИЗИОЛОГИЮ тела (боль, работа органов, сон, энергия, гормоны), а НЕ на эмоциональное состояние.

      Факт имеет ТРИ состояния:
      - new — ТЕКУЩЕЕ сообщение пользователя добавляет НОВУЮ соматическую жалобу, которой ЕЩЁ НЕ БЫЛО в истории сессии.
      - history — соматика присутствует в переписке сессии, но в текущем сообщении НОВЫХ телесных данных нет (текущее сообщение лишь обсуждает симптомы, отвечает на вопросы, уточняет рукость, даёт жизненные сценарии или описывает эмоции).
      - none — соматики нет ни в текущем сообщении, ни в истории сессии.

      Сначала сравни ТЕКУЩЕЕ сообщение (блок "User:") с историей сессии (блок "Session history:"):
      - Если в истории сессии УЖЕ есть описанные симптомы, а текущее сообщение лишь обсуждает их, отвечает на вопросы, уточняет рукость, даёт жизненные сценарии или описывает эмоции — ставь history (новых телесных данных нет).
      - Если текущее сообщение упоминает симптом, который УЖЕ встречался в истории (тот же орган/боль/сбой) — это НЕ новое, ставь history.
      - Если текущее сообщение добавляет симптом/сбой, которого НЕ БЫЛО ранее в сессии — ставь new.
      - Если ни в текущем сообщении, ни в истории соматических жалоб нет (только эмоциональные/психологические состояния) — ставь none.

      new если (и только если): в ТЕКУЩЕМ сообщении появилась НОВАЯ жалоба на конкретную физическую боль или любой сбой физиологии тела:
      - боль и острые состояния (спина, голова, мышцы, суставы, живот, температура, кашель, сыпь, диагноз врача);
      - нарушения сна и бодрствования (бессонница, сонливость, невозможность уснуть, усталость);
      - гормональные/эндокринные нарушения (гормональный фон, щитовидная железа);
      - любые другие жалобы на работу тела (ЖКТ, сердце, давление, кожа, дыхание и т.п.).

      none если: пользователь описывает ТОЛЬКО эмоциональные/психологические состояния — "тоскливо", "тревога", "апатия", "меланхолия", "потеря смысла", "плохое настроение", "ощущаю себя мертвым", "депрессия", "вспышки ярости", даже если использует телесные метафоры ("кошки скребут", "ноет на душе", "тяжесть на сердце"). Это эмоциональные симптомы, а не соматика. Сюда же относятся ответы на вопросы специалистов, обсуждение сценариев и уточнение рукости — в них нет новых телесных жалоб (если соматика уже была в истории — history).

      Разграничение: жалоба на ФИЗИОЛОГИЧЕСКИЙ процесс тела (сон, бодрствование, усталость, гормоны) — new ТОЛЬКО если это НОВОЕ для сессии, иначе history. Жалоба на эмоциональное состояние БЕЗ физиологической жалобы (апатия, уныние, потеря интереса) — none.

  - id: mental_presence
    values:
      - new
      - history
      - none
    criteria: |
      Принцип: ментальное присутствие = жалоба на психологическое состояние, эмоции, мысли, убеждения, поведение, внутренние блоки, травмы, отношения или реакцию на жизненные ситуации (включая телесные метафоры вроде «тяжесть на душе», «ноет на сердце», «кошки скребут»).

      Факт имеет ТРИ состояния:
      - new — ТЕКУЩЕЕ сообщение пользователя добавляет НОВУЮ психологическую/эмоциональную жалобу, блок или ментальный сценарий, которых ЕЩЁ НЕ БЫЛО в истории сессии.
      - history — ментальная проблема присутствовала в переписке сессии, но в текущем сообщении НОВЫХ психологических данных нет (текущее сообщение лишь обсуждает уже названные сценарии, отвечает на вопросы, уточняет детали).
      - none — ментальных/психологических жалоб нет ни в текущем сообщении, ни в истории сессии (запрос состоит ИСКЛЮЧИТЕЛЬНО из чистой физиологии тела / соматики или приветствия).

      new если: в ТЕКУЩЕМ сообщении появилась психологическая проблема, эмоция, блок или реакция:
      - тревога, страх, паника, депрессия, апатия, агрессия, вина, обида, стыд;
      - жизненные ситуации, конфликты с людьми, проблемы на работе, в семье, финансовые блоки;
      - внутренние правила, убеждения, перфекционизм, прокрастинация;
      - телесные метафоры, выражающие душевное состояние («тяжесть на душе», «скребет на сердце», «внутри всё сжалось от страха»).

      none если: пользователь описывает ТОЛЬКО чистую физиологию тела без каких-либо эмоциональных или психологических жалоб (например: «сломал ногу», «боли в спине от тяжестей», «насморк и температура», «десна воспалилась»). Сюда же относятся простые ответы на вопросы соматолога о рукости или физических симптомах.
