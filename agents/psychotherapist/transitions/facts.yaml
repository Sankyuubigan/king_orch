# Факты для экстрактора
# Загружается из main_conversation_flow.yaml через config.facts_file

# Кастомный промпт (опционально — если не задан, используется базовый)
# extractor_prompt: ...

# Факты
facts:
  - id: has_problem
    criteria: |
      TRUE если в текущем сообщении ИЛИ в переписке сессии уже есть конкретное описание проблемы или запрос на помощь психотерапевту (жалоба на боль/симптом, блок, цель, жизненная ситуация и т.п.).
      FALSE если юзер ещё ни разу не написал никакой проблемы — только приветствия, болтовня, вопросы без конкретного запроса.
      Приоритет: TRUE если в Session history (переписке) уже есть хоть один запрос на помощь, даже если текущее сообщение — ответ на вопрос или короткая реплика.

  - id: has_somatic
    criteria: |
      Принцип: психосоматика = жалоба на ФИЗИОЛОГИЮ тела (боль, работа органов, сон, энергия, гормоны), а НЕ на эмоциональное состояние.

      ВАЖНО (главное правило): оценивай ТОЛЬКО НОВИЗНУ. Этот факт должен быть TRUE только когда ТЕКУЩЕЕ сообщение пользователя добавляет НОВУЮ соматическую жалобу, которой ЕЩЁ НЕ БЫЛО в истории сессии. Психосоматолог вызывается лишь при появлении новых данных о теле — не перезапускай его на каждый ход.

      Сначала сравни ТЕКУЩЕЕ сообщение (блок "User:") с историей сессии (блок "Session history:"):
      - Если в истории сессии УЖЕ есть описанные симптомы, и текущее сообщение лишь обсуждает их, отвечает на вопросы, уточняет рукость, даёт жизненные сценарии или описывает эмоции — ставь FALSE (новых телесных данных нет).
      - Если текущее сообщение упоминает симптом, который УЖЕ встречался в истории (тот же орган/боль/сбой) — это НЕ новое, ставь FALSE.
      - Если текущее сообщение добавляет симптом/сбой, которого НЕ БЫЛО ранее в сессии — ставь TRUE.

      TRUE если (и только если): в ТЕКУЩЕМ сообщении появилась НОВАЯ жалоба на конкретную физическую боль или любой сбой физиологии тела:
      - боль и острые состояния (спина, голова, мышцы, суставы, живот, температура, кашель, сыпь, диагноз врача);
      - нарушения сна и бодрствования (бессонница, сонливость, невозможность уснуть, усталость);
      - гормональные/эндокринные нарушения (гормональный фон, щитовидная железа);
      - любые другие жалобы на работу тела (ЖКТ, сердце, давление, кожа, дыхание и т.п.).

      FALSE если: пользователь описывает ТОЛЬКО эмоциональные/психологические состояния — "тоскливо", "тревога", "апатия", "меланхолия", "потеря смысла", "плохое настроение", "ощущаю себя мертвым", "депрессия", "вспышки ярости", даже если использует телесные метафоры ("кошки скребут", "ноет на душе", "тяжесть на сердце"). Это эмоциональные симптомы, а не соматика. Сюда же относятся ответы на вопросы специалистов, обсуждение сценариев и уточнение рукости — в них нет новых телесных жалоб.

      Разграничение: жалоба на ФИЗИОЛОГИЧЕСКИЙ процесс тела (сон, бодрствование, усталость, гормоны) — может быть TRUE ТОЛЬКО если это НОВОЕ для сессии. Жалоба на эмоциональное состояние БЕЗ физиологической жалобы (апатия, уныние, потеря интереса) — FALSE.
  - id: scenario_established
    criteria: |
      Определи, УЖЕ ли установлен в беседе конкретный жизненный СЦЕНАРИЙ (ситуация: кто участвует,
      где, когда, что произошло, и внутренняя реакция/переживание на неё) — то есть 6-й элемент
      невроза на МЕНТАЛЬНОМ уровне события. Соматический симптом (боль, орган, сбой тела) НЕ может
      быть этим 6-м элементом — ищи ментальный уровень события, а не тело.

      TRUE (сценарий УЖЕ есть) если выполняется ХОТЯ БЫ одно:
      1. Юзер САМ (спонтанно, даже на самом первом сообщении, без гроундера) описал конкретную
         жизненную ситуацию со своей внутренней реакцией/переживанием (например: "вчера начальник
         при всех унизил меня, я промолчал и всю ночь прокручивал это"; "не могу подойти к девушке,
         замираю от страха отказа").
      2. Гроундер (агент "grounder") УЖЕ предложил сценарии в истории, и в ТЕКУЩЕМ сообщении юзер
         ПОДТВЕРДИЛ резонанс: описал свой личный кейс по одному из предложенных сценариев ИЛИ прямо
         согласился ("да, это про меня", "попал в точку", "второй сценарий — мой").

      FALSE (сценария ЕЩЁ НЕТ) если:
      - юзер НЕ описал конкретную жизненную ситуацию и НЕ подтвердил ни один предложенный гроундером
        сценарий, а перечисляет только симптомы, факты о себе или общие переживания, ИЛИ
      - юзер ЯВНО ОТВЕРГ предложенные гроундером сценарии (заявляет, что они не подходят / мимо /
        не про него / он их отвергает) — даже если в истории сессии есть сообщение от grounder.
        Принятие гроундером собственных гипотез НЕ считается установленным сценарием: подтверждает
        сценарий только сам юзер.

      Примеры запросов, дающих FALSE: только физические/телесные симптомы ("болит десна",
      "спазмы бёдер"); только абстракции/диагнозы/философия ("я неудачник", "прокрастинация");
      только эмоции без ситуации ("тревога", "тоскливо"); только факты о себе
      ("я мужчина, биологический левша"); ответ юзера, отвергающий сценарии гроундера.
