# Факты для экстрактора
# Загружается из main_conversation_flow.yaml через config.facts_file

facts:
  - id: triage_complexity
    values:
      - specific
      - cluster
    criteria: |
      Триаж/диспетчер: определить тип запроса перед развилкой.

      **Правило удержания контекста сессии:**
      Если в истории сессии (Session history) уже выбрана одна конкретная проблема/ситуация, а текущее сообщение пользователя — это ответ на уточняющие вопросы специалиста по этой же проблеме (раскрытие своих мыслей, реакций, эмоций и способов избегания внутри неё), ставь `specific`. Отдельные разговорные местоимения («всё», «всегда», «ничего») внутри описания одной конкретной ситуации НЕ делают запрос кластером.

      **specific (Конкретная проблема):** Юзер пришёл с ОДНОЙ точечной конкретной проблемой или раскрывает детали уже выбранной в диалоге одной мишени.
      Признаки: одна проблемная ситуация, понятный фокус разбора.

      **cluster (Кластер):** Юзер выгрузил ком из нескольких независимых ментальных проблем из разных сфер жизни, между которыми ещё не выбрана рабочая мишень, либо явно заявил новую совокупность разных проблем.
      Признаки: 2+ независимых проблемных сфер смешаны вместе и непонятно, с какой из них начинать терапию.

      Соматика (физиологические жалобы) считается единым блоком и сама по себе не превращает запрос в `cluster`.

      Вердикт: `cluster` ЕСЛИ заявлены 2+ независимые ментальные проблемы из разных сфер жизни без выбранного фокуса. Иначе — `specific`.

  - id: has_problem
    criteria: |
      TRUE только если в текущем сообщении ИЛИ в переписке сессии описано СОДЕРЖАНИЕ проблемы: жалоба, симптом, боль, блок, цель, жизненная ситуация, эмоция или конфликт — пусть даже одним предложением.
      Просьба о помощи сама по себе («помоги», «нужна консультация», «хочу разобраться», «не знаю, с чего начать») — это НЕ содержание проблемы: если юзер НЕ написал, о чём именно проблема, вердикт FALSE, даже если он явно просит помочь.
      FALSE если юзер ещё не описал ни одной проблемы: приветствия, болтовня, вопросы о работе сервиса, а также любые просьбы о помощи без описания самой проблемы — проблема ещё не сформулирована юзером.
      Приоритет: TRUE если в Session history (переписке) уже есть описанное содержание проблемы (по правилу TRUE выше), даже если текущее сообщение — ответ на вопрос или короткая реплика.

  - id: somatic_presence
    values:
      - new
      - history
      - none
    criteria: |
      Принцип: психосоматика = жалоба на ФИЗИОЛОГИЮ тела (боль, работа органов, сон, энергия, гормоны), а НЕ на эмоциональное состояние.

      Факт имеет ТРИ состояния:
      - new — ТЕКУЩЕЕ сообщение пользователя добавляет НОВУЮ соматическую жалобу, которой ЕЩЁ НЕ БЫЛО в истории сессии.
      - history — соматика присутствует в переписке сессии, но в текущем сообщении НОВЫХ телесных данных нет (текущее сообщение лишь обсуждает симптомы, отвечает на вопросы, уточняет рукость, даёт жизненные сценарии или описывает эмоции).
      - none — соматики нет ни в текущем сообщении, ни в истории сессии.

      Сначала сравни ТЕКУЩЕЕ сообщение (блок "User:") с историей сессии (блок "Session history:"):
      - Если в истории сессии УЖЕ есть описанные симптомы, а текущее сообщение лишь обсуждает их, отвечает на вопросы, уточняет рукость, даёт жизненные сценарии или описывает эмоции — ставь history (новых телесных данных нет).
      - Если текущее сообщение упоминает симптом, который УЖЕ встречался в истории (тот же орган/боль/сбой) — это НЕ новое, ставь history.
      - Если текущее сообщение добавляет симптом/сбой, которого НЕ БЫЛО ранее в сессии — ставь new.
      - Если ни в текущем сообщении, ни в истории соматических жалоб нет (только эмоциональные/психологические состояния) — ставь none.

  - id: mental_presence
    values:
      - new
      - history
      - none
    criteria: |
      Принцип: ментальное присутствие = жалоба на психологическое состояние, эмоции, мысли, убеждения, поведение, внутренние блоки, травмы, отношения или реакцию на жизненные ситуации (включая телесные метафоры вроде «тяжесть на душе», «ноет на сердце», «кошки скребут»).

      Факт имеет ТРИ состояния:
      - new — ТЕКУЩЕЕ сообщение пользователя добавляет НОВУЮ психологическую/эмоциональную жалобу, блок или ментальный сценарий, которых ЕЩЁ НЕ БЫЛО в истории сессии.
      - history — ментальная проблема присутствовала в переписке сессии, но в текущем сообщении НОВЫХ психологических данных нет (текущее сообщение лишь обсуждает уже названные сценарии, отвечает на вопросы, уточняет детали).
      - none — ментальных/психологических жалоб нет ни в текущем сообщении, ни в истории сессии (запрос состоит ИСКЛЮЧИЧИТЕЛЬНО из чистой физиологии тела / соматики или приветствия).

  - id: handedness
    values:
      - known
      - unknown
    criteria: |
      Биологическая рукость (ведущая рука) пользователя. Нужна для расшифровки сторон тела по Новой Германской Медицине: одна и та же жалоба расшифровывается по-разному у правшей и левшей.

      **known:** в текущем сообщении ИЛИ в истории сессии пользователь указал свою биологическую рукость (правша/левша) или привёл данные, из которых она однозначно следует: какая рука у него ведущая от природы (в том числе результат назначенного пайплайном теста на рукость — например, какой рукой оказался верх при естественных аплодисментах).
      **unknown:** рукость ни разу не названа в сессии, пользователь сам её не знает, либо названные данные её не определяют.

      Приоритет: known если информация уже есть в Session history, даже если текущее сообщение её не повторяет.