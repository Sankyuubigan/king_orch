name: Психотерапевт

config:
  facts_file: facts.yaml
  default_llm_params: creative
  default_system_prompt_file: ../system_frame.md
  default_system_prompt_delivery: user_prefix

entry: user_message

groups:

- id: group_1
  title: Новая группа
  ui_pos:
    y: 719
    x: -105

nodes:

- id: user_message
  type: user_message
  ui_pos:
    y: 493
    x: -2274

- id: extract_facts
  type: llm_fact_extractor
  input: '{{ nodes.user_message.output.text }}'
  ui_pos:
    x: -1990
    y: 493
  llm_params: strict

- id: check_has_problem
  type: condition_check
  input_object: '{{ nodes.extract_facts.output }}'
  field: has_problem
  true_to: note_1782221436115
  false_to: note_1785141025138
  ui_pos:
    y: 495
    x: -1700

- id: call_collector
  type: llm_worker
  agent: data_collector
  output_type: frontend
  inject_response:
  - validator
  - synthesizer
  - decomposer
  - soma_translator
  ui_pos:
    x: 2744
    y: 781

- id: call_soma_translator
  type: llm_worker
  agent: soma_translator
  task: Пользователь описал боль. Дай ему расшифровку по НГМ.
  ui_pos:
    x: -426
    y: 219
  llm_params: strict

- id: call_decomposer
  type: llm_worker
  group: group_1
  agent: decomposer
  ui_pos:
    y: 486
    x: 240

- id: call_validator
  type: llm_worker
  agent: validator
  inject_response:
  - synthesizer
  - decomposer
  ui_pos:
    y: 410
    x: 1349
  llm_params: strict

- id: check_triage_complexity
  type: condition_router
  input_object: '{{ nodes.extract_facts.output }}'
  field: triage_complexity
  sequential_to: note_1782220193985
  true_to: call_decomposer
  conditions:
  - field: triage_complexity
    equals: cluster
  ui_pos:
    y: 601
    x: -42

- id: save_neurosis_case
  type: custom_tool_call
  ui_pos:
    x: 2170
    y: 400
  tool_file: ../tools/save_neurosis_case.ts
  args:
    report: '{{ signals.validator_report }}'
    core_type: '{{ nodes.compute_pattern.output.pattern_type }}'
  output_message: true
  system_message: |-
    Кейс сохранён: {{ nodes.save_neurosis_case.output.file_name }}

    ```neurosis_case
    {{ nodes.save_neurosis_case.output.case_json_text }}
    ```

- id: read_pattern_section
  type: custom_tool_call
  ui_pos:
    x: 2355
    y: 297
  tool_file: ../../_shared/tools/read_md_section.ts
  args:
    heading: '## {{ nodes.compute_pattern.output.pattern_type }}'
    file: psychotherapist/database/inner_contour_9_patterns.md

- id: call_healer
  type: llm_worker
  agent: neuro_healer
  task: |
    Данные переданы готовыми — вызывать инструменты не требуется.
    Ниже описание лечебного паттерна из базы знаний (пайплайн прочитал секцию по номеру pattern_type, вычисленному нодой compute_pattern из классификации этажей Валидатора) и профиль валидации элементов.

    === НОМЕР ПАТТЕРНА ===
    {{ nodes.compute_pattern.output.pattern_type }}

    === ОПИСАНИЕ ПАТТЕРНА ИЗ БАЗЫ ===
    {{ nodes.read_pattern_section.output.content }}

    === ПРОФИЛЬ ВАЛИДАЦИИ ЭЛЕМЕНТОВ (вердикты Валидатора) ===
    {{ signals.validator_report }}

    Переведи описание паттерна на контекст проблемы пользователя, следуя ИНСТРУКЦИИ и формату вывода из системного промпта.
  output_type: frontend
  inject_response:
  - synthesizer
  - decomposer
  - soma_translator
  ui_pos:
    x: 2647
    y: 293

- id: call_shadow_worker
  type: llm_worker
  agent: shadow_worker
  output_type: frontend
  inject_response:
  - validator
  - synthesizer
  - decomposer
  - soma_translator
  ui_pos:
    x: 2684
    y: 536

- id: note_1782221436115
  type: note
  input: пересчитываем данные с учетом новых данных от юзера
  ui_pos:
    y: 255
    x: -1215

- id: note_1782220193985
  type: note
  input: проверка данных. развилка на доработку данных или отправку на лечение
  ui_pos:
    x: 916
    y: 492

- id: compute_pattern
  type: custom_tool_call
  ui_pos:
    x: 1668
    y: 555
  tool_file: ../tools/compute_pattern_type.ts
  args:
    report: '{{ signals.validator_report }}'

- id: check_pattern
  type: condition_check
  input_object: '{{ nodes.compute_pattern.output }}'
  field: pattern_found
  true_to: save_neurosis_case
  false_to: check_elements1
  ui_pos:
    y: 523
    x: 1988

- id: check_somatic
  type: condition_router
  sequential_to: check_triage_complexity
  true_to: call_soma_translator
  conditions:
  - field: somatic_presence
    equals: new
  - logic: all
    conditions:
    - field: somatic_presence
      equals: history
    - field: reports.soma_translator
      equals: false
  logic: any
  ui_pos:
    y: 218
    x: -802

- id: check_need_handedness
  type: condition_router
  input_object: '{{ nodes.extract_facts.output }}'
  field: handedness
  true_to: note_1785123862689
  conditions:
  - field: handedness
    equals: unknown
  logic: any
  ui_pos:
    x: -96
    y: 50

- id: note_1785123862689
  type: note
  input: уточнение рукости у юзера
  system_message: "Психосоматологу не хватает данных о Вашей биологической рукости. \nДавайте проведём \"Тест с аплодисментами (хлопками)\":\nЕстественно и не задумываясь похлопайте в ладоши, как если бы Вы аплодировали в театре. \n* Та рука, которая оказывается **сверху** (является ведущей, активной, более подвижной и ударяет по другой руке) — указывает на биологическую рукость.\n* Если сверху правая рука — человек **биологический правша**.\n* Если сверху левая рука — человек **биологический левша**.\nВ Вашем следующем сообщении добавьте дополнительно информацию о Вашей биологической рукости."
  ui_pos:
    y: -20
    x: 231

- id: note_1785141025138
  type: note
  input: Объясняем юзеру правила составления запроса
  system_message: |-
    Психотерапевт может решать любые жизненные проблемы внутренние и помогать достигать целей. Всё что Вам необходимо сделать - это правильно объяснить свою проблему в чат.

    некоторые примеры внутренних проблем:
    - проблемы со здоровьем тела
    - абсурдный внутренний блок на пути к своей цели.
    - финансовые блоки
    - проблемы в отношениях с людьми
    - депрессии, вспышки ярости и т.п.
    Если у вас есть сопротивление к работе над собой, то вы можете описать это сопротивление.

    В принципе, как альтернативный вариант Вы можете пользоваться данным агентом  ИИ как доктором которому вы описываете за сегодняшний день своё самочувствие, все свои симптомы и недуги. При таком сценарии этот Агент ИИ сначала попытается найти в вашем подсознании перекосы психического характера, потому что лечение происходит именно через них.
  ui_pos:
    y: 748
    x: -1323

- id: call_request_helper
  type: llm_worker
  agent: request_helper
  output_type: frontend
  ui_pos:
    y: 864
    x: -808

- id: check_elements1
  type: condition_check
  input_object: '{{ nodes.compute_pattern.output }}'
  field: surface_proven
  true_to: call_shadow_worker
  false_to: call_collector
  ui_pos:
    x: 2353
    y: 638

- id: call_synthesizer
  type: llm_worker
  group: group_1
  agent: synthesizer
  output_type: frontend
  inject_response:
  - decomposer
  - soma_translator
  ui_pos:
    x: 526
    y: 382

edges:

- from: user_message
  to: extract_facts

- from: extract_facts
  to: check_has_problem

- from: note_1782220193985
  to: call_validator

- from: read_pattern_section
  to: call_healer

- from: save_neurosis_case
  to: read_pattern_section

- from: call_validator
  to: compute_pattern

- from: compute_pattern
  to: check_pattern

- from: note_1782221436115
  to: check_somatic

- from: call_soma_translator
  to: check_need_handedness

- from: note_1785141025138
  to: call_request_helper

- from: call_decomposer
  to: call_synthesizer
