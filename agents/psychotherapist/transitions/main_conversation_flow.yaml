name: Психотерапевт

config:
  facts_file: facts.yaml
  default_llm_params: creative
  default_system_prompt_file: ../system_frame.md
  default_system_prompt_delivery: user_prefix

entry: user_message

groups:

- id: group_1
  title: Новая группа
  ui_pos:
    x: -105
    y: 719

nodes:

- id: user_message
  type: user_message
  ui_pos:
    y: 493
    x: -2274

- id: extract_facts
  type: llm_fact_extractor
  input: '{{ nodes.user_message.output.text }}'
  ui_pos:
    x: -1990
    y: 493
  llm_params: strict

- id: check_has_problem
  type: condition_check
  input_object: '{{ nodes.extract_facts.output }}'
  field: has_problem
  true_to: note_1782221436115
  false_to: note_1785141025138
  ui_pos:
    x: -1700
    y: 495

- id: call_collector
  type: llm_worker
  agent: data_collector
  output_type: frontend
  inject_response:
  - validator
  - synthesizer
  - decomposer
  - soma_translator
  ui_pos:
    x: 2744
    y: 781

- id: call_soma_translator
  type: llm_worker
  agent: soma_translator
  task: Пользователь описал боль. Дай ему расшифровку по НГМ.
  ui_pos:
    x: -426
    y: 219
  llm_params: strict

- id: call_decomposer
  type: llm_worker
  group: group_1
  agent: decomposer
  task: |-
    Разбери кластер пользователя на мишени по своей инструкции.
    Если ниже есть секция «ИМПОРТИРОВАННЫЙ КЕЙС» — пользователь прикрепил экспорт кейса прошлой сессии: это продолжение работы, а не новая декомпозиция с нуля (правила работы с кейсом — в твоей инструкции). Если секции нет — работай по общим правилам.

    {{ nodes.import_cases.output.imported_cases_text }}
  ui_pos:
    x: 240
    y: 486

- id: call_validator
  type: llm_worker
  agent: validator
  task: |-
    Проверь элементы проблемы пользователя по своей инструкции.
    Если ниже есть секция «ИМПОРТИРОВАННЫЙ КЕЙС» — её непустые элементы доказаны в прошлой сессии (экспорт кейса): переноси их в свой отчёт как доказанные данные пользователя (правило — в твоей инструкции). Если секции нет — работай по общим правилам.

    {{ nodes.import_cases.output.imported_cases_text }}
  inject_response:
  - synthesizer
  - decomposer
  ui_pos:
    x: 1349
    y: 410
  llm_params: strict

- id: check_triage_complexity
  type: condition_router
  input_object: '{{ nodes.extract_facts.output }}'
  field: triage_complexity
  sequential_to: note_1782220193985
  true_to: call_decomposer
  conditions:
  - field: triage_complexity
    equals: cluster
  ui_pos:
    y: 601
    x: -42

- id: save_neurosis_case
  type: custom_tool_call
  system_message: |-
    Кейс сохранён: {{ nodes.save_neurosis_case.output.file_name }}

    ```neurosis_case
    {{ nodes.save_neurosis_case.output.case_json_text }}
    ```
  ui_pos:
    y: 390
    x: 2263
  tool_file: ../tools/save_neurosis_case.ts
  args:
    report: '{{ signals.validator_report }}'
    core_type: '{{ nodes.compute_pattern.output.floor2_type }}'
  output_message: true
  attachments_dir: ../database

- id: read_pattern_section
  type: custom_tool_call
  ui_pos:
    x: 2515
    y: 300
  tool_file: ../tools/read_pattern_sections.ts
  args:
    file: psychotherapist/database/inner_9_patterns_by_gifts.md
    report: '{{ signals.validator_report }}'
    core: '{{ nodes.compute_pattern.output.floor2_type }}'

- id: call_healer
  type: llm_worker
  agent: neuro_healer
  task: |
    Данные переданы готовыми — вызывать инструменты не требуется.
    Ниже лечебные паттерны ТРЁХ этажей невроза из базы знаний (пайплайн прочитал секции по типам этажей: Этаж 0 и Этаж -1 — классификация Валидатора, ядро Этажа -2 — вычислено нодой compute_pattern по SAFETY-сцепке) и профиль валидации элементов.

    === ЛЕЧЕБНЫЕ ПАТТЕРНЫ ПО ЭТАЖАМ ===
    {{ nodes.read_pattern_section.output.content }}

    === ПРОФИЛЬ ВАЛИДАЦИИ ЭЛЕМЕНТОВ (вердикты Валидатора) ===
    {{ signals.validator_report }}

    Переведи паттерны на контекст проблемы пользователя, следуя ИНСТРУКЦИИ и формату вывода из системного промпта: каждому этажу — своя энергия Дара из его паттерна.
  output_type: frontend
  inject_response:
  - synthesizer
  - decomposer
  - soma_translator
  ui_pos:
    y: 296
    x: 2804

- id: call_shadow_worker
  type: llm_worker
  agent: shadow_worker
  output_type: frontend
  inject_response:
  - validator
  - synthesizer
  - decomposer
  - soma_translator
  ui_pos:
    x: 2684
    y: 536

- id: note_1782221436115
  type: note
  input: пересчитываем данные с учетом новых данных от юзера
  ui_pos:
    x: -1215
    y: 255

- id: import_cases
  type: custom_tool_call
  ui_pos:
    x: -1010
    y: 236
  tool_file: ../tools/import_neurosis_case.ts
  args:
    files: '{{ json_files }}'

- id: note_1782220193985
  type: note
  input: проверка данных. развилка на доработку данных или отправку на лечение
  ui_pos:
    x: 916
    y: 492

- id: compute_pattern
  type: custom_tool_call
  ui_pos:
    x: 1668
    y: 555
  tool_file: ../tools/compute_pattern_type.ts
  args:
    report: '{{ signals.validator_report }}'

- id: check_pattern
  type: condition_check
  input_object: '{{ nodes.compute_pattern.output }}'
  field: pattern_found
  true_to: save_neurosis_case
  false_to: check_elements1
  ui_pos:
    y: 551
    x: 1957

- id: check_somatic
  type: condition_router
  sequential_to: check_triage_complexity
  true_to: call_soma_translator
  conditions:
  - field: somatic_presence
    equals: new
  - logic: all
    conditions:
    - field: somatic_presence
      equals: history
    - field: reports.soma_translator
      equals: false
  logic: any
  ui_pos:
    x: -802
    y: 218

- id: check_need_handedness
  type: condition_router
  input_object: '{{ nodes.extract_facts.output }}'
  field: handedness
  true_to: note_1785123862689
  conditions:
  - field: handedness
    equals: unknown
  logic: any
  ui_pos:
    x: -96
    y: 50

- id: note_1785123862689
  type: note
  input: уточнение рукости у юзера
  system_message: "Психосоматологу не хватает данных о Вашей биологической рукости. \nДавайте проведём \"Тест с аплодисментами (хлопками)\":\nЕстественно и не задумываясь похлопайте в ладоши, как если бы Вы аплодировали в театре. \n* Та рука, которая оказывается **сверху** (является ведущей, активной, более подвижной и ударяет по другой руке) — указывает на биологическую рукость.\n* Если сверху правая рука — человек **биологический правша**.\n* Если сверху левая рука — человек **биологический левша**.\nВ Вашем следующем сообщении добавьте дополнительно информацию о Вашей биологической рукости."
  ui_pos:
    y: -20
    x: 231

- id: note_1785141025138
  type: note
  input: Объясняем юзеру правила составления запроса
  system_message: |-
    Психотерапевт может решать любые жизненные проблемы внутренние и помогать достигать целей. Всё что Вам необходимо сделать - это правильно объяснить свою проблему в чат.

    некоторые примеры внутренних проблем:
    - проблемы со здоровьем тела
    - абсурдный внутренний блок на пути к своей цели.
    - финансовые блоки
    - проблемы в отношениях с людьми
    - депрессии, вспышки ярости и т.п.
    Если у вас есть сопротивление к работе над собой, то вы можете описать это сопротивление.

    В принципе, как альтернативный вариант Вы можете пользоваться данным агентом  ИИ как доктором которому вы описываете за сегодняшний день своё самочувствие, все свои симптомы и недуги. При таком сценарии этот Агент ИИ сначала попытается найти в вашем подсознании перекосы психического характера, потому что лечение происходит именно через них.
  ui_pos:
    y: 748
    x: -1323

- id: call_request_helper
  type: llm_worker
  agent: request_helper
  output_type: frontend
  ui_pos:
    y: 864
    x: -808

- id: check_elements1
  type: condition_check
  input_object: '{{ nodes.compute_pattern.output }}'
  field: surface_proven
  true_to: call_shadow_worker
  false_to: call_collector
  ui_pos:
    x: 2353
    y: 638

- id: call_synthesizer
  type: llm_worker
  group: group_1
  agent: synthesizer
  task: |-
    Выбери стартовую мишень по своей инструкции.
    Если ниже есть секция «ИМПОРТИРОВАННЫЙ КЕЙС» — это продолжение работы над кейсом прошлой сессии: его мишень (target) — полноправный кандидат наряду с новыми мишенями декомпозитора (правила — в твоей инструкции). Если секции нет — работай по общим правилам.

    {{ nodes.import_cases.output.imported_cases_text }}
  output_type: frontend
  inject_response:
  - decomposer
  - soma_translator
  ui_pos:
    x: 526
    y: 382

edges:

- from: user_message
  to: extract_facts

- from: extract_facts
  to: check_has_problem

- from: note_1782220193985
  to: call_validator

- from: save_neurosis_case
  to: read_pattern_section

- from: read_pattern_section
  to: call_healer

- from: call_validator
  to: compute_pattern

- from: compute_pattern
  to: check_pattern

- from: note_1782221436115
  to: import_cases

- from: import_cases
  to: check_somatic

- from: call_soma_translator
  to: check_need_handedness

- from: note_1785141025138
  to: call_request_helper

- from: call_decomposer
  to: call_synthesizer
