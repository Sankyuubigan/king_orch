name: Психотерапевт

visible: true

config:
  facts_file: facts.yaml
  default_llm_params: creative

nodes:

- id: extract_facts
  type: llm_fact_extractor
  input: |
    User: {{ user_message }}
    Session history (последние сообщения сессии): {{ messages }}
  ui_pos:
    x: -1990
    y: 493
  llm_params: strict

- id: check_has_problem
  type: condition_check
  field: has_problem
  true_to: note_1782221436115
  false_to: note_1785141025138
  ui_pos:
    x: -1700
    y: 495

- id: call_provocateur
  type: llm_worker
  agent: provocateur
  output_type: message
  inject_reports:
  - validator
  ui_pos:
    x: 3077
    y: 153

- id: call_soma_translator
  type: llm_worker
  agent: soma_translator
  task: Пользователь описал боль. Дай ему расшифровку по НГМ.
  ui_pos:
    y: 139
    x: -21

- id: collect_info
  type: llm_worker
  agent: liaison
  task: |
    Пользователь описал проблему, но не хватает данных. Собери недостающие пункты по Протоколу 3 пунктов: 1. Контекст проблемы (подробное описание) 2. Как клиент хочет, чтобы проблема решилась (жизнь без неё) 3. Как клиент справляется сейчас (адаптация/компенсация)
  output_type: message
  ui_pos:
    y: -545
    x: 105
  disabled: true

- id: call_grounder
  type: llm_worker
  agent: grounder
  task: Проанализируй отчёты коллег и жалобу пользователя. Выдай несколько конкретных, приземлённых бытовых сценариев возможных ментальных причин проблемы. Если данных не хватает — задай пользователю уточняющие вопросы.
  output_type: message
  inject_reports:
  - soma_translator
  ui_pos:
    y: 72
    x: 1163

- id: call_validator
  type: llm_worker
  agent: validator
  inject_reports:
  - decomposer
  ui_pos:
    y: 278
    x: 2075

- id: check_validator_signal
  type: signal_router
  signal_name: validator_report
  field: verdict
  cases_priority:
  - key: УТОЧНЕНИЕ ДАННЫХ НЕОБХОДИМО
    to: note_1782220533024
  - key: ДАННЫХ ДОСТАТОЧНО
    to: note_1782220629095
  ui_pos:
    y: 179
    x: 2422

- id: call_destructor_finder
  type: llm_worker
  agent: destructor_detector
  task: |
    Проанализируй отчёты коллег и определи Деструктор (Этаж -2).
    Найди: Идол, Угрозу, Деструктор, Запрет удовольствия, Парадоксальную петлю.
    Сохрани diagnostic_report через инструмент emit_signal.
    После отправки сигнала ответь target: reply с кратким итогом.
  inject_reports:
  - soma_translator
  - pattern_finder_by_floors
  ui_pos:
    x: 4102
    y: 941
  disabled: true

- id: call_pattern_finder
  type: llm_worker
  agent: pattern_finder_by_floors
  inject_reports:
  - soma_translator
  - validator
  ui_pos:
    y: 570
    x: 4260

- id: call_healer
  type: llm_worker
  agent: neuro_reprogrammer
  task: |
    Из отчёта pattern_finder_by_floors возьми номер типа паттерна.
    Затем выполни ШАГ 2 — прочитай описание этого паттерна в базе знаний инструментом ReadSection.
    После этого переведи паттерн на контекст проблемы пользователя.
  output_type: message
  inject_reports:
  - pattern_finder_by_floors
  - synthesizer
  ui_pos:
    y: 678
    x: 4801

- id: check_somatic
  type: condition_check
  field: has_somatic
  sequential_to: note_1782224256075
  true_to: call_soma_translator
  ui_pos:
    x: -269
    y: 204

- id: check_grounding
  type: condition_check
  field: grounding_dont_exist
  true_to: note_1785036347995
  false_to: call_cluster_checker
  ui_pos:
    y: 325
    x: 410

- id: call_cluster_checker
  type: llm_worker
  agent: cluster_checker
  ui_pos:
    y: 347
    x: 801

- id: check_cluster_signal
  type: signal_router
  signal_name: cluster_checker
  cases_priority:
  - key: Конкретная проблема
    to: note_1782220193985
  - key: Кластер
    to: call_decomposer
  default: call_decomposer
  ui_pos:
    y: 295
    x: 1058

- id: call_decomposer
  type: llm_worker
  agent: decomposer
  ui_pos:
    x: 1315
    y: 447

- id: synchronize_with_user
  type: llm_worker
  agent: synchronizer
  ui_pos:
    y: 162
    x: 3367
  disabled: true

- id: call_request_helper
  type: llm_worker
  agent: request_helper
  output_type: message
  ui_pos:
    x: -808
    y: 864

- id: note_1782220193985
  type: note
  input: |
    проверка данных. развилка на доработку данных или отправку на лечение
  ui_pos:
    y: 287
    x: 1638

- id: note_1782220533024
  type: note
  input: уточнение данных у юзера
  system_message: "Давайте проведем один мысленный эксперимент, чтобы заглянуть в самый корень вашей проблемы. Если вы окажетесь в этой точке и пути назад не будет, с каким самым невыносимым чувством вы столкнетесь внутри себя? \n\n(Пожалуйста, не пишите о том, что вы будете делать или как будете решать проблему. Опишите именно вашу внутреннюю катастрофу. Например: \"я почувствую себя абсолютно бесполезным ничтожеством\", \"я столкнусь с парализующим страхом смерти/пустоты\", \"я почувствую, что я абсолютно одинок и никому не нужен\", \"моя самооценка будет уничтожена\". Что именно сломается внутри вас?)\n\nПредставьте гипотетическую, но абсолютно безвыходную ситуацию. Что Вы почувствуете в этот момент ? Какие эмоции или состояние вы ощутите?"
  ui_pos:
    x: 2678
    y: 98

- id: note_1782220629095
  type: note
  input: ослабление сопротивления
  ui_pos:
    y: 566
    x: 3097

- id: note_1782221436115
  type: note
  input: пересчитываем данные с учетом новых данных от юзера
  ui_pos:
    x: -682
    y: 241

- id: note_1782224256075
  type: note
  input: проверяем абстрактный ли запрос
  ui_pos:
    y: 291
    x: 21

- id: call_shadow_worker
  type: llm_worker
  agent: shadow_worker
  output_type: message
  ui_pos:
    x: 3549
    y: 628
  disabled: true

- id: note_1784427848563
  type: note
  input: вычисление типа
  ui_pos:
    y: 582
    x: 3824

- id: combining_targets
  type: llm_worker
  agent: synthesizer
  inject_reports:
  - pattern_finder_by_floors
  - validator
  ui_pos:
    y: 694
    x: 4516

- id: note_1785036347995
  type: note
  input: запрос абстрактный. вызываем поиск сценариев
  system_message: Психотерапевт обнаружил, что Ваша проблема является симптомом (фасадом). Для того чтобы найти ментальную причину Вашей проблемы в психике, Вам будут предложены сценарии примерные возможных ментальных проблем в Вашей жизни. Ваша задача - описать Ваш личный кейс опираясь на эти "примерные" сценарии.
  ui_pos:
    y: 48
    x: 721

- id: check_need_handedness
  type: signal_router
  signal_name: soma_translator
  cases_priority:
  - key: НУЖНА РУКОСТЬ
    to: note_1785123862689
  - key: РУКОСТЬ ИЗВЕСТНА
    to: check_grounding
  default: check_grounding
  ui_pos:
    y: 82
    x: 282

- id: note_1785123862689
  type: note
  input: уточнение рукости у юзера
  system_message: "Психосоматологу не хватает данных о Вашей биологической рукости. \nДавайте проведём \"Тест с аплодисментами (хлопками)\":\nЕстественно и не задумываясь похлопайте в ладоши, как если бы Вы аплодировали в театре. \n* Та рука, которая оказывается **сверху** (является ведущей, активной, более подвижной и ударяет по другой руке) — указывает на биологическую рукость.\n* Если сверху правая рука — человек **биологический правша**.\n* Если сверху левая рука — человек **биологический левша**.\nВ Вашем следующем сообщении добавьте дополнительно информацию о Вашей биологической рукости."
  ui_pos:
    y: -156
    x: 536

- id: note_1785141025138
  type: note
  input: Объясняем юзеру правила составления запроса
  system_message: |-
    Психотерапевт может решать любые жизненные проблемы внутренние и помогать достигать целей. Всё что Вам необходимо сделать - это правильно объяснить свою проблему в чат.

    некоторые примеры внутренних проблем:
    - проблемы со здоровьем тела
    - абсурдный внутренний блок на пути к своей цели.
    - финансовые блоки
    - проблемы в отношениях с людьми
    - депрессии, вспышки ярости и т.п.
  ui_pos:
    x: -1323
    y: 748

edges:

- from: extract_facts
  to: check_has_problem

- from: note_1782220533024
  to: call_provocateur

- from: note_1785036347995
  to: call_grounder

- from: note_1782220193985
  to: call_validator

- from: call_validator
  to: check_validator_signal

- from: note_1784427848563
  to: call_pattern_finder

- from: combining_targets
  to: call_healer

- from: note_1782221436115
  to: check_somatic

- from: note_1782224256075
  to: check_grounding

- from: call_cluster_checker
  to: check_cluster_signal

- from: call_provocateur
  to: synchronize_with_user

- from: note_1785141025138
  to: call_request_helper

- from: call_decomposer
  to: note_1782220193985

- from: note_1782220629095
  to: call_shadow_worker

- from: call_shadow_worker
  to: note_1784427848563

- from: call_pattern_finder
  to: combining_targets

- from: call_soma_translator
  to: check_need_handedness
