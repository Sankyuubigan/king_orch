# SSOT: Правила валидации элементов невроза (1-9)
# Синхронизировано с neurosis_architecture.md

somatic_filter:
  test_question: "Это описание ментального переживания, эмоции, мысли, убеждения, правила, самооценки или поведенческого паттерна (ДА) — ИЛИ это описание изолированной физической боли, спазма, зажима, телесного дискомфорта и физического рефлекса (НЕТ)?"
  exclude_as_no:
    - "Изолированная физическая боль, спазм, зажим в теле без описания ментального тупика или психологической реакции"
    - "Чисто физический дискомфорт от симптома"
    - "Физиологический рефлекс (желание растянуться, размять мышцу, лечь от физической боли)"
  include_as_yes:
    - "Ментальная реакция на симптом или ситуацию: зацикленность, ощущение тупика, страх, тревога, злость, удержание себя от шага"
    - "Автоматический поведенческий паттерн (активные действия или пассивное избегание/прокрастинация/замирание в ответ на напряжение)"
    - "Эмоциональные состояния, правила-долженствования, убеждения о мире, Я-концепция, глубинная боль и идеализированные требования (Идолы)"

elements:
  1:
    name: "Сопротивление"
    layer: "Поверхностный (доступен на входе)"
    floor: "Этаж 0 {1, 4, 7} — Гомеостаз и следствие"
    must_have: "Фиксация ментального блока между человеком и реальностью прямо сейчас: зацикленность на проблеме, ощущение тупика, невозможность сдвинуться, удержание себя от действия или привычка терпеть напряжение."
    must_not_be:
      - "Изолированная физическая жалоба (боль, спазм, болезнь) без описания психологического застревания, зацикленности или внутреннего сопротивления"
      - "Простое описание внешних фактов без внутренней блокировки восприятия/действия"
    evidence_test: "Описал ли пользователь конкретный ментальный тупик, навязчивую зацикленность на проблеме/симптоме, внутренний стоп-кран или вынужденное терпение, не дающее сдвинуться с места?"
    validation_question: "В чём именно человек сейчас застрял на уровне восприятия/психики? Что он терпит или чему внутри сопротивляется прямо сейчас?"

  2:
    name: "Поведение"
    layer: "Поверхностный (доступен на входе)"
    floor: "Этаж -1 {2, 5, 8} — Столкновение с реальностью"
    must_have: "Наблюдаемый автоматический паттерн реагирования на внутреннее напряжение: что человек систематически ДЕЛАЕТ (активная компенсация) или НЕ ДЕЛАЕТ (пассивное избегание)."
    must_not_be:
      - "Чисто внутренние переживания, мысли или эмоции без описания того, как человек поступает в реальности"
      - "Идеализированная картинка желаемого будущего / Суррогат Рая (это Элемент 9)"
    evidence_test: "Описан ли конкретный стереотип поведения в ответ на стресс — активный (контроль, споры, угодничество, проверочные ритуалы, суета, спасательство) ИЛИ пассивный (избегание, прокрастинация, замирание, молчаливое проглатывание, уход в сериалы/сон/еду)?"
    validation_question: "Что человек автоматически ДЕЛАЕТ или НЕ делает (избегает, откладывает, замирает), когда сталкивается с этим напряжением?"

  3:
    name: "Катастрофа"
    layer: "Глубинный (вскрывается ТОЛЬКО после срыва фасада)"
    floor: "Этаж -2 {3, 6, 9} — Триада травмы (Ядро)"
    formula: "Идол-Катастрофа: Катастрофа (3) — это предельная онтологическая Дыра (непереносимое внутреннее переживание краха), которая обнажается, когда рушится Корневой Идол (9) и срабатывает угроза из Правила-Кнута (5). Валидируется true ТОЛЬКО если названо это предельное внутреннее состояние краха, а не бытовой дискомфорт."
    must_have: "Названо субъективно непереносимое глубинное состояние (чувство полного ничтожества, отверженности, покинутости, внутренней грязи/дефектности, беспомощности, раздавленности или исчезновения), от которого человека защищает Идол (9)."
    must_not_be:
      - "Привычная фоновая повседневная эмоция — просто тревога, раздражение или грусть (это Элемент 7)"
      - "Практическая неудача или внешнее событие само по себе ('меня уволят', 'он уйдет', 'потеряю деньги') без ответа на вопрос, КАКОЕ непереносимое внутреннее состояние это вызовет внутри"
      - "Констатация бытового дефицита ('хочу, но не получается')"
    evidence_test: "Описал ли пользователь предельную внутреннюю душевную боль / онтологическую дыру (кем и каким раздавленным он себя почувствует на самом дне), если его Идол (9) и Правила (5) рухнут?"
    validation_question: "Какая невыносимая внутренняя дыра и боль откроется внутри человека в ту секунду, когда рухнет его защита и случится худшее?"

  4:
    name: "Самооценка"
    layer: "Глубинный (Я-концепция внутри структуры)"
    floor: "Этаж 0 {1, 4, 7} — Гомеостаз и следствие"
    must_have: "Четкое самоопределение («Кто я в этой проблеме?»): искаженная Я-концепция, оценка своей ценности или присвоенная себе жесткая роль."
    must_not_be:
      - "Описание ситуации или других людей без самоотнесения к собственной идентичности/роли"
      - "Мимолетная эмоция ('мне грустно') без вывода о том, КАКОЙ Я в этом ('я слабак', 'я пустое место', 'я единственный, кто всё тащит')"
    evidence_test: "Определил ли пользователь свою идентичность, самоценность или роль в этой ситуации — как в полюсе ущербности ('я плохой/дефектный/ничтожный/маленький/ненужный'), так и в полюсе защитной инфляции Эго ('я спаситель/правильный/сильный/выше других')?"
    validation_question: "Кем пользователь себя ощущает и какую роль играет в этой проблеме (какова его самооценка и условие собственной ценности)?"

  5:
    name: "Правила"
    layer: "Промежуточный (вскрывается при исследовании защитного периметра)"
    floor: "Этаж -1 {2, 5, 8} — Столкновение с реальностью"
    formula: "Правило-Кнут: 'Я обязан / Мне категорически нельзя / Мир обязан делать X, ИНАЧЕ случится расплата/катастрофа'. Это жесткий закон, который бьет психику и гонит ее к Идолу (9)."
    must_have: "Категорическое операционное правило, запрет или система долженствований (к себе или к миру), работающая как принудительная инструкция выживания в данной проблеме."
    must_not_be:
      - "Мягкие бытовые пожелания ('было бы неплохо отдохнуть'), не работающие как жесткий внутренний закон/запрет"
      - "Простое описание факта поведения без стоящего за ним императива 'я должен / мне нельзя / они обязаны'"
    evidence_test: "Сформулирован ли жесткий внутренний императив (правило-кнут, лимит, запрет на проявление чего-то или требование к миру), нарушение которого воспринимается психикой как недопустимая угроза?"
    validation_question: "Каким жестким правилом-кнутом ('я обязан / мне запрещено / мир должен, иначе...') пользователь управляет собой в этой проблеме?"

  6:
    name: "Триггер"
    layer: "Поверхностный (доступен на входе)"
    floor: "Этаж -2 {3, 6, 9} — Триада травмы (Входящий пробивающий сигнал)"
    must_have: "Конкретный пусковой стимул реальности (внешнее событие, конкретное действие/реакция другого человека, изменение ситуации или вторгающаяся мысль/образ), который запускает реакцию."
    must_not_be:
      - "Чисто соматический симптом (физическая боль, спазм, сбой органа)"
      - "Хроническое фоновое состояние или ярлык без конкретного пускового момента ('я всегда тревожный', 'я неудачник')"
    evidence_test: "Назван ли конкретный входящий сигнал (действие, слово, выражение лица другого, ситуация выбора/давления или конкретная мысль), в ответ на который включается проблемный цикл?"
    validation_question: "Какой конкретный пусковой момент (событие, чужая реакция или мысль) запускает всю эту цепь?"

  7:
    name: "Эмоции"
    layer: "Поверхностный / Промежуточный (Топливо цикла)"
    floor: "Этаж 0 {1, 4, 7} — Гомеостаз и следствие"
    must_have: "Повторяющаяся психологическая эмоция (страсть/грех этажа гомеостаза: тревога, подавленный гнев/раздражение, обида, вина, стыд, зависть, апатия/уныние), которая крутит цикл проблемы."
    must_not_be:
      - "Физические ощущения (боль, холод, спазм, усталость мышц) без эмоционального переживания"
      - "Предельная онтологическая катастрофа при полном крахе защит (это Элемент 3; в Элементе 7 живет именно повседневное эмоциональное топливо цикла)"
    evidence_test: "Названа ли конкретная повторяющаяся эмоция, в которой пользователь варится внутри этой проблемы и которая удерживает систему в напряжении?"
    validation_question: "Какая хроническая эмоция (тревога, вина, обида, раздражение, стыд, тоска, апатия) постоянно крутится внутри этой ситуации?"

  8:
    name: "Иллюзии"
    layer: "Глубинный (вычисляется из Правила-Кнута [5])"
    floor: "Этаж -1 {2, 5, 8} — Столкновение с реальностью"
    formula: "Аксиома Мира: Элемент 8 — это глубинная искаженная картина реальности, объясняющая, ПОЧЕМУ человек вынужден подчиняться Правилу-Кнуту (5). ('Мир и люди устроены так небезпечно/дефицитно [8], поэтому я обязан соблюдать правило [5]')."
    must_have: "Фундаментальное убеждение (фильтр восприятия, верование) о том, каков мир, каковы люди и по каким жестоким/условным законам устроена жизнь в контексте проблемы."
    must_not_be:
      - "Прямая констатация единичного факта без обобщенного убеждения о природе мира/людей/жизни"
      - "Простое правило действия 'я должен X' без объяснения того, каким воспринимается сам мир (это Элемент 5)"
    evidence_test: "Вскрыта ли искаженная картина мира / фильтр восприятия (какими опасными, требовательными, оценивающими или холодными видятся мир, люди и законы жизни), из которых логически вытекает Правило-Кнут (5)?"
    validation_question: "Каким опасным, условным или враждебным видится мир/люди в этой проблеме, что пользователю приходится жить по своему жесткому правилу?"

  9:
    name: "Идол"
    layer: "Промежуточный / Глубинный (вскрывается ТОЛЬКО после срыва бытового фасада)"
    floor: "Этаж -2 {3, 6, 9} — Триада травмы (Ядро)"
    formula: "Идол-Заплатка: Элемент 9 — это Иллюзорная точка Б (Суррогат Рая / пластиковая морковка), которую психика требует от реальности или себя, чтобы навсегда экранировать Дыру (3). Элемент 9 обязан быть прямой смысловой заплаткой на Элемент 3."
    must_have: "Описание идеализированного конечного состояния (100% гарантий, абсолютной безупречности, тотальной нужности, неуязвимой брони, капсулы покоя без трений, вечного праздника, всезнания или триумфального фасада), обретение которого дало бы человеку иллюзию окончательного спасения от его Дыры (3)."
    must_not_be:
      - "Поверхностное поведенческое избегание или способ отвлечься в моменте — сериалы, сон, прокрастинация, заедание (это Элемент 2, а НЕ Элемент 9!)"
      - "Бытовая здоровая практическая задача, не несущая функции абсолютного спасения от глубинной боли (3)"
      - "Поверхностная ситуативная хотелка до срыва фасада, если не показана её роль как суррогата безопасности/любви/ценности поверх Дыры (3)"
    evidence_test: "Вскрыта ли идеализированная картинка 'Ложного Рая' (сверхценное условие или состояние — Идол), которого пользователь страстно требует от мира/других/себя как единственной гарантии, чтобы никогда не провалиться в свою Катастрофу (3)?"
    validation_question: "Какой идеальной картинки (Суррогата Рая / 100% гарантии / абсолютного состояния) требует психика пользователя, чтобы наконец успокоиться и никогда не столкнуться со своей глубинной болью (3)?"
