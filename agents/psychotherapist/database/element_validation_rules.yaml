# SSOT: Правила валидации элементов невроза (1-9)
# Синхронизировано с neurosis_architecture.md

verdict_language_rules:
  audience: "Тексты элементов e1..e9 и target напрямую отображаются пользователю на визуальной схеме в чате (neurosis-case)."
  style: "Только простые, живые, понятные слова (от 1-го лица или прямая безличная суть состояния), строго на основе того, что реально сказал или подтвердил сам пользователь."
  forbidden_meta_phrases:
    - "пользователь фиксирует / описывает / указывает / считает / оценивает себя"
    - "из контекста вытекает / следует / считывается"
    - "если защита рухнет — откроется / при крушении защиты"
  forbidden_jargon:
    - "онтологический / экзистенциальный / категорический императив / императив"
    - "гомеостаз / инфляция эго / я-концепция / депривация / шизоидный / оральный"
    - "черная дыра / непоколебимый тотем / экзистенциальная бездна"
    - "пусковой момент / пусковой стимул / ментальный блок / триггер / паттерн / эннеатип"
  anti_hallucination_rule: "ЗАПРЕЩЕНО списывать недостающие элементы (e3, e4, e5, e8, e9) из справочника patterns_9_types_detailed.md и запрещено Валидатору самому в уме моделировать крушение защит за пользователя! Если пользователь еще не озвучил этот слой и не выбрал вариант вилки shadow_worker — элемент ОБЯЗАН быть false."

somatic_filter:
  test_question: "Это описание ментального переживания, эмоции, мысли, убеждения, правила, самооценки или поведенческого паттерна (ДА) — ИЛИ это описание изолированной физической боли, спазма, зажима, телесного дискомфорта и физического рефлекса (НЕТ)?"
  exclude_as_no:
    - "Изолированная физическая боль, спазм, зажим в теле без описания ментального тупика или психологической реакции"
    - "Чисто физический дискомфорт от симптома"
    - "Физиологический рефлекс (желание растянуться, размять мышцу, лечь от физической боли)"
  include_as_yes:
    - "Ментальная реакция на симптом или ситуацию: зацикленность, ощущение тупика, страх, тревога, злость, удержание себя от шага"
    - "Автоматический поведенческий паттерн (активные действия или пассивное избегание/прокрастинация/замирание в ответ на напряжение)"
    - "Эмоциональные состояния, правила-долженствования, убеждения о мире, самоощущение, глубинная боль и идеализированные требования"

elements:
  1:
    name: "Сопротивление"
    layer: "Поверхностный (доступен на входе)"
    floor: "Этаж 0 {1, 4, 7} — Гомеостаз и следствие"
    must_have: "Внутреннее сопротивление между человеком и реальностью прямо сейчас: зацикленность на проблеме, ощущение тупика, невозможность сдвинуться, удержание себя от действия или привычка терпеть напряжение."
    must_not_be:
      - "Изолированная физическая жалоба (боль, спазм, болезнь) без описания психологического застревания или внутреннего сопротивления"
      - "Простое описание внешних фактов без внутренней блокировки восприятия/действия"
    evidence_test: "Описал ли пользователь (своими словами или подтвердив сценарий) конкретный внутренний тупик, навязчивую зацикленность, внутренний стоп-кран или вынужденное терпение, не дающее сдвинуться с места?"
    validation_question: "В чём именно человек сейчас застрял по его собственным словам?"

  2:
    name: "Поведение"
    layer: "Поверхностный (доступен на входе)"
    floor: "Этаж -1 {2, 5, 8} — Столкновение с реальностью"
    must_have: "Наблюдаемый автоматический способ реагирования на внутреннее напряжение: что человек систематически ДЕЛАЕТ (активная компенсация) или НЕ ДЕЛАЕТ (пассивное избегание, откладывание, отвлечение)."
    must_not_be:
      - "Чисто внутренние переживания, мысли или эмоции без описания того, как человек поступает в реальности"
      - "Идеализированная картинка желаемого будущего / Ложный Рай (это Элемент 9)"
    evidence_test: "Описал ли пользователь (прямо или выбрав сценарий) свой конкретный стереотип поведения в ответ на стресс — активный или пассивный (избегание, откладывание, замирание, отвлечение)?"
    validation_question: "Что человек автоматически ДЕЛАЕТ или как избегает, когда сталкивается с этим напряжением?"

  3:
    name: "Катастрофа"
    layer: "Глубинный (Конечное ядро Этажа -2)"
    floor: "Этаж -2 {3, 6, 9} — Триада травмы (Ядро)"
    formula: "Проверка Конечного Корня (Этаж -2, тип floor2_type): Элемент 3 валидируется ТОЛЬКО при одновременном выполнении 3 условий: (1) САМ ПОЛЬЗОВАТЕЛЬ в диалоге уже раскрыл это предельное состояние ИЛИ подтвердил вариант вилки/мысленного эксперимента от shadow_worker (Валидатору СТРОГО ЗАПРЕЩЕНО самому моделировать в уме 'При крушении защиты вскрывается...' и списывать e3 из patterns_9_types_detailed.md!); (2) это состояние относится к корневому уровню Этажа -2 (тип floor2_type, на 2 шага Безопасности глубже Этажа 0), а НЕ является повторением поверхностного страха или избегания с Этажа 0 / Этажа -1; (3) оно обнажается при крушении парного ему Корневого Идола (9), который также подтвержден пользователем."
    must_have: "Подтвержденное самим пользователем (в ответе на бурение shadow_worker или прямым открытым признанием) предельное внутреннее состояние краха, совпадающее по структуре с эталоном Элемента 3 типа floor2_type (раздел ЭТАЖ -2 в patterns_9_types_detailed.md)."
    must_not_be:
      - "Списанная Валидатором из справочника гипотеза ('Если защита рухнет — откроется...'), которую еще не спрашивали у пользователя через shadow_worker"
      - "Поверхностный страх, перегруз или дискомфорт с верхних этажей (Этаж 0 или Этаж -1), когда человек еще не спустился к корневому Этажу -2"
      - "Фоновая эмоция (Элемент 7) или внешнее событие (Элемент 6)"
    evidence_test: "Подтвердил ли САМ ПОЛЬЗОВАТЕЛЬ в чате (ответом на мысленный эксперимент/вилку shadow_worker или прямым признанием) эту глубинную точку краха Этажа -2 (floor2_type), или это пока только не проверенная с ним гипотеза?"
    validation_question: "Озвучил или подтвердил ли уже сам пользователь то предельное состояние краха (типа floor2_type), с которым он столкнется на самом дне?"

  4:
    name: "Самооценка"
    layer: "Глубинный (Самоопределение внутри структуры)"
    floor: "Этаж 0 {1, 4, 7} — Гомеостаз и следствие"
    must_have: "Четкое самоопределение пользователя («Кто я и какой я в этой проблеме?»): оценка своей ценности, силы или своей роли, которая реально прозвучала от самого пользователя или подтверждена им в вилке."
    must_not_be:
      - "Шаблонное описание из карточки типа в patterns_9_types_detailed.md ('я тихий незаметный человек' и т.п.), которого сам пользователь о себе НЕ говорил"
      - "Описание внешней задачи или ситуации без самоопределения человека"
    evidence_test: "Выразил ли сам пользователь в диалоге (своими словами или выбором варианта), каким человеком он себя ощущает и оценивает в этой проблеме?"
    validation_question: "Кем и каким пользователь сам себя назвал или проявил в этой проблеме?"

  5:
    name: "Правила"
    layer: "Промежуточный (Защитный периметр Этажа -1)"
    floor: "Этаж -1 {2, 5, 8} — Столкновение с реальностью"
    formula: "Правило-Кнут Этажа -1: Подтверждается ТОЛЬКО если пользователь сам озвучил это жесткое требование/запрет к себе (или подтвердил вариант вилки shadow_worker), и оно соответствует эталону 'Элемент 5' типа floor1_type на Этаже -1. Запрещено копировать правило из справочника patterns_9_types_detailed.md, если пользователь его не высказывал!"
    must_have: "Жесткое внутреннее требование или запрет ('я обязан / мне нельзя / иначе расплата'), реально прозвучавшее в словах пользователя или подтвержденное им в вилке."
    must_not_be:
      - "Выдуманное по справочнику правило, которого пользователь не произносил и не подтверждал"
      - "Простое описание факта поведения (Элемент 2) без правила"
    evidence_test: "Произнес ли сам пользователь (или выбрал в вилке shadow_worker) это жесткое правило/запрет, и соответствует ли оно эталону типа floor1_type на Этаже -1?"
    validation_question: "Какое жесткое внутреннее правило или запрет реально озвучил или подтвердил пользователь?"

  6:
    name: "Триггер"
    layer: "Поверхностный (доступен на входе)"
    floor: "Этаж -2 {3, 6, 9} — Входящий пробивающий сигнал"
    must_have: "Конкретная жизненная ситуация, внешнее событие, задача, действие/реакция другого человека или вторгающаяся мысль, которые запускают проблемную реакцию."
    must_not_be:
      - "Чисто соматический симптом (физическая боль, спазм, сбой органа)"
      - "Хроническое фоновое состояние или ярлык без конкретной ситуации"
    evidence_test: "Назвал ли пользователь (прямо или выбрав бытовой сценарий) конкретную ситуацию, задачу или чужую реакцию, в ответ на которую включается проблемный цикл?"
    validation_question: "Какая конкретная ситуация, задача или чужая реакция запускает всю эту цепь?"

  7:
    name: "Эмоции"
    layer: "Поверхностный / Промежуточный (Топливо цикла)"
    floor: "Этаж 0 {1, 4, 7} — Гомеостаз и следствие"
    must_have: "Повторяющаяся психологическая эмоция (тревога, подавленный гнев/раздражение, обида, вина, тяжесть долга, стыд, зависть, печаль, апатия), которую пользователь испытывает в этой проблеме."
    must_not_be:
      - "Физические ощущения (боль, холод, спазм) без эмоционального переживания"
      - "Предельная глубинная катастрофа при полном крахе защит (это Элемент 3)"
    evidence_test: "Описал ли пользователь конкретную повторяющуюся эмоцию или душевную тяжесть, в которой он варится внутри этой ситуации?"
    validation_question: "Какая повторяющаяся эмоция крутится внутри этой ситуации по словам пользователя?"

  8:
    name: "Иллюзии"
    layer: "Глубинный (Фильтр восприятия Этажа -1)"
    floor: "Этаж -1 {2, 5, 8} — Столкновение с реальностью"
    formula: "Картина Мира Этажа -1: Подтверждается ТОЛЬКО если пользователь сам высказал свое обобщенное убеждение о природе мира/людей/задач ИЛИ выбрал вариант вилки shadow_worker, и это убеждение совпадает с эталоном 'Элемент 8' типа floor1_type. Запрещено списывать картину мира из справочника patterns_9_types_detailed.md без слов пользователя!"
    must_have: "Реально озвученное или подтвержденное пользователем в вилке убеждение о том, почему мир, задачи или люди вокруг опасны, враждебны, требовательны или истощают (по эталону типа floor1_type)."
    must_not_be:
      - "Скопированная из карточки patterns_9_types_detailed.md аксиома ('чувства — балласт, ценность = скорость' и т.п.), которой пользователь НЕ говорил"
      - "Прямая констатация единичного факта без обобщенной картины мира"
    evidence_test: "Высказал ли сам пользователь (или подтвердил выбором вилки shadow_worker) эту картину мира, и совпадает ли она с типом floor1_type?"
    validation_question: "Какое убеждение об опасности или устройстве мира/людей/задач реально озвучил или подтвердил сам пользователь?"

  9:
    name: "Идол"
    layer: "Глубинный (Ложный Рай Этажа -2)"
    floor: "Этаж -2 {3, 6, 9} — Триада травмы (Ядро)"
    formula: "Корневой Идол Этажа -2: Элемент 9 валидируется ТОЛЬКО если: (1) САМ ПОЛЬЗОВАТЕЛЬ прямо озвучил это требование идеального состояния/гарантии ИЛИ подтвердил вариант вилки от shadow_worker (запрещено Валидатору самому сочинять Идол из patterns_9_types_detailed.md!); (2) попадает в эталон 'Элемент 9 (Корневой Идол)' именно типа floor2_type в блоке ЭТАЖ -2 файла patterns_9_types_detailed.md и является прямой заплаткой на подтвержденную Дыру (3)."
    must_have: "Реально подтвержденная самим пользователем (в ответе shadow_worker или прямыми словами) идеализированная точка Б / образ 100% безопасности из эталона Элемента 9 типа floor2_type."
    must_not_be:
      - "Выдуманный Валидатором по справочнику образ ('идеальная система головы', 'непоколебимый тотем' и т.п.), которого пользователь в чате НЕ называл и НЕ выбирал в вилке"
      - "Поверхностное поведенческое избегание или отвлечение в моменте (это Элемент 2, а НЕ Элемент 9!)"
      - "Бытовая цель или защитная компенсация с верхнего этажа (Этажа 0 или Этажа -1)"
    evidence_test: "Подтвердил ли САМ ПОЛЬЗОВАТЕЛЬ в диалоге (ответом на вопрос/вилку shadow_worker или прямыми словами) этот идеальный образ спасения типа floor2_type на Этаже -2?"
    validation_question: "Озвучил или подтвердил ли уже сам пользователь то идеальное состояние спасения (типа floor2_type), которого он требует от себя и жизни?"