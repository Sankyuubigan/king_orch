# SSOT: критерии валидации элементов невроза
# Подключается через <<INCLUDE: ../database/element_validation_rules.yaml>>
# Используется: validator (валидация)
# Определения элементов — в neurosis_architecture.md
# Версия 02.11.2026: формулировки от внешнего специалиста (полный источник:
# tasks/261102_0115-f33a137a/ответ спеца.md). Ключевой принцип версии: каждый
# evidence_test — конструкция «хотя бы один из признаков (а) ИЛИ (б) ИЛИ (в)»
# с текстовыми маркерами вместо клинических абстракций; слова-ловушки лишних
# срабатываний вынесены в стоп-списки must_not_be.

elements:
  1:
    name: "Сопротивление"
    must_have: "Явное указание на внутренний блок, сопротивление, застревание в тупике ИЛИ неспособность войти в естественное состояние / переключиться (расслабиться, уснуть, почувствовать отклик, сдвинуться с места)."
    must_not_be:
      - "Изолированный телесный симптом (боль, болезнь органа) без психологического застревания"
      - "Простое описание внешних трудностей или медленного прогресса в делах без внутреннего ступора/блока"
    evidence_test: "Назван ли в тексте хотя бы один из признаков: (а) прямой внутренний блок, запрет-торможение или сопротивление процессу; (б) неспособность запустить нужное состояние или расслабиться при наличии желания/потребности; (в) ощущение тупика, застревания на месте или вынужденного терпения напряжения?"
    validation_question: "В чём именно человек сейчас заблокирован, застрял или чему внутри себя не может дать ход?"

  2:
    name: "Поведение"
    must_not_be:
      - "Чисто внутренние мысли, мечты, страхи или эмоции без указания на то, как человек действует, бездействует или ведёт себя в реальности"
    evidence_test: "Описана ли устойчивая линия поведения в проблеме: (а) активные действия (ритуалы, приём веществ/еды для успокоения, непрерывное удержание контроля, работа на износ без пауз) ИЛИ (б) пассивная линия (избегание, замирание, отказ от первых шагов, занятие пассивной/выжидательной позиции)?"
    validation_question: "Какие конкретные действия человек совершает на автомате ИЛИ от каких действий/шагов он систематически уклоняется?"

  3:
    name: "Катастрофа"
    formula: "Катастрофа (3) — это образ предельного краха Я или непереносимой боли (исчезновение, поглощение, раздавленность, потеря воли/автономии), от которого человек спасается контролем и правилами (5) или суррогатами (9). Важен экстремальный масштаб угрозы для личности, даже если в тексте это названо словом «страх»."
    must_have: "Названа предельная экзистенциальная или личностная угроза: страх или ощущение полного краха, разрушения, потери себя/воли/границ, поглощения пустотой или другим человеком, тотальной беспомощности перед угрозой."
    must_not_be:
      - "Обычная повседневная эмоция — грусть, раздражение, фоновая тревога, скука (это Элемент 7)"
      - "Бытовой или социальный дискомфорт без угрозы разрушения личности/жизни"
      - "Простая нехватка ресурса или неудача («не получается…», «всё идёт слишком медленно»)"
    evidence_test: "Описана ли в тексте угроза предельного масштаба (исчезнуть, раствориться, быть поглощённым/сожранным, потерять волю и автономию, быть раздавленным обрушением), которая наступит, если человек ослабит контроль, останется без защиты или столкнётся с пугающим объектом?"
    anti_patterns:
      - "Жалоба на снижение качества жизни или неуспех у людей без образа фатального внутреннего краха/поглощения"
    validation_question: "Какой предельный крах, уничтожение границ или невыносимая бездна ждут человека, если его контроль или защиты не сработают?"

  4:
    name: "Самооценка"
    must_not_be:
      - "Обычные высказывания от первого лица о своих действиях, чувствах или восприятии («я чувствую», «я воспринимаю», «я жду», «я не могу») без оценочного ярлыка личности"
      - "Нейтральные анкетные факты, пол, семейное положение или профессия («я мужчина», «я кодер/программист», «живу один»)"
      - "Долженствования («я должен») без оценки того, какой я"
    evidence_test: "Даёт ли человек в тексте прямую качественную оценку своей личности, своему статусу/рангу или называет себя оценочным ярлыком (например: убогий, ничтожный, беззащитный/слабый, дефектный, глупый, великий, жертва)?"
    validation_question: "Каким оценочным словом или статусом (плохой/хороший, убогий/высокоранговый, слабый/сильный) человек определяет самого себя?"

  5:
    name: "Правила"
    must_not_be:
      - "Мягкое пожелание или мечта без жёсткого условия/необходимости («хотелось бы отдохнуть», «хочу, чтобы было хорошо»)"
    evidence_test: "Присутствует ли в тексте жёсткое условие, требование или запрет в одной из форм: (а) императив к себе («я должен», «мне обязательно нужно/требуется», «жизненно необходимо сделать X, чтобы Y»); (б) жёсткое требование к поведению других («для меня критически важно, чтобы партнер делал X»); (в) внутренний запрет/табу на расслабление, потерю контроля или естественное желание?"
    validation_question: "Какое жёсткое правило, обязательное условие или внутренний запрет диктует человеку, как должно быть?"

  6:
    name: "Триггер"
    must_have: "Указание на условие, момент, ситуацию контакта, чужую реакцию ИЛИ конкретную мысль, в ответ на которые запускается/усиливается симптом, блок или эмоция."
    must_not_be:
      - "Описание только внутреннего состояния или симптома вообще («у меня всегда тревога», «болит спина», «либидо на нуле») без указания, в какой ситуации, в какое время, при каком контакте или от какой мысли это проявляется"
    evidence_test: "Названо ли в тексте пусковое условие (отвечающее на вопрос «когда / при каком контакте / от какой мысли или попытки включается проблема?»): (а) время, обстановка или переход в состояние (вечер, тишина, уединение, отход ко сну, попытка расслабиться); (б) контакт с людьми или конкретное поведение другого человека (взаимодействие с противоположным полом, чужая сдержанность, чужая забота/опека); (в) конкретная мысль, образ или рабочая задача (мысль о предстоящем объёме дел, вид стимула/контента)?"
    validation_question: "В какой конкретно момент, при каком контакте/поведении других или от какой мысли включается эта реакция?"

  7:
    name: "Эмоции"
    must_not_be:
      - "Чисто телесные или неврологические ощущения («напряжение», «зажим», «усталость», «дискомфорт») без названной психологической эмоции"
      - "Вторичная реакция досады/злости исключительно на сам тупик или на неработающий симптом без другой эмоциональной ткани проблемы"
      - "Сугубо когнитивное предположение со словом «боюсь/опасаюсь» без описания эмоционального переживания"
    evidence_test: "Названа ли в тексте явно переживаемая психологическая эмоция или устойчивое эмоциональное состояние (грусть, тоска, тревога, страх, неудовлетворённость, отвращение, обида, вина, стыд, злость), которое сопровождает проблему и повторяется в цикле?"
    validation_question: "Какую именно повторяющуюся психологическую эмоцию (кроме физического напряжения и досады на сам симптом) испытывает человек в этом цикле?"

  8:
    name: "Иллюзии"
    must_have: "Присутствие субъективной интерпретации, приписывания скрытого смысла/угрозы, негативного прогноза «если… то» ИЛИ категоричного обобщения/оценки."
    must_not_be:
      - "Сухая констатация объективных фактов или действий без приписывания им скрытого смысла, прогноза или тотальной оценки"
    evidence_test: "Содержит ли текст хотя бы одну из конструкций фильтра восприятия: (а) субъективную трактовку или склейку смыслов («воспринимаю X как Y», «X — значит Y», «убеждение, что за X кроется Y», «кажется, что…»); (б) негативный прогноз («если X, то они будут Y / всё рухнет»); (в) категоричную оценку или тотальное обобщение («тотальный характер», «любое проявление», оценочная поляризация «грязное/чистое»)?"
    validation_question: "Какой субъективный смысл, скрытую угрозу или прогноз человек приписывает происходящему?"

  9:
    name: "Идол"
    must_not_be:
      - "Реалистичное намерение отдохнуть или решить рабочую/жизненную задачу своими силами по существу"
    evidence_test: "Описана ли в тексте хотя бы одна из трёх компенсаторных конструкций: (а) зависимость от вещества, еды, стимула или искусственного создания настроения для глушения дискомфорта; (б) стремление всегда находиться в идеализированном «особом/чистом/идеальном» состоянии вместо решения проблемы; (в) ожидание, что импульс, «огонь» или инициатива придут полностью извне (от партнёра) и запустят реакцию за самого человека?"
    validation_question: "Каким суррогатом (веществом/едой), идеализированным состоянием или ожиданием внешнего «спасителя/импульса» человек пытается компенсировать свой блок?"
