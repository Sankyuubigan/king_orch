# SSOT: Правила валидации элементов невроза (1-9)
# Синхронизировано с neurosis_architecture.md

verdict_language_rules:
  audience: "Тексты элементов e1..e9 и target напрямую отображаются пользователю на визуальной схеме в чате (neurosis-case)."
  style: "Только простые, живые, понятные слова (от 1-го лица или прямая безличная суть состояния), без канцелярита и терминов."
  forbidden_meta_phrases:
    - "пользователь фиксирует / описывает / указывает / считает / оценивает себя"
    - "из контекста вытекает / следует / считывается"
    - "клиент / у человека / предположительно"
  forbidden_jargon:
    - "онтологический / экзистенциальный / категорический императив / императив"
    - "гомеостаз / инфляция эго / я-концепция / депривация / шизоидный / оральный"
    - "пусковой момент / пусковой стимул / ментальный блок / триггер / паттерн / эннеатип"

somatic_filter:
  test_question: "Это описание ментального переживания, эмоции, мысли, убеждения, правила, самооценки или поведенческого паттерна (ДА) — ИЛИ это описание изолированной физической боли, спазма, зажима, телесного дискомфорта и физического рефлекса (НЕТ)?"
  exclude_as_no:
    - "Изолированная физическая боль, спазм, зажим в теле без описания ментального тупика или психологической реакции"
    - "Чисто физический дискомфорт от симптома"
    - "Физиологический рефлекс (желание растянуться, размять мышцу, лечь от физической боли)"
  include_as_yes:
    - "Ментальная реакция на симптом или ситуацию: зацикленность, ощущение тупика, страх, тревога, злость, удержание себя от шага"
    - "Автоматический поведенческий паттерн (активные действия или пассивное избегание/прокрастинация/замирание в ответ на напряжение)"
    - "Эмоциональные состояния, правила-долженствования, убеждения о мире, самоощущение, глубинная боль и идеализированные требования"

elements:
  1:
    name: "Сопротивление"
    layer: "Поверхностный (доступен на входе)"
    floor: "Этаж 0 {1, 4, 7} — Гомеостаз и следствие"
    must_have: "Внутреннее сопротивление между человеком и реальностью прямо сейчас: зацикленность на проблеме, ощущение тупика, невозможность сдвинуться, удержание себя от действия или привычка терпеть напряжение."
    must_not_be:
      - "Изолированная физическая жалоба (боль, спазм, болезнь) без описания психологического застревания или внутреннего сопротивления"
      - "Простое описание внешних фактов без внутренней блокировки восприятия/действия"
    evidence_test: "Есть ли доказательство (прямое описание, неявный контекст или подтвержденный вариант сценария) конкретного внутреннего тупика, навязчивой зацикленности, внутреннего стоп-крана или вынужденного терпения, не дающего сдвинуться с места?"
    validation_question: "В чём именно человек сейчас застрял? Что он терпит или чему внутри сопротивляется прямо сейчас?"

  2:
    name: "Поведение"
    layer: "Поверхностный (доступен на входе)"
    floor: "Этаж -1 {2, 5, 8} — Столкновение с реальностью"
    must_have: "Наблюдаемый автоматический способ реагирования на внутреннее напряжение: что человек систематически ДЕЛАЕТ (активная компенсация) или НЕ ДЕЛАЕТ (пассивное избегание, откладывание, отвлечение)."
    must_not_be:
      - "Чисто внутренние переживания, мысли или эмоции без описания того, как человек поступает в реальности"
      - "Идеализированная картинка желаемого будущего / Ложный Рай (это Элемент 9)"
    evidence_test: "Есть ли доказательство (прямое описание, неявный контекст из рассказа или выбранный сценарий) конкретного стереотипа поведения в ответ на стресс — активного (контроль, споры, угодничество, проверочные ритуалы, суета, спасательство) ИЛИ пассивного (избегание, прокрастинация, замирание, молчаливое проглатывание, уход в простые отвлечения)?"
    validation_question: "Что человек автоматически ДЕЛАЕТ или НЕ делает (избегает, откладывает, замирает), когда сталкивается с этим напряжением?"

  3:
    name: "Катастрофа"
    layer: "Глубинный (Конечное ядро Этажа -2)"
    floor: "Этаж -2 {3, 6, 9} — Триада травмы (Ядро)"
    formula: "Проверка Конечного Корня (Тест «Ядро или Защита» + Сдвиг Этажа на floor2_type): Элемент 3 валидируется ТОЛЬКО при одновременном выполнении 3 условий: (1) Это предельное состояние крушения самого 'Я', которое вскрывается, когда защита Этажа -1 (e2, e5, e8) УЖЕ НЕ СРАБОТАЛА, а НЕ повторение самого защитного мотива Этажа -1; (2) По своей структуре (растворение/поглощение, отверженность/ненужность, обнуление/пустота без побед, дефектность/испорченность, беспомощность/раздавленность, беззащитность/предательство опоры, запертость в страдании) оно точно попадает в эталон 'Элемент 3 (Дыра)' блока ЭТАЖ -2 именно для типа floor2_type (который стоит на шаг Безопасности глубже floor1_type); (3) Уровень Этажа -2 реально проявлен и подтвержден пользователем (прямо, по явному смыслу переживания краха или через выбор варианта вилки shadow_worker) и обнажается при крушении парного ему Корневого Идола (9)."
    must_have: "Точное попадание предельного состояния в эталон Элемента 3 (раздел ЭТАЖ -2 в patterns_9_types_detailed.md) типа floor2_type, лежащего на 2 шага Безопасности глубже Этажа 0."
    must_not_be:
      - "Повторение или перефразировка страха/правила с верхних этажей (Этаж 0 или Этаж -1), когда человек еще не спустился к корневому Этажу -2 (floor2_type)"
      - "Размытая общая жалоба ('будет неприятно', 'устану'), в которой нет предельного состояния типа floor2_type"
      - "Фоновая эмоция (Элемент 7) или внешнее событие (Элемент 6)"
    evidence_test: "Отличается ли это состояние от защиты Этажа -1, совпадает ли оно по структуре с эталоном 'Элемент 3 (Дыра)' типа floor2_type на ЭТАЖЕ -2, и подтверждено ли оно в диалоге (а не просто списано с поверхностного симптома)?"
    validation_question: "Какая предельная внутренняя боль (из эталона типа floor2_type на Этаже -2) откроется внутри человека, если его защита Этажа -1 полностью рухнет?"

  4:
    name: "Самооценка"
    layer: "Глубинный (Самоопределение внутри структуры)"
    floor: "Этаж 0 {1, 4, 7} — Гомеостаз и следствие"
    must_have: "Четкое самоопределение («Кто я и какой я в этой проблеме?»): оценка своей ценности, силы или присвоенная себе жесткая роль (явно названная, реконструируемая из позиции человека в контексте или выбранная в сценарии), соответствующая типу floor0_type."
    must_not_be:
      - "Описание ситуации или других людей без отношения к собственной роли и самоощущению"
      - "Мимолетная эмоция без вывода о том, КАКОЙ Я в этом"
    evidence_test: "Определена ли (прямо, через неявный контекст/реконструкцию по типу floor0_type или выбор сценария) самооценка или роль пользователя в этой ситуации — как в полюсе уязвимости/ущербности, так и в полюсе защитного превосходства?"
    validation_question: "Кем пользователь себя ощущает и какую роль играет в этой проблеме (по эталону типа floor0_type)?"

  5:
    name: "Правила"
    layer: "Промежуточный (Защитный периметр Этажа -1)"
    floor: "Этаж -1 {2, 5, 8} — Столкновение с реальностью"
    formula: "Правило-Кнут Этажа -1: Должен соответствовать эталону 'Элемент 5 (Правило-Кнут)' типа floor1_type в блоке ЭТАЖ -1 файла patterns_9_types_detailed.md (на 1 шаг Безопасности глубже типа floor0_type)."
    must_have: "Жесткое внутреннее требование или запрет ('я обязан / мне нельзя / мир должен X, иначе беда'), явно озвученное, считываемое из контекста защиты пользователя или подтвержденное выбором варианта в вилке, совпадающее с эталоном типа floor1_type."
    must_not_be:
      - "Мягкие бытовые пожелания, не работающие как жесткий закон защиты"
      - "Простое описание факта поведения (Элемент 2) без стоящего за ним правила"
    evidence_test: "Понятен ли (из слов, контекста защиты или выбранной вилки) жесткий внутренний закон/запрет, соответствующий 'Элементу 5' типа floor1_type на Этаже -1?"
    validation_question: "Каким жестким внутренним правилом или запретом (типа floor1_type) пользователь управляет собой в этой проблеме?"

  6:
    name: "Триггер"
    layer: "Поверхностный (доступен на входе)"
    floor: "Этаж -2 {3, 6, 9} — Входящий пробивающий сигнал"
    must_have: "Конкретная жизненная ситуация, внешнее событие, задача, действие/реакция другого человека или вторгающаяся мысль, которые запускают проблемную реакцию."
    must_not_be:
      - "Чисто соматический симптом (физическая боль, спазм, сбой органа)"
      - "Хроническое фоновое состояние или ярлык без конкретной ситуации ('я всегда тревожный')"
    evidence_test: "Понятна ли (из рассказа, контекста или выбранного бытового сценария) конкретная ситуация, задача или чужая реакция, в ответ на которую включается проблемный цикл?"
    validation_question: "Какая конкретная ситуация, задача или чужая реакция запускает всю эту цепь?"

  7:
    name: "Эмоции"
    layer: "Поверхностный / Промежуточный (Топливо цикла)"
    floor: "Этаж 0 {1, 4, 7} — Гомеостаз и следствие"
    must_have: "Повторяющаяся психологическая эмоция (тревога, подавленный гнев/раздражение, обида, вина, тяжесть долга, стыд, зависть, печаль, апатия), которая крутит цикл проблемы на Этаже 0."
    must_not_be:
      - "Физические ощущения (боль, холод, спазм) без эмоционального переживания"
      - "Предельная глубинная катастрофа при полном крахе защит (это Элемент 3; в Элементе 7 живет повседневное эмоциональное топливо цикла)"
    evidence_test: "Доказана ли (прямо или по контексту) конкретная повторяющаяся эмоция, в которой пользователь варится внутри этой проблемы?"
    validation_question: "Какая повторяющаяся эмоция постоянно крутится внутри этой ситуации?"

  8:
    name: "Иллюзии"
    layer: "Глубинный (Фильтр восприятия Этажа -1)"
    floor: "Этаж -1 {2, 5, 8} — Столкновение с реальностью"
    formula: "Картина Мира Этажа -1: Элемент 8 должен соответствовать эталону 'Элемент 8 (Иллюзия / Картина мира)' типа floor1_type в блоке ЭТАЖ -1 файла patterns_9_types_detailed.md и принадлежать тому же типу floor1_type, что и Правило (5) и Поведение (2)."
    must_have: "Глубинное убеждение о том, почему мир, задачи или люди вокруг опасны, враждебны, требовательны или истощают (по эталону типа floor1_type), из которого логически вырастает Правило (5)."
    must_not_be:
      - "Прямая констатация единичного факта без обобщенной картины мира"
      - "Картина мира от другого типа, не совпадающего с выбранным floor1_type"
    evidence_test: "Доказана ли (из слов, неявного контекста защиты или выбранного варианта вилки) искаженная картина мира, совпадающая с эталоном 'Элемент 8' типа floor1_type на Этаже -1 и объясняющая Правило (5)?"
    validation_question: "Какими опасными, требовательными или враждебными видятся мир/люди/задачи на Этаже -1 (по типу floor1_type), что пользователю приходится жить по своему правилу (5)?"

  9:
    name: "Идол"
    layer: "Глубинный (Ложный Рай Этажа -2)"
    floor: "Этаж -2 {3, 6, 9} — Триада травмы (Ядро)"
    formula: "Корневой Идол Этажа -2: Элемент 9 валидируется ТОЛЬКО если: (1) доказательство (из прямых слов, явного раскрытия глубины или подтверждённого варианта вилки shadow_worker) попадает в эталон 'Элемент 9 (Корневой Идол)' именно типа floor2_type в блоке ЭТАЖ -2 файла patterns_9_types_detailed.md; (2) является прямой смысловой заплаткой на Элемент 3 (Дыру) того же самого корневого типа floor2_type, а НЕ простым пересказом избегания с верхнего этажа."
    must_have: "Идеализированная точка Б / образ 100% безопасности из эталона Элемента 9 типа floor2_type в patterns_9_types_detailed.md, которую психика требует как абсолютную гарантию, чтобы никогда не провалиться в свою глубину (3)."
    must_not_be:
      - "Поверхностное поведенческое избегание или отвлечение в моменте (это Элемент 2, а НЕ Элемент 9!)"
      - "Бытовая практическая цель или защитная компенсация с верхнего этажа (Этажа 0 или Этажа -1), не дошедшая по переходу Безопасности до корневого типа floor2_type"
    evidence_test: "Совпадает ли подтвержденная идеальная картинка спасения с эталоном 'Элемент 9 (Корневой Идол)' типа floor2_type на Этаже -2, и закрывает ли она парную ей глубину (3) того же типа?"
    validation_question: "Какого именно идеального состояния или гарантии (по эталону типа floor2_type на Этаже -2) требует психика пользователя, чтобы навсегда закрыть свою корневую боль (3)?"