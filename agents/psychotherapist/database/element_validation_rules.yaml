# SSOT: критерии валидации элементов невроза
# Подключается через <<INCLUDE: ../database/element_validation_rules.yaml>>
# Используется: validator (валидация)
# Определения элементов — в neurosis_architecture.md

elements:
  1:
    name: "Сопротивление"
    must_not_be: ["Изолированная медицинская патология без связи с застреванием и терпением"]
    evidence_test: "Есть ли цитата о ментальном блоке, зацикленности, ИЛИ телесном зажиме/спазме/боли как форме застревания и невозможности сдвинуться?"
    validation_question: "Как именно проблема проявляется прямо сейчас на уровне психики или через телесный зажим/терпение?"

  2:
    # SSOT: neurosis_architecture.md:4 — «что человек ДЕЛАЕТ или НЕ делает как
    # реакцию на внутреннее напряжение (бей/беги/замри, избегание,
    # перфекционизм, контроль, прокрастинация)». Прежняя формулировка сужала
    # это до «поведения, снимаемого на камеру», и пассивные стратегии
    # (избегание, прокрастинация, ступор) выпадали из элемента: наблюдаемого
    # действия нет, есть только его отсутствие.
    name: "Поведение"
    must_not_be: ["Внутренние переживания без внешнего проявления"]
    evidence_test: "Описан ли автоматический поведенческий паттерн — активный (контроль, ритуалы, перфекционизм, попытки всё исправить) ИЛИ пассивный (избегание, прокрастинация, ступор, отказ от действия)? Признак один: человек поступает по заданной схеме, а не подбирает способ под ситуацию."
    validation_question: "Что человек ДЕЛАЕТ или НЕ делает как автоматическая реакция на напряжение?"

  3:
    name: "Катастрофа"
    formula: "Идол-Катастрофа: Катастрофа (3) — предельное непереносимое переживание, которое обнажается при падении защитного фасада-Идола (9) и правил (5). Валидируется true только если названо это состояние краха/непереносимости, а не текущий фоновый дискомфорт."
    must_have: "Названо субъективно непереносимое внутреннее состояние (предельный аффективный крах / глубинная боль), с которым человек сталкивается при крушении или отсутствии своих защитных механизмов (элементы 5, 9). Это точка экстремума, избеганием которой управляется вся система."
    must_not_be:
      - "Привычный фоновый дискомфорт или повседневная повторяющаяся эмоция (это Элемент 7)"
      - "Констатация дефицита или практической невозможности ('хочу, но не могу')"
      - "Внешние неблагоприятные обстоятельства или действия других людей сами по себе без описания личного предельного эмоционального переживания"
    evidence_test: "Описал ли пользователь внутреннее переживание как качественный предел / непереносимый крах, обнажающийся при отказе защитных адаптаций?"
    anti_patterns:
      - "Рутинная жалоба на текущую жизнь, в которой человек продолжает адаптированно существовать"
      - "Фиксация исключительно на внешнем ущербе или чужой реакции без перехода к собственному внутреннему краху"
    validation_question: "С каким предельным непереносимым внутренним переживанием столкнётся человек, если его защитные условия и правила перестанут действовать?"

  4:
    # SSOT: neurosis_architecture.md:6 — «Идентичность. «Кто я в этой ситуации?»
    # Я-концепция (я плохой/хороший, ничтожный/великий). Роль, которую человек
    # играет в этой проблеме». Прежняя формулировка принимала только негативные
    # самоопределения (ущербный, неполноценный, дефектный), а SSOT прямо
    # включает и «хороший/великий», и РОЛЬ как самостоятельный признак.
    name: "Самооценка"
    must_not_be: ["Описание ситуации без самоотнесения"]
    evidence_test: "Отнёс ли пациент себя к этой ситуации — как к «кто я» в ней: оценка своих качеств (в любую сторону), присвоение себе роли или места («должен», «я здесь для того, чтобы», «мне это не полагается») — ИЛИ жалоба на внешние обстоятельства без такого самоотнесения?"
    validation_question: "Кем юзер себя считает в этой ситуации? Какую роль он здесь играет?"

  5:
    # SSOT: neurosis_architecture.md:7 — «Операционные правила (Границы/Запреты).
    # Система долженствований («я должен», «мир обязан»). Автоматические скрипты
    # и инструкции». Прежняя формулировка требовала категоричности без
    # исключений и прямо отвергала «должен» без непременства, тогда как SSOT
    # включает долженствование как таковое — в том числе адресованное миру
    # («мир должен», «так не должно быть»).
    name: "Правила"
    must_not_be: ["Пожелания, не выполняемые как инструкция"]
    evidence_test: "Есть ли правило, запрет или долженствование, которым пациент управляет своим поведением или требует его от мира («я должен/не должен», «мне нельзя», «так не делается», «нормально — значит так»)? Важна функция: оно действует как инструкция, а не выражает желание."
    validation_question: "Каким строго определённым образом юзер требует от себя или от мира действовать?"

  6:
    name: "Триггер"
    must_have: "Конкретный входящий стимул (внешнее событие, контекст ситуации или специфическая мысль/образ), запускающий реакцию"
    must_not_be:
      - "Соматический симптом (боль, орган, сбой тела)"
      - "Изолированное самообвинение или ярлык без запускающего фактора («я неудачник»)"
      - "Изолированная эмоция без стимула («тревога», «тоскливо»)"
    evidence_test: "Назван ли конкретный стимул (событие, контакт или возникшая мысль/образ), который запускает дальнейший цикл?"
    validation_question: "Какой конкретный фактор (действие, ситуация или появившаяся мысль/образ) служит пусковым сигналом?"

  7:
    name: "Эмоции"
    must_not_be: ["Физические ощущения без эмоциональной окраски"]
    evidence_test: "Описана ли конкретная эмоция, которая повторяется и питает проблему?"
    validation_question: "Какие эмоции юзер испытывает при этом? Как именно он себя ощущает?"

  8:
    # SSOT: neurosis_architecture.md:10 — «Искаженная картина мира. фильтры
    # восприятия (убеждения, ценности, верования) — куда смотреть, чего бояться».
    # Прежняя формулировка сводила элемент к «чужой замысел приписывается,
    # скрытое выдаётся за очевидное», то есть к одному частному виду искажения;
    # SSOT шире — это искажение картины мира и фильтры восприятия, включая
    # способы оценки угроз, прогноза и себя.
    name: "Иллюзии"
    must_not_be: ["Прямая констатация того, что произошло, без искажения оценки"]
    evidence_test: "Искажена ли картина мира или себя по сравнению с тем, что было: неверная оценка значимости, прогноза, причин и своего места (преувеличение угрозы, обобщение до всегда/никогда, приписывание намерений, отсечение того, что противоречит выбранному)? Признак — фильтр восприятия, из которого пациент судит о мире и себе, а не просто перечисление событий."
    validation_question: "В момент дискомфорта каков мир и жизнь? Какие убеждения управляют тем, куда он смотрит и чего ждёт?"

  9:
    # SSOT: neurosis_architecture.md:11 — «То, что человек выстроил поверх боли,
    # чтобы получать суррогат счастья или безопасности... Иллюзорная польза от
    # проблемы, то, как психика адаптировалась». Прежняя формулировка требовала,
    # чтобы пациент сам увидел в этом ложь («фальшивое желание», «прикрывается»).
    # Этого самосознания у него обычно нет, а элемент — это СТРУКТУРА защиты, а
    # не его оценка пациентом.
    name: "Идол"
    must_not_be: ["Искренняя задача, которую пациент действительно собирается решить по существу"]
    evidence_test: "Описан ли замещающий способ справляться, который даёт суррогат безопасности, значимости или счастья и подменяет решение проблемы: идеальное состояние, в котором «всё решится само», ритуал, зависимость, особая роль или отношение, «если …, то всё наладится»? Пациенту не обязательно называть это ложным — элемент фиксирует саму конструкцию."
    validation_question: "Во что юзер уходит или за что держится, чтобы заглушить дискомфорт, вместо того чтобы решить, что мешает?"
