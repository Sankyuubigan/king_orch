# SSOT: критерии валидации элементов невроза
# Подключается через <<INCLUDE: ../database/element_validation_rules.yaml>>
# Используется: validator (валидация)
# Определения элементов — в neurosis_architecture.md

elements:
  1:
    name: "Сопротивление"
    must_not_be: ["Физическая боль", "Спазм", "Зажим", "Физический дискомфорт"]
    evidence_test: "Есть ли цитата о ментальном блоке/тревоге/зацикленности между человеком и реальностью?"
    validation_question: "Как именно проблема проявляется прямо сейчас на уровне психики?"

  2:
    name: "Поведение"
    must_not_be: ["Внутренние переживания без внешнего проявления"]
    evidence_test: "Описано ли конкретное поведение, которое можно было бы снять на камеру?"
    validation_question: "Что человек ДЕЛАЕТ или НЕ делает как реакцию на проблему?"

  3:
    name: "Катастрофа"
    must_have: "Названо конкретное невыносимое внутреннее состояние, КУДА человек попадёт если проблема НЕ решится. (Обязательный критерий: То, от чего бежит человек). Критерий подтверждения: из слов юзера видна направленность бегства — он называет конкретное внутреннее состояние, от которого уходит."
    must_not_be:
      - "Текущая фрустрация от проблемы (хуево, плохо, дискомфорт)"
      - "Описание дефицита/нужды (голодный, жаждущий, нужно но не могу)"
      - "Внешние обстоятельства как объект раздражения"
      - "Диагнозы и абстракции без эмоционального ядра"
    formula: "Идол-Катастрофа: анти-идол = зеркальная противоположность element_9"
    evidence_test: "Назвал ли юзер конкретное невыносимое состояние СВОЕГО будущего, если проблема не решится?"
    anti_patterns:
      - "Юзер жалуется на внешние обстоятельства (объект раздражения ≠ катастрофа)"
      - "Юзер описывает поверхностный социальный страх без экзистенциального ядра"
      - "Юзер проецирует угрозу исключительно вовне, полностью скрывая свой внутренний крах"
      - "Юзер избегает темы неприятия и не называет конкретное невыносимое состояние"
    validation_question: "От чего именно бежит человек? Что самое невыносимое, с чем он столкнётся?"

  4:
    name: "Самооценка"
    must_not_be: ["Описание ситуации без самоотнесения"]
    evidence_test: "Назвал ли юзер, кем он себя считает в этой ситуации?"
    validation_question: "Кем юзер себя считает в этой ситуации? Какую роль играет?"

  5:
    name: "Правила"
    must_not_be: ["Пожелания без жёсткой формулировки"]
    evidence_test: "Есть ли чёткое правило/запрет/долженствование, которое управляет поведением?"
    validation_question: "Каким строго определённым образом юзер требует от себя действовать?"

  6:
    name: "Триггер"
    must_have: "Конкретное ментальное событие с внутренней реакцией юзера"
    must_not_be:
      - "Соматический симптом (боль, орган, сбой тела)"
      - "Абстракция без ситуации («я неудачник», «прокрастинация»)"
      - "Эмоция без контекста («тревога», «тоскливо»)"
    evidence_test: "Названа ли конкретная жизненная ситуация + внутренняя реакция юзера на неё?"
    validation_question: "Что конкретно произошло? Где, когда, кто участвовал? Как юзер отреагировал внутри?"

  7:
    name: "Эмоции"
    must_not_be: ["Физические ощущения без эмоциональной окраски"]
    evidence_test: "Описана ли конкретная эмоция, которая повторяется и питает проблему?"
    validation_question: "Какие эмоции юзер испытывает при этом? Как именно он себя ощущает?"

  8:
    name: "Иллюзии"
    must_not_be: ["Реальные факты без искажения"]
    evidence_test: "Видно ли искажение мироощущения? Как юзер видит мир/себя/проблему?"
    validation_question: "В момент дискомфорта каков мир и жизнь? Какие убеждения управляют?"

  9:
    name: "Идол"
    must_not_be: ["Настоящее желание без компенсаторного характера"]
    evidence_test: "Видно ли суррогатную потребность/фальшивое желание, которым человек прикрывается?"
    validation_question: "В какое идеальное состояние юзер хочет сбежать, чтобы заглушить дискомфорт?"
