# Порядок и состав слоёв иерархической проверки 9 элементов.
#
# Бизнес-логика слоёв живёт в агентах `backend/validator_surface.md`,
# `validator_facade.md`, `validator_core.md`; форма ответа каждого слоя объявлена
# контрактом сигнала в `../signals/root.schema.json` (грамматика Method 3 строится
# из него автоматически). Этот файл хранит то, чего нет в контрактах: ПОРЯДОК
# слоёв и то, чей результат видит каждый слой.
#
# `elements` дублирует контракт сигнала — для читаемости. Сверка выполняется
# движком при загрузке (`workflow_engine::validator_layers`), расхождение — ошибка.
#
# ВОРОНКА СТРОГО СВЕРХУ ВНИЗ: `context_from` может ссылаться только на слой,
# объявленный выше. Ссылка вниз означала бы, что слой ждёт результат, который ещё
# не посчитан.

version: 1

layers:
  # Слой 1 — поверхность: что пациент прямо сказал о себе.
  - agent: validator_surface
    elements: [e1, e2, e6, e7]
    context_from: []

  # Слой 2 — защитный фасад: правила, идол, самооценка, иллюзии.
  # Видит поверхность: защита объясняется в связи с ней.
  - agent: validator_facade
    elements: [e4, e5, e8, e9]
    context_from: [validator_surface]

  # Слой 3 — предел: единственный элемент 3 (катастрофа).
  # Видит защиту: катастрофа открывается там, где правила и идол не работают.
  - agent: validator_core
    elements: [e3]
    context_from: [validator_surface, validator_facade]