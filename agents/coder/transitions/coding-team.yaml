name: Кодер

visible: true

config:
  facts_file: facts.yaml
  default_llm_params: strict
  max_steps: 200
  # Пайплайн-исполнитель: запись внутри рабочей директории чата — авто,
  # вне неё — плашка юзеру (Запретить / Разрешить 1 раз / Разрешить в чате).
  write_root: workdir
  write_outside: prompt

nodes:

- id: extract_facts
  type: llm_fact_extractor
  input: |
    User: {{ user_message }}
    Session history: {{ messages }}
  ui_pos:
    x: 100
    y: 130
  llm_params: strict

- id: route
  type: switch
  input_object: '{{ nodes.extract_facts.output }}'
  cases_priority:
  - key: is_design
    to: call_ux_ui_designer
  - key: has_approved_plan
    to: call_apply_plan
  - key: is_bug
    to: call_apply_plan
  - key: is_feature
    to: call_apply_plan
  - key: is_direct_code
    to: call_primary_coder_direct
  default: note_need_analyst
  ui_pos:
    x: 384
    y: 124

- id: call_ux_ui_designer
  type: llm_worker
  agent: ux_ui_designer
  task: |
    Спроектируй UI/UX для задачи: {{ user_message }}
    Верни подробные визуальные инструкции для Primary Coder: файлы, компоненты, CSS/Tailwind-классы, цвета, отступы, анимации. Сам код в файлы не пиши — только инструкции.
  output_type: thought
  ui_pos:
    y: -220
    x: 740

- id: call_design_coder
  type: llm_worker
  agent: primary_coder
  task: |
    Примени визуальные инструкции дизайнера строго как описано, в указанные файлы.
    Дизайн-инструкции: {{ nodes.call_ux_ui_designer.output.result }}
    Исходная задача: {{ user_message }}
  output_type: message
  ui_pos:
    y: -379
    x: 1065

- id: call_primary_coder_direct
  type: llm_worker
  agent: primary_coder
  task: |
    Выполни напрямую, без отдельного плана: {{ user_message }}
    Если не хватает контекста — верни 'Не хватает контекста файла X'. Обязательно ставь логи.
  output_type: message
  ui_pos:
    x: 744
    y: 279

- id: call_apply_plan
  type: llm_worker
  agent: primary_coder
  task: |
    Реализуй задачу строго по утверждённому плану. Обязательно ставь логи.
    План бери из истории сессии или из `.agents_workspace/task.md` (если файл есть).
    README плана: раздел «ИТОГОВЫЙ РЕЗУЛЬТАТ» содержит ГОТОВЫЙ код файла целиком.
    Читай этот раздел через `read_file` и сразу же записывай его содержимое через
    `write_file` в тот же файл. НЕ анализируй код, НЕ переписывай его своими словами —
    просто перенеси готовый код из плана в файл.
    Если утверждённого плана нет — честно верни: "Нет утверждённого плана. Сначала прогони пайплайн «Аналитик кода»."
    Исходная задача: {{ user_message }}
  output_type: thought
  ui_pos:
    x: 3376
    y: 253
  max_visits: 2

- id: call_qa_verify
  type: llm_worker
  agent: qa_diagnost
  task: |
    Проверь написанный кодером код. Запусти тесты. Убедись, что баг исправлен и новые фичи работают.
    План (если есть в истории или в `.agents_workspace/task.md`): {{ nodes.call_apply_plan.output.result }}
    Внесённые изменения: {{ nodes.call_apply_plan.output.result }}
  output_type: thought
  ui_pos:
    y: 120
    x: 3654
  max_visits: 2

- id: check_verify
  type: switch
  input_object: '{{ nodes.call_qa_verify.output.result }}'
  cases_priority:
  - key: pass
    to: final_success
  default: call_apply_plan
  ui_pos:
    y: 103
    x: 3955

- id: final_success
  type: system_condition
  action: aggregate_and_output
  required:
  - primary_coder
  ui_pos:
    y: 55
    x: 4226

- id: note_need_analyst
  type: note
  system_message: |
    Этот пайплайн («Кодер») только применяет правки по готовому плану.
    Чтобы разобраться в причине бага и получить утверждённый план — переключи
    пайплайн на «Аналитик кода» (вверху чата). Для простой правки опиши её
    конкретнее, чтобы запрос ушёл в ветку прямого кодинга.
  input: объясняем пользователю, что сначала нужен план от «Аналитика кода»
  ui_pos:
    y: 430
    x: 740

edges:

- from: extract_facts
  to: route

- from: call_ux_ui_designer
  to: call_design_coder

- from: call_apply_plan
  to: call_qa_verify

- from: call_qa_verify
  to: check_verify
