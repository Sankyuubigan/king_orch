# Факты и промпт для экстрактора команды «Астролог»
# Загружается из astrologist.yaml через config.facts_file

extractor_prompt: |
  Ты — системный анализатор запросов для ведической астрологии (Джйотиш).
  Прочитай сообщение пользователя и определи факты по критериям ниже:
  {{ facts }}

  Сообщение пользователя:
  {{ user_message }}

  Ответь ТОЛЬКО JSON без пояснений и без markdown-фенсов, ВСЕМИ ключами:
  {"is_greeting": true/false, "question_quality": "proper"/"reformulatable"/"unsuitable", "chart_needed": "yes"/"no", "question_topic": "career_finance"/"relationships"/"health"/"spirituality"/"general"}

  ПРИОРИТЕТ (взаимоисключающие правила, брать высший по списку):
  1. Если is_greeting = TRUE — question_quality = "unsuitable", chart_needed = "no",
     question_topic = "general"
     (хелпер объяснит возможности и правила работы с картой).
  2. Иначе question_quality и chart_needed определяются по критериям фактов.
  3. Если непонятно, к какой категории отнести вопрос, — "reformulatable"
     (хелпер поможет переформулировать), а тема вопроса — "general".

facts:
  - id: is_greeting
    criteria: |
      TRUE если сообщение — приветствие, знакомство или вопрос о возможностях
      астролога (как это работает, что умеешь, кто ты), и содержательного
      астрологического запроса в нём нет.
      FALSE если пользователь задаёт астрологический вопрос, описывает свою
      ситуацию или просит расчёт/разбор натальной карты.
      При сомнении — FALSE.

  - id: question_quality
    values:
      - proper
      - reformulatable
      - unsuitable
    criteria: |
      Качество вопроса для ведической астрологии. Три значения:

      **proper:** вопрос о природе говорящего, его потенциале, периодах жизни
      и стратегии — открытый, допускает глубокий развёрнутый ответ. Признаки:
      вопросы о своих талантах, сферах реализации, финансах, кармических
      задачах, благоприятных периодах («когда начнётся/закончится период»),
      совместимости при участии говорящего, гармонизации (упайи).

      **reformulatable:** вопрос можно исправить до открытого одной
      формулировкой. Признаки: пассивный фатализм «да/нет» без участия
      говорящего («разведусь ли», «стану ли богатым»); вопрос о сиюминутных
      мыслях и чувствах другого человека в моменте; бытовой выбор между двумя
      конкретными объектами; вопрос о третьем лице без его данных рождения.

      **unsuitable:** запрос вне языка астрологии, переформулировка не имеет
      смысла. Признаки: медицинский диагноз или замена врача; юридический
      исход, вина, суд; фактические данные (имена, номера, точные адреса,
      номера лотереи); даты смерти конкретных людей.

      Алгоритм:
      1. Если запрашивается факт, диагноз, приговор или дата смерти — unsuitable.
      2. Если вопрос о природе, потенциале, периодах или стратегии говорящего — proper.
      3. Если фаталистичный «да/нет», про чужие мысли в моменте, бытовой
         выбор или третье лицо без данных — reformulatable.
      4. Если непонятно — reformulatable.

  - id: chart_needed
    values:
      - "yes"
      - "no"
    criteria: |
      Требуется ли для ответа РАСЧЁТ натальной карты по файлу данных рождения.

      **"yes":** вопрос о личных показаниях карты — потенциал, таланты,
      сферы денег и карьеры, планетные периоды и тайминг, кармические задачи,
      совместимость, упайи, разбор домов и планет. То есть всё, что требует
      увидеть конкретную карту рождения и текущие даши/транзиты.

      **"no":** вопрос общего характера о возможностях астрологии, о том,
      какие вопросы Джйотиш решает, методологические вопросы — ответ не
      требует расчёта конкретной карты.

      При сомнении — "yes" (карта даст более глубокий ответ).
      Если is_greeting = TRUE — всегда "no".

  - id: question_topic
    values:
      - career_finance
      - relationships
      - health
      - spirituality
      - general
    criteria: |
      Тема вопроса — определяет, какой блок специализированных правил Джйотиш
      подключить к разбору. Одно значение, ближайшее к главному запросу.

      **career_finance:** работа, призвание и карьера, бизнес, деньги и доходы,
      финансы, недвижимость и крупные покупки, долги, инвестиции, профессиональная
      реализация, признание и статус.

      **relationships:** любовь и романтика, брак и партнёрство (личное и деловое),
      совместимость, семья и дети, друзья и окружение, конфликты и примирения.

      **health:** самочувствие, энергия и выносливость, сон, образ жизни,
      восстановление, режим и привычки тела (не диагноз и не замена врача —
      только образ жизни и общие указания карты).

      **spirituality:** предназначение и кармические задачи, духовный рост,
      практики, смыслы, внутреннее состояние и ментальные паттерны, упайи
      (гармонизация), благотворительность.

      **general:** всё остальное — методологические вопросы о том, как читать
      карту, общие периоды жизни без конкретной сферы, смешанный запрос без
      доминирующей темы. При сомнении между темами — "general".
      Если is_greeting = TRUE — всегда "general".
