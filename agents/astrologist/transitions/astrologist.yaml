name: Астролог

config:
  facts_file: facts.yaml
  default_llm_params: creative

entry: user_message

nodes:

- id: user_message
  type: user_message
  ui_pos:
    y: 37
    x: -376

- id: extract_facts
  type: llm_fact_extractor
  input: '{{ nodes.user_message.output.text }}'
  ui_pos:
    x: -119
    y: 30
  llm_params: strict

- id: check_greeting
  type: condition_check
  input_object: '{{ nodes.extract_facts.output }}'
  field: is_greeting
  true_to: ask_helper
  false_to: route
  ui_pos:
    x: 190
    y: 31

- id: route
  type: switch
  input_object: '{{ nodes.extract_facts.output }}'
  switch_field: question_quality
  cases_priority:
  - key: proper
    to: check_chart
  - key: reformulatable
    to: check_chart
  - key: unsuitable
    to: ask_helper
  default: ask_helper
  ui_pos:
    y: 309
    x: 505

- id: check_chart
  type: switch
  input_object: '{{ nodes.extract_facts.output }}'
  switch_field: chart_needed
  cases_priority:
  - key: yes
    to: find_jhd
  - key: no
    to: answer_method
  default: find_jhd
  ui_pos:
    x: 851
    y: 219

- id: ask_helper
  type: llm_worker
  agent: astrologist_helper
  task: |
    Запрос пользователя не готов к астрологическому разбору: либо это
    приветствие или вопрос о возможностях, либо формулировка вне языка
    Джйотиш. Встреть человека: объясни, на какие вопросы ведическая
    астрология отвечает глубоко, почему этот пока не возьмут, и предложи
    переформулировку. НЕ вызывай инструменты — у тебя их нет.

    Сообщение пользователя: {{ nodes.user_message.output.text }}
  output_type: message
  ui_pos:
    y: 506
    x: 1142

- id: answer_method
  type: llm_worker
  agent: astrologist_helper
  task: |
    Пользователь спросил методологически — о том, что умеет Джйотиш и как
    это работает. Карту для такого ответа считать не нужно, и данных
    рождения в этом задании НЕТ: отвечай сам обычным текстом, без карт,
    градусов, дат и периодов — ничего не выдумывай. Скажи своими словами,
    какие вопросы ведическая астрология берёт глубоко (одно живое
    предложение-пример вида «карта покажет…»), и мягко предложи
    переформулировать его интерес под конкретную карту — тогда получится
    настоящий разбор, а не общий разговор. Тон — тёплый и увлечённый, НЕ
    «вы неправильно спросили».

    Сообщение пользователя: {{ nodes.user_message.output.text }}
  output_type: message
  ui_pos:
    y: 357
    x: 1142

- id: find_jhd
  type: custom_tool_call
  ui_pos:
    y: 54
    x: 1161
  tool_file: ../tools/find_jhd_attachment.ts
  args:
    attachments: '{{ nodes.user_message.output.attachments }}'

- id: check_jhd
  type: condition_check
  input_object: '{{ nodes.find_jhd.output }}'
  field: found
  true_to: calc_chart
  false_to: ask_attach
  ui_pos:
    y: -58
    x: 1437

- id: calc_chart
  type: custom_tool_call
  ui_pos:
    x: 1703
    y: -70
  tool_file: ../tools/calc_chart.ts
  args:
    jhd_path: '{{ nodes.find_jhd.output.path }}'

- id: build_knowledge
  type: custom_tool_call
  ui_pos:
    x: 1975
    y: -95
  tool_file: ../tools/build_knowledge.ts
  args:
    lagna: '{{ nodes.calc_chart.output.lagna }}'
    topic: '{{ nodes.extract_facts.output.question_topic }}'
    planets: '{{ nodes.calc_chart.output.planets }}'
    transits: '{{ nodes.calc_chart.output.transits }}'
    dasha: '{{ nodes.calc_chart.output.dasha }}'

- id: ask_attach
  type: llm_worker
  agent: astrologist_helper
  task: |
    Пользователь задал вопрос, для которого нужна его натальная карта, но
    файла данных рождения (.jhd) среди вложений нет. Вежливо объясни, что
    для глубокого ответа нужна карта: попроси выгрузить файл .jhd из
    программы Jagannatha Hora (в ней: File → Save birth data, формат JHD)
    или из любой программы, поддерживающей этот формат, и прикрепить его
    к сообщению. Коротко скажи, что сможет разобрать по карте. НЕ вызывай
    инструменты — у тебя их нет.

    Сообщение пользователя: {{ nodes.user_message.output.text }}
  output_type: message
  ui_pos:
    y: 77
    x: 1705

- id: interpret
  type: llm_worker
  agent: astrologist_reader
  task: |
    Ответь пользователю на его вопрос по карте. Порядок блоков задания —
    от жизни к справке: сначала вопрос человека, затем истина, рассчитанная
    кодом (сводка + база знаний), и только в конце — сырой JSON-справочник
    деталей.

    Вопрос пользователя: {{ nodes.user_message.output.text }}
    Вердикт анализатора (question_quality): {{ nodes.extract_facts.output.question_quality }}
    Тема вопроса (question_topic): {{ nodes.extract_facts.output.question_topic }}

    СВОДКА ИСТИНЫ И БАЗА ЗНАНИЙ ПОД ЭТУ КАРТУ. Текст открывается сводкой
    «это истина, не менять и не додумывать» — лагна, грахи рождения,
    текущая цепочка даш с датами, ближайшие следующие периоды, транзиты;
    дальше — функциональная природа грах для этой лагны, связки «управитель
    дома в доме», йоги, эффекты транзитов по гочаре (там дома от Луны
    рождения), правила периодов даш и правила темы вопроса:
    {{ nodes.build_knowledge.output.text }}

    ПОЛНЫЙ JSON КАРТЫ (справочник деталей: навамша D9, чаракараки, дома,
    полный список махадаш; данные те же, что в сводке выше):
    {{ nodes.calc_chart.output }}

    ПРЕДОХРАНИТЕЛИ — прочитай их ПОСЛЕДНИМИ и пройди по каждому перед тем,
    как писать ответ:
    1. Восходящий знак (лагна) — только тот, что назван в строке «Лагна:»
       сводки. Других вариантов нет, даже если где-то «показалось».
    2. Текущие и будущие периоды времени — только из строк «Текущий период
       …» и «Следующие периоды …» сводки, вместе с их датами. JSON —
       справочник деталей (накшатры, дома, навамша), а НЕ источник дат и
       последовательности периодов. Секции «ПРАВИЛА ПЕРИОДОВ ДАШ» базы
       знаний — общие справочники о смысле периодов, а НЕ описание текущего
       периода этого человека: заголовок вроде «Jupiter6thDasa» не значит,
       что у человека сейчас период Юпитера — текущая цепочка та, что в
       сводке.
    3. Глубина разбора — по горизонту вопроса:
       - короткий горизонт (дни, недели, месяцы, конкретные даты) — разбор
         сосредоточен на активной цепочке даш, ближайших следующих периодах
         и транзитах; полный разбор карты от рождения НЕ делать;
       - общий/стратегический вопрос — опора на ядро карты (лагна, Солнце,
         Луна, сильные йоги) и большой период.
    4. Запрещено: придумывать положения, даты и периоды, которых нет в
       сводке или JSON; повторяющиеся разделы с одними и теми же мыслями
       (например «Разбор», а следом «Синтез» с тем же содержанием);
       канцелярит и учебная лекция вместо живого ответа человеку.
  output_type: message
  ui_pos:
    y: 158
    x: 2349

edges:

- from: user_message
  to: extract_facts

- from: extract_facts
  to: check_greeting

- from: find_jhd
  to: check_jhd

- from: calc_chart
  to: build_knowledge

- from: build_knowledge
  to: interpret
