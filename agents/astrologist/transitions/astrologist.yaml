name: Астролог

config:
  facts_file: facts.yaml
  default_llm_params: creative

entry: user_message

nodes:

- id: user_message
  type: user_message
  ui_pos:
    y: 37
    x: -376

- id: extract_facts
  type: llm_fact_extractor
  input: '{{ nodes.user_message.output.text }}'
  ui_pos:
    x: -119
    y: 30
  llm_params: strict

- id: check_greeting
  type: condition_check
  input_object: '{{ nodes.extract_facts.output }}'
  field: is_greeting
  true_to: ask_helper
  false_to: route
  ui_pos:
    x: 190
    y: 31

- id: route
  type: switch
  input_object: '{{ nodes.extract_facts.output }}'
  switch_field: question_quality
  cases_priority:
  - key: proper
    to: check_chart
  - key: reformulatable
    to: check_chart
  - key: unsuitable
    to: ask_helper
  default: ask_helper
  ui_pos:
    y: 309
    x: 505

- id: check_chart
  type: switch
  input_object: '{{ nodes.extract_facts.output }}'
  switch_field: chart_needed
  cases_priority:
  - key: yes
    to: find_jhd
  - key: no
    to: interpret
  default: find_jhd
  ui_pos:
    x: 851
    y: 219

- id: ask_helper
  type: llm_worker
  agent: astrologist_helper
  task: |
    Запрос пользователя не готов к астрологическому разбору: либо это
    приветствие или вопрос о возможностях, либо формулировка вне языка
    Джйотиш. Встреть человека: объясни, на какие вопросы ведическая
    астрология отвечает глубоко, почему этот пока не возьмут, и предложи
    переформулировку. НЕ вызывай инструменты — у тебя их нет.

    Сообщение пользователя: {{ nodes.user_message.output.text }}
  output_type: message
  ui_pos:
    y: 506
    x: 1142

- id: find_jhd
  type: custom_tool_call
  ui_pos:
    y: 54
    x: 1161
  tool_file: ../tools/find_jhd_attachment.ts
  args:
    attachments: '{{ nodes.user_message.output.attachments }}'

- id: check_jhd
  type: condition_check
  input_object: '{{ nodes.find_jhd.output }}'
  field: found
  true_to: calc_chart
  false_to: ask_attach
  ui_pos:
    y: -58
    x: 1437

- id: calc_chart
  type: custom_tool_call
  ui_pos:
    x: 1703
    y: -70
  tool_file: ../tools/calc_chart.ts
  args:
    jhd_path: '{{ nodes.find_jhd.output.path }}'

- id: build_knowledge
  type: custom_tool_call
  ui_pos:
    x: 1975
    y: -95
  tool_file: ../tools/build_knowledge.ts
  args:
    lagna: '{{ nodes.calc_chart.output.lagna }}'
    topic: '{{ nodes.extract_facts.output.question_topic }}'
    planets: '{{ nodes.calc_chart.output.planets }}'

- id: ask_attach
  type: llm_worker
  agent: astrologist_helper
  task: |
    Пользователь задал вопрос, для которого нужна его натальная карта, но
    файла данных рождения (.jhd) среди вложений нет. Вежливо объясни, что
    для глубокого ответа нужна карта: попроси выгрузить файл .jhd из
    программы Jagannatha Hora (в ней: File → Save birth data, формат JHD)
    или из любой программы, поддерживающей этот формат, и прикрепить его
    к сообщению. Коротко скажи, что сможет разобрать по карте. НЕ вызывай
    инструменты — у тебя их нет.

    Сообщение пользователя: {{ nodes.user_message.output.text }}
  output_type: message
  ui_pos:
    y: 77
    x: 1705

- id: interpret
  type: llm_worker
  agent: astrologist_reader
  task: |
    Дай астрологический разбор и ответь пользователю.

    Вопрос пользователя: {{ nodes.user_message.output.text }}
    Вердикт анализатора (question_quality): {{ nodes.extract_facts.output.question_quality }}
    Тема вопроса (question_topic): {{ nodes.extract_facts.output.question_topic }}
    Данные рождения и натальная карта (JSON: лагна, 9 грах с знаками/градусами/накшатрами/падами/домами D1 и навамшей D9, предрасчёт: управители домов, аспекты-дришти, достоинства, сожжение, варготтама, чаракараки; дома, махадаши, активная цепочка даш на сейчас):
    {{ nodes.calc_chart.output }}
    Транзиты на момент запроса (положения грах и дома натальной карты, которые они проходят):
    {{ nodes.calc_chart.output.transits }}
    База знаний под эту карту и вопрос (функциональная природа грах для лагны, все связки «управитель дома в доме» этой карты, правила темы вопроса):
    {{ nodes.build_knowledge.output.text }}

    Правила разбора:
    1. Если question_quality равен "reformulatable" — сначала выпиши правильную
       формулировку вопроса и объясни, почему Джйотиш глубоко отвечает только
       на такие вопросы.
    2. Читай карту по структурам: лагна и её управитель, положение грах в
       знаках и домах (D1), их накшатры, силы и слабости, навамша (D9) как
       тонкий слой.
    3. Предрасчёт в JSON (управители домов, аспекты, достоинства, чаракараки)
       авторитетен: НЕ пересчитывай его сам и не противоречь ему. Функциональную
       роль планеты и смысл связок «управитель дома в доме» бери из базы знаний,
       стиль изложения — свой, живой и человечный.
    4. Вопросы «когда?» — через активную цепочку даш (MD → AD → PD) и
       транзиты: называй периоды и даты из JSON, не выдумывай сроки.
    5. Все утверждения опирай только на данные из JSON и базы знаний — не
       придумывай положения планет, периоды и связки, которых там нет.
    6. Дай ответ на вопрос пользователя с практическим итогом и, где уместно,
       с упайями (привычки, образ жизни, работа с мышлением).
  output_type: message
  ui_pos:
    y: 158
    x: 2349

edges:

- from: user_message
  to: extract_facts

- from: extract_facts
  to: check_greeting

- from: find_jhd
  to: check_jhd

- from: calc_chart
  to: build_knowledge

- from: build_knowledge
  to: interpret
