name: Поисковый специалист

visible: true

config:
  facts_file: facts.yaml
  default_llm_params: creative

nodes:

# ── Классификация и маршрутизация ──

- id: extract_facts
  type: llm_fact_extractor
  input: |
    User: {{ user_message }}
    Session history (последние сообщения сессии): {{ messages }}
  llm_params: strict

- id: route
  type: switch
  input_object: "{{ nodes.extract_facts.output }}"
  cases_priority:
  - key: has_known_source
    to: call_quick
  - key: needs_docs
    to: call_docs
  - key: needs_github
    to: call_github
  - key: needs_academic
    to: call_academic
  - key: needs_video
    to: call_video
  - key: needs_deep_research
    to: decompose_topic
  default: call_web

# ── Быстрая ветка: канонический источник ──

- id: call_quick
  type: llm_worker
  agent: quick_finder
  task: |
    Ответь пользователю.

    Вопрос (переписанный, приоритет): {{ nodes.extract_facts.output.rewritten_query }}
    Исходный вопрос пользователя: {{ user_message }}
  output_type: thought

- id: eval_quick
  type: llm_worker
  agent: answer_evaluator
  task: |
    Оцени качество черновика ответа на вопрос по чеклисту (полнота, свежесть, релевантность, противоречия, источники, точность).

    Вопрос: {{ nodes.extract_facts.output.rewritten_query }}

    Черновик: {{ nodes.call_quick.output.result }}
  output_type: thought

- id: check_eval_quick
  type: switch
  input_object: "{{ nodes.eval_quick.output.result }}"
  cases_priority:
  - key: pass
    to: final_quick
  default: improve_quick

- id: improve_quick
  type: llm_worker
  agent: quick_finder
  task: |
    Оценщик посчитал черновик недостаточно качественным. Улучши ответ: перепроверь факт через свои инструменты и учти замечания.

    Вопрос: {{ nodes.extract_facts.output.rewritten_query }}

    Твой прошлый черновик (содержит источники, которые ты уже открывал — НЕ открывай их повторно): {{ nodes.call_quick.output.result }}

    Вердикт оценщика (JSON): {{ nodes.eval_quick.output.result }}

    ВАЖНО: из вердикта извлеки "reasons" (замечания) и "improvement_plan" (план улучшения) и следуй им.
    Верни УЛУЧШЕННЫЙ полный ответ обычным текстом (без JSON) — он пойдёт пользователю.
  output_type: thought

- id: eval_quick2
  type: llm_worker
  agent: answer_evaluator
  task: |
    Оцени качество УЛУЧШЕННОГО черновика по тому же чеклисту (полнота, свежесть, релевантность, противоречия, источники, точность). Учти, что первый вердикт уже был — оценивай именно исправленный черновик.

    Вопрос: {{ nodes.extract_facts.output.rewritten_query }}

    Улучшенный черновик: {{ nodes.improve_quick.output.result }}

    Первый черновик (для сравнения): {{ nodes.call_quick.output.result }}

    Первый вердикт (JSON): {{ nodes.eval_quick.output.result }}
  output_type: thought

- id: check_eval_quick2
  type: switch
  input_object: "{{ nodes.eval_quick2.output.result }}"
  cases_priority:
  - key: pass
    to: final_quick_improved
  default: honest_fail_quick

- id: final_quick
  type: system_condition
  action: aggregate_and_output
  required: ["quick_finder"]

- id: final_quick_improved
  type: system_condition
  action: aggregate_and_output
  required: ["quick_finder"]

- id: honest_fail_quick
  type: llm_worker
  agent: quick_finder
  task: |
    Твой черновик дважды не прошёл оценку качества. Верни пользователю честный ответ: возьми свой ЛУЧШИЙ черновик и добавь в конец секцию «Неотвеченные части / степень уверенности» — перечисли, что именно не удалось подтвердить и почему, на основе замечаний оценщика.

    Вопрос: {{ nodes.extract_facts.output.rewritten_query }}

    Твой улучшенный черновик: {{ nodes.improve_quick.output.result }}

    Вердикты оценщика: первый — {{ nodes.eval_quick.output.result }}, второй — {{ nodes.eval_quick2.output.result }}
  output_type: message

