name: Поисковый специалист

visible: true

config:
  facts_file: facts.yaml
  default_llm_params: creative

nodes:

- id: extract_facts
  type: llm_fact_extractor
  input: |
    User: {{ user_message }}
    Session history (последние сообщения сессии): {{ messages }}
  llm_params: strict

- id: route
  type: switch
  input_object: "{{ nodes.extract_facts.output }}"
  cases_priority:
  - key: has_known_source
    to: call_quick
  - key: needs_docs
    to: call_docs
  default: call_web

- id: call_quick
  type: llm_worker
  agent: quick_finder
  task: |
    Ответь пользователю. Вопрос: {{ user_message }}
  output_type: message

- id: call_docs
  type: llm_worker
  agent: docs_researcher
  task: |
    Ответь пользователю. Вопрос: {{ user_message }}
  output_type: message

- id: call_web
  type: llm_worker
  agent: web_researcher
  task: |
    Ответь пользователю. Вопрос: {{ user_message }}
  output_type: thought

- id: eval_answer
  type: llm_worker
  agent: answer_evaluator
  task: |
    Оцени качество черновика ответа на вопрос по чеклисту (полнота, свежесть, релевантность, противоречия, источники, точность).

    Вопрос: {{ user_message }}

    Черновик: {{ nodes.call_web.output.result }}
  output_type: thought

- id: check_eval
  type: switch
  input_object: "{{ nodes.eval_answer.output.result }}"
  cases_priority:
  - key: pass
    to: final_web
  default: improve_web

- id: improve_web
  type: llm_worker
  agent: web_researcher
  task: |
    Оценщик посчитал твой черновик недостаточно качественным. Улучши ответ: учти замечания и выполни план улучшения.

    Вопрос: {{ user_message }}

    Твой прошлый черновик: {{ nodes.call_web.output.result }}

    Вердикт оценщика (JSON): {{ nodes.eval_answer.output.result }}

    ВАЖНО: из вердикта извлеки "reasons" (замечания) и "improvement_plan" (план улучшения) и следуй им. Если замечание требует дополнительных проверок (перечитать источник, проверить версию, свежие данные) — сделай это через свои инструменты поиска.

    Верни УЛУЧШЕННЫЙ полный ответ обычным текстом (без JSON) — он пойдёт пользователю.
  output_type: message

- id: final_web
  type: system_condition
  action: aggregate_and_output
  required: ["web_researcher"]

edges:

- from: extract_facts
  to: route

- from: call_quick
  to: END

- from: call_docs
  to: END

- from: call_web
  to: eval_answer

- from: eval_answer
  to: check_eval

- from: improve_web
  to: END