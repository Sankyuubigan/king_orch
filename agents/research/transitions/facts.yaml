# Факты и промпт для экстрактора
# Загружается из search-specialist.yaml через config.facts_file

extractor_prompt: |
  Ты — системный анализатор запросов. Прочитай сообщение пользователя и историю сессии.
  Выполни ДВЕ задачи:

  ЗАДАЧА 1 — определи факты (boolean) по критериям ниже:
  {{ facts }}

  ЗАДАЧА 2 — перепиши вопрос (rewritten_query):
  Перепиши ПОСЛЕДНИЙ вопрос пользователя в самодостаточную форму, понятную БЕЗ истории
  диалога — так, как его можно отправить в поисковик. Примеры:
  - «а какие недостатки?» (после обсуждения электромобилей) → «Недостатки электромобилей»
  - «какой курс?» (после разговора о долларе) → «Курс доллара к рублю сегодня»
  - «в Москве?» (после вопроса о погоде) → «Погода в Москве сегодня»
  Не добавляй лишнего — перепиши ровно то, о чём спрашивает пользователь, кратко и конкретно.
  Поле rewritten_query ОБЯЗАТЕЛЬНО: возвращай его ВСЕГДА, даже если вопрос уже самодостаточен
  (тогда просто повтори его слово в слово).

  Сообщение пользователя:
  {{ user_message }}

  Ответь ТОЛЬКО JSON без пояснений и без markdown-фенсов:
  {"has_known_source": true/false, "needs_docs": true/false, "needs_deep_research": true/false, "rewritten_query": "переписанный вопрос"}

facts:
  - id: has_known_source
    criteria: |
      TRUE если вопрос имеет ЗАРАНЕЕ ИЗВЕСТНЫЙ канонический источник, где ответ лежит гарантированно:
      - погода в городе → wttr.in (Weather)
      - биография, дата/событие истории, определение термина, столица, энциклопедический факт → Wikipedia
      - текущее время/таймзона → GetCurrentTime
      FALSE если ответ НЕ лежит в энциклопедии или сервисе погоды: актуальные новости, курсы валют, цены, версии библиотек, документация, сравнения, рекомендации, поиск сайтов/сервисов, события "на сегодня", технические вопросы.
      При сомнении — FALSE.

  - id: needs_docs
    criteria: |
      TRUE если вопрос относится к ДОКУМЕНТАЦИИ КОДА/БИБЛИОТЕК:
      - версии крейтов/npm/pip-пакетов, актуальный API, сигнатуры функций
      - README или GitHub-репозиторий, changelog/релизы библиотек
      - установка зависимости, примеры использования библиотеки/фреймворка
      - решение технической ошибки в коде
      FALSE если вопрос общий (новости, курсы, факты, погода, поиск сайтов) или не про код и библиотеки.
      FALSE если вопрос сравнивает несколько библиотек/технологий между собой (это needs_deep_research).
      При сомнении — FALSE.

  - id: needs_deep_research
    criteria: |
      TRUE — вопрос ИССЛЕДОВАТЕЛЬСКИЙ: правильный ответ требует обобщения из 3+ независимых
      источников или нескольких областей знаний. Маркеры:
      - сравнение/выбор: «сравни X и Y», «X vs Y vs Z», «что лучше/какой выбрать»,
        «отличия X от Y», «насколько X лучше Y»
      - обзор/эволюция: «обзор решений/подходов», «все способы сделать X»,
        «история и эволюция X», «как устроен X изнутри», «экосистема/ландшафт X»
      - многокомпонентность: вопрос с 2+ независимыми аспектами («X и Y», перечисление тем),
        каждый тянет на отдельный поиск
      - глубина: «подробный разбор», «полный гайд по X», «что нужно знать перед X»
      FALSE — вопрос ТОЧЕЧНЫЙ, ответ лежит в 1-2 источниках:
      - факт/определение/биография → Wikipedia (has_known_source)
      - версия пакета, API, сигнатура, ошибка в коде → docs (needs_docs)
      - новость, цена, курс, событие «на сегодня», один конкретный ответ → обычный веб-поиск
      При сомнении — FALSE: deep research = 7+ LLM-вызовов; ошибка в FALSE ведёт в default-ветку
      с оценщиком (качество всё равно контролируется), ошибка в TRUE стоит дорого.