name: Работа с изображениями
description: Генерация, редактирование и увеличение разрешения изображений по текстовому описанию или вложенным фото.

config:
  facts_file: facts.yaml
  default_llm_params: creative

# Точка входа графа — текст, отправленный пользователем в чат.
entry: user_message

nodes:
  # ── Источник данных: текст пользователя (без LLM) ──
  - id: user_message
    type: user_message
    ui_pos:
      x: -320
      y: 40

  # ── Классификация через LLM (вложения и история оцениваются экстрактором
  #    через блок {{ image_candidates }} — short-circuit УБРАН 19.10.2026) ──

  - id: extract_facts
    type: llm_fact_extractor
    input: "{{ nodes.user_message.output.text }}"
    llm_params: strict
    ui_pos:
      x: -80
      y: 40

  - id: route
    type: switch
    input_object: "{{ nodes.extract_facts.output }}"
    cases_priority:
      - key: needs_image_edit
        to: enhance_prompt_edit
      - key: needs_image_upscale
        to: upscale_image
      - key: needs_image_generate
        to: enhance_prompt_gen
    default: no_image_task
    ui_pos:
      x: 140
      y: 40

  # ── Промпт-энхансер (PRP 29.10.26 Шаг 3): backend-ноды, работающие
  #    ДО терминальных исполнителей; их результат потребляется через шаблоны
  #    {{ nodes.enhance_prompt_*.output.result }} (у llm_worker выход — поле
  #    result). Не потокят в чат: output_type по умолчанию (thought). ──

  - id: enhance_prompt_edit
    type: llm_worker
    agent: image_prompt_enhancer
    task: |
      Режим: ПРАВКА изображения.

      Исходная идея пользователя: {{ nodes.user_message.output.text }}
    ui_pos:
      x: 250
      y: -120

  # ── Ветка редактирования (терминальная) ──

  - id: edit_image
    type: llm_worker
    agent: image_editor
    task: |
      Отредактируй изображение, на которое пользователь указал в переписке или прикрепил к сообщению.

      Правка: {{ nodes.user_message.output.text }}

      Улучшенный промпт (заготовка от Улучшителя — используй как основу для
      своего промпта правки; описания референсов словами переведи в теги
      <imageN> по своим правилам): {{ nodes.enhance_prompt_edit.output.result }}
    output_type: message
    ui_pos:
      x: 360
      y: -80

  # ── Ветка увеличения разрешения (терминальная) ──

  - id: upscale_image
    type: llm_worker
    agent: image_upscaler
    task: |
      Увеличь разрешение изображения, на которое пользователь указал в переписке или прикрепил к сообщению.

      Уточнение задачи: {{ nodes.extract_facts.output.rewritten_query }}
      Исходный текст пользователя: {{ nodes.user_message.output.text }}
    output_type: message
    ui_pos:
      x: 360
      y: 40

  # ── Промпт-энхансер: генерация (PRP 29.10.26 Шаг 3) ──

  - id: enhance_prompt_gen
    type: llm_worker
    agent: image_prompt_enhancer
    task: |
      Режим: ГЕНЕРАЦИЯ изображения с нуля.

      Исходная идея пользователя: {{ nodes.user_message.output.text }}
    ui_pos:
      x: 250
      y: 120

  # ── Ветка генерации (терминальная) ──

  - id: generate_image
    type: llm_worker
    agent: image_generator
    task: |
      Сгенерируй изображение с нуля.

      Описание задачи: {{ nodes.extract_facts.output.rewritten_query }}
      Исходный текст пользователя: {{ nodes.user_message.output.text }}

      Улучшенный промпт (заготовка от Улучшителя — используй как основу для
      своего английского промпта): {{ nodes.enhance_prompt_gen.output.result }}
    output_type: message
    ui_pos:
      x: 360
      y: 160

  # ── Не image-запрос: помощник (объясняет возможности, уточняет задачу) ──

  - id: no_image_task
    type: llm_worker
    agent: image_helper
    task: |
      Классификатор НЕ распознал задачу для изображения (ни edit, ни upscale, ни
      generate): пользователь либо спрашивает о возможностях, либо описал задачу
      неточно. Объясни коротко, что умеет команда, и уточни, что именно сделать.
      НЕ вызывай инструменты.

      Сообщение пользователя: {{ nodes.user_message.output.text }}
    output_type: message
    ui_pos:
      x: 360
      y: 280

edges:
  - from: user_message
    to: extract_facts

  - from: extract_facts
    to: route

  - from: enhance_prompt_edit
    to: edit_image

  - from: enhance_prompt_gen
    to: generate_image
